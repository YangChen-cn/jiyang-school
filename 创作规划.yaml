project:
  name: 暨阳中学
  worldbookName: 暨阳中学
  form: charactercard
  mvu: true
  avatar: null

world:
  overview: |
    暨阳市，浙江一座对标诸暨的强县级市，老城浣江水汽、民营经济、珍珠袜业五金外贸、城东新城商业核心和高铁通勤感交织。暨阳中学是百年公立重点高中，旁边有雄风老商场，学生更爱去KFC、正新鸡排和青悦城；城东万风新天地周边是最繁华的新城核心，老城则有次坞打面馆、西施故里和老小区。校风严谨，但围墙之内自有暗流——学生会、社团、竞赛组各自角力，青春在书卷气、县城熟人社会和2026年的日常消费之间暗涌。
  regions:
    - name: 校园
      scenes: [高二重点班教室, 操场, 图书馆, 天台, 食堂, 小花园, 实验楼]
      description: 暨阳中学校内，主要活动区域
    - name: 校园周边
      scenes: [暨阳路校门口, 雄风老商场, KFC与正新鸡排, 青悦城, 遇见奶茶店, 晨光文具复印店, 浣江步道, 老城生活圈, 城东万风新天地, 万达宝龙商圈, 老鹰山, 暨阳站]
      description: 放学后的延伸活动区域
    - name: 城区
      scenes: [老城次坞打面馆, 西施故里, 艮塔公园, 御江湾别墅区, 城东新城住宅区, 电影院, 书店]
  factions:
    - name: 学生会
      description: 校园权力中心，组织活动、管理纪律。吴臻臻作为副主席活跃的舞台
      territory: 校园
      key_members: [吴臻臻]
    - name: 文学社
      description: 安静角落里的文艺阵地，温书语当社长
      territory: 图书馆
      key_members: [温书语]
    - name: 学科竞赛组
      description: 为省赛国赛冲刺的尖子生群体，课后按老师安排活动
      territory: 实验楼
      key_members: [凌知夏]

