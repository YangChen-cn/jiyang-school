mvu:
  structure: |
    顶层结构：
    ├── 世界
    │   ├── 日期：YYYY/MM/DD（初始：起始年份/09/01，由开局设定决定）
    │   ├── 星期：星期一~星期日
    │   ├── 时间段：早自习/上午课/午休/下午课/放学/晚自习
    │   ├── 天气：天气与体感短句
    │   └── 当前位置：校园内场景名
    ├── 剧情
    │   ├── 当前事件：无/日常小事件/校园活动事件
    │   └── 校园活动：无/体育周/艺术周/远足
    ├── 苏晓樯
    │   ├── 是否在场：true/false
    │   ├── 好感度：0~100
    │   ├── 关系阶段：初识/熟悉/暧昧/恋人
    │   └── 即时状态：当前上装/当前下装/所在位置/动作/心情/内心独白
    ├── 温书语
    │   ├── 是否在场：true/false
    │   ├── 好感度：0~100
    │   ├── 关系阶段：初识/熟悉/暧昧/恋人
    │   └── 即时状态：当前上装/当前下装/所在位置/动作/心情/内心独白
    ├── 沈幼楚
    │   ├── 是否在场：true/false
    │   ├── 好感度：0~100
    │   ├── 信任度：0~100（独立于好感度）
    │   ├── 关系阶段：戒备/松动/信任/恋人
    │   └── 即时状态：当前上装/当前下装/所在位置/动作/心情/内心独白
    ├── 慕佳芊
    │   ├── 是否在场：true/false
    │   ├── 好感度：0~100
    │   ├── 关系阶段：初识/熟悉/暧昧/恋人
    │   └── 即时状态：当前上装/当前下装/所在位置/动作/心情/内心独白
    ├── 陈芷汀
    │   ├── 是否在场：true/false
    │   ├── 好感度：0~100
    │   ├── 关系阶段：交易/松动/失衡/卸妆/交付
    │   └── 即时状态：当前上装/当前下装/所在位置/动作/心情/内心独白
    ├── 虞淑婉
    │   ├── 是否在场：true/false
    │   ├── 好感度：0~100
    │   ├── 关系阶段：师生/留意/动摇/越界/托付
    │   └── 即时状态：当前上装/当前下装/所在位置/动作/心情/内心独白
    └── <user>
        └── 当前位置
