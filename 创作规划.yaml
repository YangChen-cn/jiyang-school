        - name: 戒备期
          main: [沉默, 回避]
          accent: [警觉]
          condition: affection_youchu < 20
          description: 习惯性缩小存在感，对触碰敏感，对善意既渴望又恐惧
        - name: 松动期
          main: [隐忍, 观察]
          accent: [感激]
          condition: affection_youchu >= 20 && affection_youchu < 50
