ejs:
  # 注意：本段为设计意图记录，当前不会进入构建。条目显隐/段落控制实际由
  # 世界书正文内的 EJS / ST-Prompt-Template 装饰器执行。
  generate_before:  # 已废弃：原 EJS预处理 条目已从构建移除（define 名全卡零引用）
  entries:
    - name: 学校详情
      complexity: 条目显隐
      condition: 'getvar(''stat_data.世界.所在区域'', { defaults: '''' }) === ''校园'''
    - name: 周边街区
      complexity: 条目显隐
      condition: 'getvar(''stat_data.世界.所在区域'', { defaults: '''' }) === ''周边'''
    - name: 苏晓樯_性格调色盘
      complexity: 段落控制
      stages:
        - name: 初识期
          condition: affection_xiaotian < 20
        - name: 熟悉期
          condition: affection_xiaotian >= 20 && affection_xiaotian < 50
        - name: 暧昧期
          condition: affection_xiaotian >= 50 && affection_xiaotian < 80
        - name: 恋人初期
          condition: affection_xiaotian >= 80 && affection_xiaotian < 90
