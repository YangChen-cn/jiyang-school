        - name: 越界期
          main: [温暖, 挣扎]
          accent: [犹豫, 隐秘]
          condition: affection_jiaqian >= 50 && affection_jiaqian < 80
          description: 感情已无法用师生关系解释，每一次"偶然"靠近都是精心计算的结果，在深夜反复拷问自己
        - name: 决定期
          main: [温暖, 认真]
          accent: [犹豫, 坚定萌芽]
          condition: affection_jiaqian >= 80 && affection_jiaqian < 90
          description: 决定等<user>毕业，暗中把关系锚定在"未来"，在职业边界内做最大限度的靠近
        - name: 交付期
          main: [温暖, 认真]
          accent: [交付, 情欲]
          condition: affection_jiaqian >= 90
          description: 红线已跨过，以全部的经验和温柔接纳<user>，在亲密中完成从"老师"到"女人"的完整转身
    tri_faceted: false

  - name: 吴臻臻
    type: NPC
    function: 班长兼学生会副主席，虚荣驱动型，一切行为离不开被看见被认可
