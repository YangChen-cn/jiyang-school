探索记录规则:
  路径: stat_data.探索.记录
  用途: 保存本聊天中玩家实际知道的线索、明确作出的约定和持续相关的经历；不是任务派发器。
  字段: 每项使用 日期、类别、内容、来源、状态。类别为线索/约定/经历；状态为待核实/未完/已确认/已结束；内容简短具体，来源写亲眼观察、某人告知或某份资料。
  更新:
    - 无新事实时不改；同一事项补充或更正原项，不每轮新增。传闻和猜测标待核实，完成或取消的约定标已结束。
    - 最多保留24项；接近上限时将同一已结束事件合并成一项，保留未完约定和关键证据来源，不凭空丢弃未解决事项。
    - 新聊天为[]。旧聊天若缺少探索对象，先add /探索为{"记录":[]}；仅缺数组时add /探索/记录为[]；然后才add /探索/记录/-。不得清空已有记录、关系、物品或位置。
    - 回滚、分支及历史面板使用对应消息层变量，不从浏览器缓存恢复剧情；不要把最新结论补进早先记录。
    - 只记录叙事中实际发生的内容。不写未见人物的内心、未揭示地点、后台真相、未来剧情或替玩家接受的任务。
