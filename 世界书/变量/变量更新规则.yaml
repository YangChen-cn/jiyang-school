---
变量更新规则:
  核心原则:
    - 开局初始化（最高优先级）：游戏开始时除好感度/信任度/事件冷却外，变量一律为空字符串/0/false——不同开场白的时间、地点、在场角色不同。第一轮依据所选开场和玩家档案补齐已知日期、时间、地点及在场状态；未知的外貌、动作或人物去向留空，后续有证据再补。
    - 补齐依据：以开场白正文明确写出的事实为准（季节、时刻、场景、在场人物、天气）；开局场景补丁补足正文未注明的时刻；已知事实优先。不同开场的时间线彼此独立。
    - 初始关系阶段：苏晓樯=初识、温书语=初识、沈幼楚=戒备、凌知夏=初识、慕佳芊=初识、陈芷汀=交易、虞淑婉=师生。初始好感度/信任度均为 0。
    - 每轮叙事结束后，所有在场（是否在场=true）且在剧情中产生了交集的角色，必须更新：动作、心情、内心独白——每轮必改，哪怕只改一句话。
    - 好感度/信任度/关系阶段在发生触发事件后立即更新，不要等到下一轮。
    - 所在位置/当前上装/当前下装在发生变化时更新，无变化沿用旧值。
    - 未出场角色（是否在场=false）的变量不需要更新，保持上一轮的值即可。
    - 世界与剧情的状态必须在每次更新中保持一致：场景切换时同步更新 世界.当前位置、所在区域、私密程度及 主角.当前位置，并重新判断每个角色是否实际到场；留在旧地的人保持其位置。

  世界:
    起始年份:
      format: YYYY
      check:
        - 开局时由开局设定写入（例如 2020），代表剧情开始的那一年 9 月、高二上开学
        - 写入后不再随意更改；只有<user>明确要求换年份/换时间线时才改
        - 学期与毕业年份一律以它为基准换算，不要退回 2020
    日期:
      format: YYYY/MM/DD
      check:
        - 第一轮按开场白补齐（开学第一天为 起始年份/09/01；起始年份由开局设定写入 世界.起始年份）
        - 时间跨到次日（"第二天""过了一夜""几天后"）时日期推进对应天数；不跨日不变
        - 与 校历 的日期区间保持一致
    星期:
      type: 星期一|星期二|星期三|星期四|星期五|星期六|星期日
      check:
        - 随日期推进同步更新，日期不变时不要单独修改
    时间段:
      type: 早晨|早自习|上午课|课间|午休|下午课|放学|晚自习|夜间；周末或校外可用上午、下午、傍晚等自然时段
      check:
        - 第一轮按开场白补齐
        - 推进顺序：早自习→上午课→午休→下午课→放学→晚自习→次日早自习
        - 按玩家明确等待、转场或快进的幅度更新；同行几分钟仍可处于同一时段。场景连续时保持原值，铃声只有实际进入下一时段时才更新。
        - 跨到次日时同时推进 日期 与 星期
    天气:
      check:
        - 第一轮按开场白补齐；没有天气描写时按季节给一个合理的默认值
        - 只有剧情中明确出现天气变化、季节体感、室内外环境变化时才更新
        - 没有天气变化描写时沿用旧值，不要每轮主动改天气
    当前位置:
      check:
        - 只在<user>实际抵达、已明确上路进入途中场景或获确认的转场时更新。问路、查看地图、计划出门、别人离开都保持原位。允许记录叙事中新出现的地点。
        - 与 所在区域 同步更新
    所在区域:
      type: 校园|周边|城区|家|其他
      check:
        - 校园=校内场所（教室/办公室/图书馆/操场/食堂/行政楼/礼堂等）；周边=学校附近（校门口/雄风/KFC/青悦城/浣江步道等）；城区=市区地点（西施故里/艮塔公园/万达等）；家=主角或角色家中；其他=无法归类（医院/长途车内）
        - 场景切换必须同步更新，不允许沿用上一场景的区域
    私密程度:
      type: 公开|半私密|独处
      check:
        - 公开=公共空间或有无关第三人在场；半私密=少数人在场/角落/空教室；独处=只有<user>与某角色且短时间不会被打断
        - 每次场景切换重新判断；不确定时取 公开

  剧情:
    推进节奏:
      type: 日常铺垫|事件触发|余波处理
      check:
        - 第一轮补齐为 日常铺垫
        - <user>提出明确行动、地点、邀约、拒绝、调查或找人时，优先按<user>行动更新剧情，不要为了套事件池而改写方向
        - 默认保持 日常铺垫；当本轮出现明确事件压力、任务、邀请、冲突或校园活动节点时改为 事件触发
        - 事件被<user>回应、角色情绪残留、选择后果发酵时改为 余波处理
        - 余波处理完成、没有新压力时回到 日常铺垫
    当前事件:
      type: 无|班费表格|竞赛通知|放学邀约|商场偶遇|流言苗头|老鹰山传闻|班级篮球对抗赛|啦啦队后勤|受伤处理|赛后庆功|十佳歌手报名|排练|文艺汇演|舞台救场|路线分组|掉队照顾|返程座位|国庆出游|假期朋友圈|补习配对|考前压力|排名公布|成绩单反应|寒假邀约|年前采购|家庭拜访|拜年消息|新年愿望|元日约定|开学周
      check:
        - 本轮没有明确事件时保持 无
        - <user>自由推进产生的新方向可写最贴近的事件名；若枚举中没有匹配项，AI可自行总结一个简短事件名（如"放学后同行""小卖部跑腿""文学社活动""图书馆偶遇"等），不超过8个字
        - 发生校园任务、活动铺垫、选择压力或后果余波时，写最贴近的事件名
        - 未解决且本轮仍相关时保留事件名；解决后改为 无 或记录已经发生的余波。只听闻活动时不把它记成主角经历。
    当前nsfw:
      type: boolean
      check:
        - 初始为 false；第一轮保持 false
        - 当叙事中某角色与<user>之间开始发生或即将发生明确性行为（前戏、插入、口交等实质性接触）时，翻为 true
        - 性行为完全结束、场景切换到非性场景（时间跳跃、地点变换、日常校园活动恢复）后，翻回 false
        - 温存期（事后拥抱、交谈但仍在私密空间）仍可保持 true；一旦离开私密空间或话题完全转向日常，翻回 false
    事件冷却:
      type: number
      range: 0~5
      check:
        - 强事件触发后设为 2~3，普通日常小事件后设为 1
        - 每经过一轮无新强事件的日常铺垫，递减 1，最低为 0
        - 事件冷却 > 0 时不主动触发新的强事件，只处理余波或轻微日常
        - <user>主动换场、拒绝事件或开启个人支线时，可将冷却降为 0，让新方向自然展开
    上次焦点角色:
      check:
        - 记录本轮被重点推进、做出邀请、被选择或承受后果的角色名
        - 按现场因果延续焦点；场景自然结束后再随玩家行动切换。
        - 群体事件可写 群体；没有焦点时写 无
    校园活动:
      type: 无|国庆假期|体育周|期中考试|远足|艺术周|寒假|春节
      check:
        - 按校历和已知校内安排记录当前生效的活动窗口。活动存在不代表<user>报名、到场或经历了它。
        - 离开窗口改回 无 或切换到当前窗口；若实际已有相关余波，仍可按场景记录在 当前事件。
    学期:
      type: 高二上|高二下|高三上|高三下|已毕业
      check:
        - 第一轮按开场白补齐（开学第一天为 高二上）
        - 以 世界.起始年份 为基准：起始年 9 月—次年 1 月 = 高二上；次年 2—6 月 = 高二下；起始年+1 的 9 月—+2 的 1 月 = 高三上；+2 的 2—6 月 = 高三下；+2 的 6 月之后 = 已毕业
        - 例：起始年份=2020 时，2020/09-2021/01 高二上、2021/02-2021/06 高二下、2021/09-2022/01 高三上、2022/02-2022/06 高三下、2022/06 之后已毕业
        - 每次跨日/跨月更新时检查学期是否需要变化；学期是毕业类条件（慕佳芊/虞淑婉 交付、托付）的唯一时间依据

