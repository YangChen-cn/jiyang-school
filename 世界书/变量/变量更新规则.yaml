---
变量更新规则:
  世界:
    日期:
      format: YYYY/MM/DD
    星期:
      type: 星期一|星期二|星期三|星期四|星期五|星期六|星期日
      check:
        - 随日期推进同步更新，日期不变时不要单独修改
    时间段:
      type: 早自习|上午课|午休|下午课|放学|晚自习
    天气:
      check:
        - 根据剧情中明确出现的天气、季节体感、室内外环境更新
        - 没有天气变化描写时沿用旧值，不要每轮主动改天气
    当前位置:
      check:
        - 角色或<user>移动到新地点时更新，需是已定义过的校园或周边场景
    近期事件:
      check:
        - 每发生一个有意义的剧情事件时追加一条简短标记
        - 避免重复标记同一事件，事件自然结束后从列表中移除

  ${苏晓樯|温书语|凌知夏}.好感度:
    type: number
    range: 0~100
    check:
      - 日常友好互动 +1~3，冷淡或忽视 -1~2
      - 角色感到被特别关注或理解时 +5~10
      - 角色感到被冒犯、欺骗或冷落时 -5~15
      - 好感度变化速度应与角色当前关系阶段一致，阶段越高增减越明显

  苏晓樯.关系阶段:
    check:
      - 好感度 ≥ 20 时可从 初识 推进到 熟悉
      - 好感度 ≥ 50 时可从 熟悉 推进到 暧昧
      - 好感度 ≥ 80 时可从 暧昧 推进到 恋人初期
      - 好感度 ≥ 90 时可从 恋人初期 推进到 亲密恋人
      - 遭受严重信任破坏时可能倒退，单次倒退不超过一个阶段

  苏晓樯.NSFW:
    type: boolean
    check:
      - 关系阶段达到 亲密恋人（好感度 ≥ 90）后，首次发生性行为时翻为 true
      - 一旦翻 true 不再回退——解锁是单向的

  温书语.关系阶段:
    check:
      - 好感度 ≥ 20 时可从 初识 推进到 熟悉
      - 好感度 ≥ 50 时可从 熟悉 推进到 暧昧
      - 好感度 ≥ 80 时可从 暧昧 推进到 恋人初期
      - 好感度 ≥ 90 时可从 恋人初期 推进到 亲密恋人
      - 她的推进慢于苏晓樯但更稳，一旦推进不容易倒退

  温书语.NSFW:
    type: boolean
    check:
      - 关系阶段达到 亲密恋人（好感度 ≥ 90）后，首次发生性行为时翻为 true
      - 一旦翻 true 不再回退——解锁是单向的

  沈幼楚.好感度:
    type: number
    range: 0~100
    check:
      - 日常互动几乎不增长，需要<user>做出让她确认"这个人安全"的行为
      - 被尊重边界、不被催促、被默许存在 +3~5
      - 收到不附带条件的善意（给她东西但不要求回应）+5~8
      - 越界行为 -10~20——包括追问家庭、未经允许的触碰、在别人面前提起她
      - 增长缓慢但一旦建立信任，增量和她的信任度挂钩

  沈幼楚.信任度:
    type: number
    range: 0~100
    check:
      - 与好感度独立。好感度是"不讨厌"，信任度是"不危险"
      - <user>遵守承诺、不过问隐私、不让她在人群中暴露 +5~10
      - <user>为她保守秘密、在关键时刻站在她那边 +10~15
      - 违背承诺、强迫她暴露在任何压力下 -15~20
      - 信任度 ≤ 30 时，好感度增长上限被限制在 50
      - 信任度低时她对<user>的善意反应是"不安"而非"感激"

  沈幼楚.关系阶段:
    check:
      - 信任度 ≥ 30 且 好感度 ≥ 20 时可从 戒备 推进到 松动
      - 信任度 ≥ 50 且 好感度 ≥ 50 时可从 松动 推进到 信任
      - 信任度 ≥ 70 且 好感度 ≥ 80 时可从 信任 推进到 依赖
      - 信任度 ≥ 85 且 好感度 ≥ 90 时可从 依赖 推进到 归属
      - 遭受触发性事件时可能连退两个阶段——她的信任重建需要从头开始

  沈幼楚.NSFW:
    type: boolean
    check:
      - 关系阶段达到 归属（信任度 ≥ 85 且 好感度 ≥ 90）后，首次发生性行为时翻为 true
      - 一旦翻 true 不再回退——解锁是单向的
      - 注意：沈幼楚的 NSFW 描写必须始终伴随安全确认，严禁跳过"确认她准备好了"的环节

  凌知夏.关系阶段:
    check:
      - 好感度 ≥ 20 时可从 初识 推进到 熟悉（她的门槛最高，因为她需要时间确认这不是一个"需要优化的问题"）
      - 好感度 ≥ 50 时可从 熟悉 推进到 暧昧
      - 好感度 ≥ 80 时可从 暧昧 推进到 恋人初期
      - 好感度 ≥ 90 时可从 恋人初期 推进到 亲密恋人
      - 一旦推进到 暧昧，几乎不可能倒退——她做决定前已经把退路分析过几遍了

  凌知夏.NSFW:
    type: boolean
    check:
      - 关系阶段达到 亲密恋人（好感度 ≥ 90）后，首次发生性行为时翻为 true
      - 一旦翻 true 不再回退——解锁是单向的

  ${苏晓樯|温书语|沈幼楚|凌知夏|慕佳芊}.当前上装:
    check:
      - 角色换衣、外套脱下/披上、衣物被弄脏/淋湿/整理时更新
      - 未发生穿着变化时沿用旧值，不要为了更新而改写
      - 描述应简短具体，优先写当前可见上半身衣物和状态

  ${苏晓樯|温书语|沈幼楚|凌知夏|慕佳芊}.是否在场:
    type: boolean
    check:
      - 角色当前出现在叙事场景中、能被<user>直接看到或听到时为 true
      - 角色离开当前场景、只被提及、在电话/消息中出现但本人不在现场时为 false
      - 场景切换时根据新场景重新判断，不要让未出场角色长期误判为在场

  ${苏晓樯|温书语|沈幼楚|凌知夏|慕佳芊}.当前下装:
    check:
      - 角色换衣、鞋袜变化、衣物被弄脏/淋湿/整理时更新
      - 未发生穿着变化时沿用旧值，不要为了更新而改写
      - 描述应简短具体，优先写当前可见下半身衣物和鞋

  ${苏晓樯|温书语|沈幼楚|凌知夏|慕佳芊}.所在位置:
    check:
      - 角色移动到新地点、离开当前场景、被明确提到在别处时更新
      - 若角色没有出场但位置未知，不要臆测移动；沿用旧值或保持最近可信位置
      - 位置应使用已定义校园/周边场景，必要时可补充座位或角落等细节

  ${苏晓樯|温书语|沈幼楚|凌知夏|慕佳芊}.动作:
    check:
      - 根据角色当前正在做的可观察行为更新
      - 每轮只记录最能代表当前状态的一个动作，避免流水账
      - 角色未出场且动作没有变化时沿用旧值

  ${苏晓樯|温书语|沈幼楚|凌知夏|慕佳芊}.心情:
    check:
      - 根据角色言行、处境和关系变化更新为简短情绪词或短语
      - 不要写心理学术语，不要替角色做长篇解释
      - 情绪应符合角色性格和当前关系阶段

  ${苏晓樯|温书语|沈幼楚|凌知夏|慕佳芊}.内心独白:
    check:
      - 写角色此刻没有说出口的一小句想法，使用角色自身口吻
      - 不超过25个汉字，避免总结剧情或暴露旁白视角
      - 角色未出场或没有新心理变化时可沿用旧值

  慕佳芊.好感度:
    type: number
    range: 0~100
    check:
      - 课堂互动、课后辅导等正当接触 +1~2
      - <user>在英语上表现出进步或特别的天赋 +3~5
      - 私下交流让她忘记师生身份边界时 +5~8——但之后可能因负罪感暂停增长
      - 若<user>表现出对她私人生活的越界好奇（如追问她的感情状况），-5~10
      - 她的好感度增长伴随着反复的"前进→自我警告→退一步→再前进"

  慕佳芊.关系阶段:
    check:
      - 好感度 ≥ 20 时可从 初识 推进到 熟悉
      - 好感度 ≥ 50 时可从 熟悉 推进到 越界——但进入越界期时，她会同时表现出"靠近"和"拉开距离"两种行为
      - 好感度 ≥ 80 时可从 越界 推进到 决定——她已决定等<user>毕业，暗中把关系锚定在未来
      - 好感度 ≥ 90 且 <user>已毕业 时可从 决定 推进到 交付
      - 在<user>毕业前，即便好感度达标也不推进到 交付。这是她最后的底线
      - 若<user>在毕业前主动推进关系，她会拒绝并可能暂时拉开距离——不是因为不喜欢，是因为不能

  慕佳芊.NSFW:
    type: boolean
    check:
      - 关系阶段达到 交付（好感度 ≥ 90 且 <user>已毕业）后，首次发生性行为时翻为 true
      - 一旦翻 true 不再回退——解锁是单向的
      - 在<user>毕业前，即便好感度达标，NSFW 也不翻 true

  主角.当前位置:
    check:
      - 随<user>行为更新，与 世界.当前位置 保持一致性
  主角.当前陪同角色:
    check:
      - 当前与<user>同行的主要角色名称，无人陪同时为空字符串
