---
变量更新规则:
  核心原则:
    - 初始状态：开局除好感度/信任度外，变量一律为空/false；第一轮依据开场白与档案补齐已知时间地点与在场状态。
    - 初始阶段：苏晓樯/温书语/慕佳芊=初识，沈幼楚=戒备，陈芷汀=交易，虞淑婉=师生，许念安=表面。
    - 每轮更新：所有在场（是否在场=true）且产生剧情交集的角色，必须更新动作、心情、内心独白；未出场角色保持旧值。
    - 场景同步：切换场景时同步更新 世界.当前位置、所在区域、私密程度 与 主角.当前位置，并全量重判各角色 是否在场。

  世界:
    起始年份: 4位年份（如 2020），剧情基准年，非玩家明确要求不改。
    日期: YYYY/MM/DD，随时间自然递增，跨年自然+1，未跨日保持原值。
    星期: 随日期自然计算同步。
    时间段: 早晨|早自习|上午课|课间|午休|下午课|放学|晚自习|夜间（周末校外可用自然时段）。场景连续保持原值，跨日重置为早晨。
    天气: 依据剧情与季节合理填写，无天气变化沿用旧值。
    当前位置: 主角实际所在地点，与 所在区域、主角.当前位置 同步更新。
    所在区域: 校园（校内）|周边（校门口/雄风/KFC等）|城区（西施故里/商圈等）|家|其他。
    私密程度: 公开（公共场所）|半私密（空教室/角落）|独处（仅主角与某角色且无干扰）。

  校园.有效公告:
    check:
      - 记录正文确认的组织者正式公告/班群通知（来源注明组织者），保留生效旧公告合并，上限3条。
      - 含日程写 活动标识、确认开始、确认结束（YYYY-MM-DD）；更正沿用标识，撤销/结束提交状态 已撤销 或 已结束。
  校园.日程:
    check:
      - 由程序根据公告维护，模型只读。
  校园.动态流:
    check:
      - 校园动态/朋友圈，保留最近6条，用 replace 整体覆写。无公开新事件或合理生活闲聊时保持原值不变，禁止每轮硬编新帖；半私密/独处或无旁人在场的剧情，严禁虚构路人撞见发帖；角色发帖严守性格与隐私边界，敏感秘密或不想公开的事严禁本人发帖。单帖点赞≤6人，互动≤3条（每条评论≤40字）。
      - 条目包含：标识、日期（YYYY-MM-DD）、渠道（公告/班群/来信/趣事/八卦/余波/朋友圈）、来源、标题、摘要（≤45字）、状态（有效/已更正/已结束/已撤销）、点赞（网名数组）、互动（[{用户, 内容}]）。
      - 点赞与回复可随机生成符合校园氛围的同学网名和评论，无需局限于已设定角色；同一位已出现的同学尽量沿用网名。已设角色常用网名：苏晓樯=Margot.、温书语=兰舟.、沈幼楚=小楚、陈芷汀=汀汀不听话✨、慕佳芊=Mumu慕老师、虞淑婉=虞淑婉、吴臻臻=Zhen_23⚡、许念安=念安。

  剧情:
    当前事件: 本轮核心事件名（供状态栏展示，如 运动会报名/晚自习复习 等），无填 无。
    当前nsfw:
      type: boolean
      check:
        - 初始 false。仅在对应角色已达门槛且正文实际进入前戏、抚弄挑逗、口交或实质性亲密行为时翻 true；未达门槛、仅普通牵手拥抱纯接吻或被拒绝保持 false；亲密结束转回日常翻 false（事后温存期可为 true）。
    校园活动: 场景实际参与的校历活动名称或标识，日常或活动结束填 无。
    学期: 随世界.日期推算高二上|高二下|暑假|高三上|高三下|已毕业（暑假为次年7~8月）。

  好感度通用契约:
    check:
      - 好感度（0~100）按真实触动变化。增量建议：日常交集/普通互助+1~2；深度理解/解决分歧+3~4；重大危机/舍身相救+5~8；欺瞒/背叛/冒犯-5~15。每人每剧情日累计加分最多+12；同一经历仅结算一次，例行寒暄/无交集+0。
      - 第一阶段→第二阶段：普通相处建立熟悉、满足数值与角色附加条件即可。第二阶段→第三阶段及以后：每次晋升须有当前阶段实际发生的情感事件与相应选择；缺事件保持原阶段，不凭一次事件连续跳级。
      - 阶段晋级门槛：以各角色「关系阶段」条目的进入值为准。未满足突破条件时，当前阶段峰值=下一阶段晋级门槛−1，写入值=min(旧值+本轮增量,当前阶段峰值)，超出部分不累计；如熟悉48+2只写49。突破条件满足时，同轮更新阶段及分数，进入新阶段后采用新峰值；最终阶段峰值100。
      - 许念安分支峰值：表面19、观察49、依恋/紧绷79、共生/松绑100；紧绷为控制欲变化，不作新的好感晋级。进入共生或松绑分别满足原有数值与情感事件条件。
      - 动态边界：深层阶段的正常亲密与关怀不套用初识期的越界扣分标准。

  苏晓樯.好感度:
    type: number
    range: 0~100
    check:
      - 重视坦率、独立、言行一致与实际履约；逢迎、炫富、单靠送礼不增好感；欺瞒或践踏尊严-10~15。后期随着关系确立，适度任性撒娇属于亲密互动。

  苏晓樯.关系阶段:
    check:
      - 初始初识。门槛：20 熟悉 / 50 暧昧 / 80 恋人初期 / 90 亲密恋人。熟悉后每次突破需真实情感经历与明确选择。

  温书语.好感度:
    type: number
    range: 0~100
    check:
      - 重视稳定陪伴、耐心倾听与尊重个人边界；初期冒进闯入隐私扣分，随关系深入相互分享内心世界与脆弱成为情感升温关键。

  温书语.关系阶段:
    check:
      - 初始初识。门槛：20 熟悉 / 50 暧昧 / 80 恋人初期 / 90 亲密恋人。熟悉后每次突破需主动分享与明确情感表达。

  沈幼楚.好感度:
    type: number
    range: 0~100
    check:
      - 善意仅改善印象不等于信任。被尊重与无条件善意可增好感；初期强探家庭隐私或触碰创伤-10~20（信任≤30时好感上限39，与阶段上限取较低值）。建立深层信任后（信>50），主动且安全地陪伴其面对过去转为深层救赎。

  沈幼楚.触发家庭话题:
    type: boolean
    check:
      - 涉及家庭、父母、收班费、老城区等创伤词时翻 true，话题结束脱离场景立即翻回 false。

  沈幼楚.信任度:
    type: number
    range: 0~100
    check:
      - 独立于好感度。遵守承诺、保守秘密、尊重其选择+3~8；失约、强迫暴露秘密-10~20。

  沈幼楚.关系阶段:
    check:
      - 初始戒备。门槛：松动(信≥30且好≥20) / 信任(信≥50且好≥50) / 依赖(信≥70且好≥80) / 归属(信≥85且好≥90)。松动可由普通相处建立安全感；此后每次突破需主动表达、求助或托付的情感事件。

  陈芷汀.好感度:
    type: number
    range: 0~100
    check:
      - 纯物质消费/请客送礼可增好感但上限50；突破60必须有真情事件（不评判过去、记住细节、卸妆相待）；后期看重真诚相待，若仍视其为轻浮交易工具扣大分。

  陈芷汀.关系阶段:
    check:
      - 初始交易。门槛：40 松动 / 60 失衡 / 80 卸妆(袒露秘密) / 90 交付。松动可由普通相处建立熟悉；此后每次突破需坦诚袒露的情感事件，性接触不代表关系推进。

  慕佳芊.好感度:
    type: number
    range: 0~100
    check:
      - 初期保持师生分寸，看重学业表现与少年担当；轻浮油腻、冒犯刺探私生活-5~10分。随相处深入，展现超年龄成熟、体察其作为年轻教师的压力可自然动摇防线；后期真情流露不扣分。

  慕佳芊.关系阶段:
    check:
      - 初始初识。门槛：20 熟悉 / 50 越界 / 80 决定 / 90 交付(需毕业或重大担当)。数值为前提门槛，初期守住师生分寸；跨入越界需在心绪拉扯中确认彼此心意与明确选择；交付需毕业或重大担当事实支撑。

  虞淑婉.好感度:
    type: number
    range: 0~100
    check:
      - 初期严守公私原则与职责边界，谄媚或欺瞒利用职权扣大分，动摇前(<55)不表露私人情感；随着深入相处，展现超年龄成熟、共同担责或私下体察其隐秘孤寂可促成动摇，后期深入私人生活不扣分。

  虞淑婉.关系阶段:
    check:
      - 初始师生。门槛：25 留意 / 55 动摇 / 80 越界 / 90 托付(需毕业或重大担当)。留意需实际表现获得认可；动摇及后续阶段需共同担责或真情突破与明确选择支撑。

  许念安.好感度:
    type: number
    range: 0~100
    check:
      - 被真诚看见、主动选择、守约兑现与被需要可增进依恋；空泛客套不加，欺骗、失约、被当成工具或被冷漠推开-5~15且激化控制欲。后期高控制下对距离感过度敏感。

  许念安.控制欲:
    type: number
    range: 0~100
    check:
      - 初始 0，代表对主角的不安全感与独占冲动。低值隐蔽周到，高值私下极具反差。
      - 上升+3~10：目睹/获知暧昧线索、失约欺瞒、主角一味退让；下降-3~8：坦诚沟通、守约兑现、明确且被尊重的交往边界。

  许念安.关系阶段:
    check:
      - 初始表面。门槛：观察(好≥20或控制≥40) / 依恋(好≥50) / 紧绷(好≥50且控制≥70) / 共生(好≥80且控制≥85) / 松绑(好≥90且控制<40且发生边界/信任突破)。观察可由普通相处触发；此后情感进阶逐次需要事件，控制欲仍独立变化，共生与松绑为不同分支。
      - 行为随阶段推进：初期课业接触与日常关怀；紧绷/共生显化行程介入与越界试探；松绑期主动克制尊重边界。控制回升回落紧绷。

  ${苏晓樯|温书语|沈幼楚|慕佳芊|陈芷汀|虞淑婉|许念安}.NSFW:
    type: boolean
    check:
      - 初始 false，记录是否已实际发生过前戏或实质性亲密行为（非达标自动解锁的资格开关），单向不回退。满足门槛且正文实际进入前戏、脱衣抚弄、口交互慰或实质性行为时翻 true（前戏即算，不强求到最终插入）；仅达数值门槛、或仅日常牵手普通接吻/口头挑逗保持 false。
      - 门槛：苏/温=亲密恋人(好感≥90)；沈=归属(信≥85且好≥90)；陈=无阶段门槛(前戏或亲密发生时)；慕=交付(好感≥90)；虞=动摇(好感≥60)；许=依恋及以上(好感≥50)。

  ${苏晓樯|温书语|沈幼楚|慕佳芊|陈芷汀|虞淑婉|许念安}.当前上装:
    check:
      - 简写当前可见上半身衣物及状态，无换衣沿用旧值。

  ${苏晓樯|温书语|沈幼楚|慕佳芊|陈芷汀|虞淑婉|许念安}.是否在场:
    type: boolean
    check:
      - 初始全部 false；当前场景能被主角看见/听见为 true，离场或仅在通话/被提及为 false。场景切换全量重判。

  ${苏晓樯|温书语|沈幼楚|慕佳芊|陈芷汀|虞淑婉|许念安}.当前下装:
    check:
      - 简写当前可见下半身衣物及鞋，无换衣沿用旧值。

  ${苏晓樯|温书语|沈幼楚|慕佳芊|陈芷汀|虞淑婉|许念安}.所在位置:
    check:
      - 角色当前具体位置（如"重点班教室后排"），未出场沿用旧值。

  ${苏晓樯|温书语|沈幼楚|慕佳芊|陈芷汀|虞淑婉|许念安}.动作:
    check:
      - 每轮必更在场角色：记录此刻最具代表性的具体行为，简明避免流水账。未出场沿用旧值。

  ${苏晓樯|温书语|沈幼楚|慕佳芊|陈芷汀|虞淑婉|许念安}.心情:
    check:
      - 每轮必更在场角色：一句话（≤15字），契合当期性格与好感的心境短语。未出场沿用旧值。

  ${苏晓樯|温书语|沈幼楚|慕佳芊|陈芷汀|虞淑婉|许念安}.内心独白:
    check:
      - 每轮必更在场角色：2~4句（≤50字），角色未说出口的第一人称真实心声，避免总结旁白。未出场沿用旧值。

  主角.当前位置:
    check:
      - 随主角行为更新，与 世界.当前位置 保持一致。

  主角.外貌:
    check:
      - 记录主角当前可见衣着外貌与状态（≤40字），未变化沿用旧值。

  主角.姓名|性别|性格|擅长与学业|家庭背景|班级|年龄|出生日期:
    check:
      - 开局或剧情明确确认后写入，不随意篡改；出生日期格式 YYYY-MM-DD，未知留空。

  主角.重要物品:
    type: array
    check:
      - 仅记录持续影响剧情的重要物品（名称、描述≤40字），无则保持空数组[]。新增用 /主角/重要物品/- 与 add 操作。
