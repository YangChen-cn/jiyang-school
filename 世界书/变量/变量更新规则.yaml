---
变量更新规则:
  核心原则:
    - 初始状态：开局除好感度/信任度/事件冷却(0)外，变量一律为空/false；第一轮依据开场白与档案补齐已知时间地点与在场状态。
    - 初始阶段：苏晓樯/温书语/凌知夏/慕佳芊=初识，沈幼楚=戒备，陈芷汀=交易，虞淑婉=师生。
    - 每轮更新：所有在场（是否在场=true）且产生剧情交集的角色，必须更新动作、心情、内心独白；未出场角色保持旧值。
    - 场景同步：切换场景时同步更新 世界.当前位置、所在区域、私密程度 与 主角.当前位置，并全量重判各角色 是否在场。

  世界:
    起始年份: 4位年份（如 2020），剧情基准年，非玩家明确要求不改。
    日期: YYYY/MM/DD，随时间自然递增，跨年自然+1，未跨日保持原值。
    星期: 随日期自然计算同步。
    时间段: 早晨|早自习|上午课|课间|午休|下午课|放学|晚自习|夜间（周末校外可用自然时段）。场景连续保持原值，跨日重置为早晨。
    天气: 依据剧情与季节合理填写，无天气变化沿用旧值。
    当前位置: 主角实际所在地点，与 所在区域、主角.当前位置 同步更新。
    所在区域: 校园（校内）|周边（校门口/雄风/KFC等）|城区（西施故里/商圈等）|家|其他。
    私密程度: 公开（公共场所）|半私密（空教室/角落）|独处（仅主角与某角色且无干扰）。

  校园.有效公告:
    check:
      - 仅写正文已确认的组织者正式公告或班群通知。每轮保留仍生效的旧公告，与本轮公告合并，按写入顺序从旧到新排，最多3条，优先保留近日或进行中的日程。
      - 活动日程写活动标识、确认开始和确认结束（YYYY-MM-DD）。同一公告更正沿用标识并移到末尾；撤销或结束用同标识与活动标识提交状态 已撤销 或 已结束，程序会从公告栏移除并同步校历。
  校园.日程:
    check:
      - 由正式公告维护，保留已确认、已撤销与已结束的日期事实供后续阅读。模型只读，不直接改写。
  校园.动态流:
    check:
      - 合并旧动态与本轮动态，从旧到新排，保留最近6条。动态不填活动标识或确认日期。
      - 有数组用 replace 整体覆写，缺键用 add；缺校园对象时 add /校园。旧档原有 /校园/消息 交给写回逻辑迁移，不得清空。两个新数组按各自需要更新，不用动态替换正式公告。
      - 每帖点赞最多6人，互动最多3条，每条评论内容最多40字。
      - 条目包含：标识、日期（YYYY-MM-DD）、渠道（公告/班群/来信/趣事/八卦/余波/朋友圈）、来源、标题、摘要（≤45字）、状态（有效/已更正/已结束/已撤销）、点赞（数组）、互动（数组，每项含 用户、内容 键）。
      - 点赞与互动100%由AI基于当前剧情与在场角色实时推演（无互动保持空数组[]，前端绝不自动补齐）。角色网名：苏晓樯=Margot.、温书语=兰舟.、沈幼楚=小楚、凌知夏=ZX.、陈芷汀=汀汀不听话✨、慕佳芊=Mumu慕老师、虞淑婉=虞淑婉、吴臻臻=Zhen_23⚡。

  剧情:
    推进节奏: 简记日常铺垫/事件触发/余波处理。
    当前事件: 本轮核心事件名，无填 无。
    当前nsfw:
      type: boolean
      check:
        - 初始 false。实质性接触（前戏/性交）开始时翻 true，性行为结束转回日常翻 false（温存期仍可为 true）。
    事件冷却: 强事件后2~3，普通事件后1，日常每轮-1至0。
    上次焦点角色: 本轮重点互动角色，或填 群体/无。
    校园活动: 当前场景正在围绕的校历活动，写校历名称或标识。离场、另做日常、活动结束或撤销时填 无。日期落在预计窗口本身不构成该场景。
    学期: 随世界.日期填写高二上、高二下、暑假、高三上、高三下、已毕业。暑假为起始次年7至8月，工读机会窗口默认至8月15日；明确毕业可提前进入已毕业。门禁按日期兼容仍写高二下的暑假旧档。

  ${苏晓樯|温书语|凌知夏}.好感度:
    type: number
    range: 0~100
    check:
      - 日常友好+1~2，特别理解+4~6，严重冒犯-5~15。好感增减速度随关系阶段提升而加大。

  苏晓樯.关系阶段:
    check:
      - 初始初识。门槛：20 熟悉 / 50 暧昧 / 80 恋人初期 / 90 亲密恋人。严重信任破坏单次倒退≤1级。

  苏晓樯.NSFW:
    type: boolean
    check:
      - 初始 false。达到亲密恋人(好感≥90)后首次实质性行为翻 true，单向不回退。

  温书语.关系阶段:
    check:
      - 初始初识。门槛：20 熟悉 / 50 暧昧 / 80 恋人初期 / 90 亲密恋人。推进比苏晓樯慢但极稳，不易倒退。

  温书语.NSFW:
    type: boolean
    check:
      - 初始 false。达到亲密恋人(好感≥90)后首次实质性行为翻 true，单向不回退。

  沈幼楚.好感度:
    type: number
    range: 0~100
    check:
      - 日常微增。被尊重/无条件善意+3~5，触碰/过问隐私等越界行为-10~20。信任度≤30时好感上限39。

  沈幼楚.触发家庭话题:
    type: boolean
    check:
      - 涉及家庭、父母、收班费、老城区等创伤词时翻 true，话题结束或脱离该环境立即翻回 false。

  沈幼楚.信任度:
    type: number
    range: 0~100
    check:
      - 独立于好感度（好感度是"不讨厌"，信任度是"不危险"）。遵守承诺/保守秘密+3~8，违背承诺/强迫暴露-10~20。

  沈幼楚.关系阶段:
    check:
      - 初始戒备。门槛：松动(信≥30且好≥20) / 信任(信≥50且好≥50) / 依赖(信≥70且好≥80) / 归属(信≥85且好≥90)。触痛创伤可能连退两级。

  沈幼楚.NSFW:
    type: boolean
    check:
      - 初始 false。达到归属(信≥85且好≥90)后首次实质性行为翻 true（必须伴随安全确认），单向不回退。

  凌知夏.关系阶段:
    check:
      - 初始初识。门槛：30 熟悉 / 60 暧昧 / 80 恋人初期 / 90 亲密恋人。理性审视期长，一旦进入暧昧极难倒退。

  凌知夏.NSFW:
    type: boolean
    check:
      - 初始 false。达到亲密恋人(好感≥90)后首次实质性行为翻 true，单向不回退。

  陈芷汀.好感度:
    type: number
    range: 0~100
    check:
      - 物质消费/优质性爱+2~4（上限50）；突破60必须有真情事件（不评判过去、记住小事、卸妆相待）。视为炮友-10~15，利用其秘密-30。

  陈芷汀.关系阶段:
    check:
      - 初始交易。门槛：40 松动 / 60 失衡(需情感突破) / 80 卸妆(主动袒露秘密) / 90 交付。失衡后受创可倒退两级。交易期即可做爱，性不代表阶段推进。

  陈芷汀.NSFW:
    type: boolean
    check:
      - 初始 false。首次实质性行为后翻 true，单向不回退。交易期即可有性，但她主导节奏。

  慕佳芊.好感度:
    type: number
    range: 0~100
    check:
      - 课堂/辅导+1~2，英语进步+2~5，私下忘记身份边界+3~8，打探私生活-5~10。伴随"前进→自我警告→退步"心理拉锯。

  慕佳芊.关系阶段:
    check:
      - 初始初识。门槛：20 熟悉 / 50 越界 / 80 决定(暗中等毕业) / 90 交付。交付触发条件：①剧情.学期=已毕业；②毕业前重大牺牲或强烈情感冲击；③展现超年龄担当。

  慕佳芊.NSFW:
    type: boolean
    check:
      - 初始 false。达到交付阶段后首次实质性行为翻 true，单向不回退。

  虞淑婉.好感度:
    type: number
    range: 0~100
    check:
      - 如实陈述/主动担责+2~4，保护他人+4~6，超年龄成熟+3~7；欺瞒/利用学校资源-8~20。动摇(≥55)前不表露任何私人感情。

  虞淑婉.关系阶段:
    check:
      - 初始师生。门槛：25 留意 / 55 动摇(情感渗入) / 80 越界 / 90 托付。托付触发条件：学期=已毕业，或重大担当事件。

  虞淑婉.NSFW:
    type: boolean
    check:
      - 初始 false。动摇期(≥60)首次发生各取所需/生理释放性关系时翻 true，单向不回退。

  ${苏晓樯|温书语|沈幼楚|凌知夏|慕佳芊|陈芷汀|虞淑婉}.当前上装:
    check:
      - 简写当前可见上半身衣物及状态，无换衣沿用旧值。

  ${苏晓樯|温书语|沈幼楚|凌知夏|慕佳芊|陈芷汀|虞淑婉}.是否在场:
    type: boolean
    check:
      - 初始全部 false；当前场景能被主角看见/听见为 true，离场或仅在通话/被提及为 false。场景切换全量重判。

  ${苏晓樯|温书语|沈幼楚|凌知夏|慕佳芊|陈芷汀|虞淑婉}.当前下装:
    check:
      - 简写当前可见下半身衣物及鞋，无换衣沿用旧值。

  ${苏晓樯|温书语|沈幼楚|凌知夏|慕佳芊|陈芷汀|虞淑婉}.所在位置:
    check:
      - 角色当前具体位置（如"重点班教室后排"），未出场沿用旧值。

  ${苏晓樯|温书语|沈幼楚|凌知夏|慕佳芊|陈芷汀|虞淑婉}.动作:
    check:
      - 每轮必更在场角色：记录此刻最具代表性的具体行为，简明避免流水账。未出场沿用旧值。

  ${苏晓樯|温书语|沈幼楚|凌知夏|慕佳芊|陈芷汀|虞淑婉}.心情:
    check:
      - 每轮必更在场角色：一句话（≤15字），契合当期性格与好感的心境短语。未出场沿用旧值。

  ${苏晓樯|温书语|沈幼楚|凌知夏|慕佳芊|陈芷汀|虞淑婉}.内心独白:
    check:
      - 每轮必更在场角色：2~4句（≤50字），角色未说出口的第一人称真实心声，避免总结旁白。未出场沿用旧值。

  主角.当前位置:
    check:
      - 随主角行为更新，与 世界.当前位置 保持一致。

  主角.外貌:
    check:
      - 记录主角当前可见衣着外貌与状态（≤40字），未变化沿用旧值。

  主角.姓名|年龄|性别|班级|性格|擅长与学业|家庭背景:
    check:
      - 开局设定写入，游戏中不随意篡改。未提供保持空字符串。

  主角.重要物品:
    type: array
    check:
      - 仅记录持续影响主线/后续剧情的重要物品（名称、描述≤40字），无则保持空数组[]。新增用路径 /主角/重要物品/- 与 add 操作。
