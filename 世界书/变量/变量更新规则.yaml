---
变量更新规则:
  核心原则:
    - 每轮叙事结束后，所有在场（是否在场=true）且在剧情中产生了交集的角色，必须更新以下字段：动作、心情、内心独白。这三个字段不是"有变化才改"——是每轮必改，哪怕只改一句话
    - 好感度/信任度/关系阶段在发生触发事件后立即更新，不要等到下一轮
    - 所在位置/当前上装/当前下装在发生变化时更新，无变化沿用旧值
    - 未出场角色（是否在场=false）的变量不需要更新，保持上一轮的值即可

  世界:
    日期:
      format: YYYY/MM/DD
    星期:
      type: 星期一|星期二|星期三|星期四|星期五|星期六|星期日
      check:
        - 随日期推进同步更新，日期不变时不要单独修改
    时间段:
      type: 早自习|上午课|午休|下午课|放学|晚自习
    天气:
      check:
        - 根据剧情中明确出现的天气、季节体感、室内外环境更新
        - 没有天气变化描写时沿用旧值，不要每轮主动改天气
    当前位置:
      check:
        - 角色或<user>移动到新地点时更新，需是已定义过的校园或周边场景

  剧情:
    推进节奏:
      type: 日常铺垫|事件触发|余波处理
      check:
        - <user>提出明确行动、地点、邀约、拒绝、调查或找人时，优先按<user>行动更新剧情，不要为了套事件池而改写方向
        - 默认保持 日常铺垫；当本轮出现明确事件压力、任务、邀请、冲突或校园活动节点时改为 事件触发
        - 事件被<user>回应、角色情绪残留、选择后果发酵时改为 余波处理
        - 余波处理完成、没有新压力时回到 日常铺垫
    当前事件:
      type: 无|座位选择|课代表任务|小测临近|社团招新|班费表格|竞赛通知|放学邀约|商场偶遇|流言苗头|老鹰山传闻|班级篮球对抗赛|啦啦队后勤|受伤处理|赛后庆功|十佳歌手报名|排练|文艺汇演|后台偶遇|舞台救场|路线分组|补给分配|掉队照顾|山路天气|返程座位
      check:
        - 本轮没有明确事件时保持 无
        - <user>自由推进产生的新方向可写最贴近的事件名；若没有对应枚举，保持 无，不要强行套入校园事件
        - 发生校园任务、活动铺垫、选择压力或后果余波时，写最贴近的事件名
        - 不要连续保持同一个 当前事件；事件解决后改为 无 或切换到对应余波事件
    事件冷却:
      type: number
      range: 0~5
      check:
        - 强事件触发后设为 2~3，普通日常小事件后设为 1
        - 每经过一轮无新强事件的日常铺垫，递减 1，最低为 0
        - 事件冷却 > 0 时不主动触发新的强事件，只处理余波或轻微日常
        - <user>主动换场、拒绝事件或开启个人支线时，可将冷却降为 0，让新方向自然展开
    上次焦点角色:
      check:
        - 记录本轮被重点推进、做出邀请、被选择或承受后果的角色名
        - 下一轮剧情推动时优先避开同一个焦点角色，除非<user>主动继续找她
        - 群体事件可写 群体；没有焦点时写 无
    校园活动:
      type: 无|体育周|艺术周|远足
      check:
        - 平时保持 无
        - 2020年10月中下旬围绕班级篮球对抗赛、后勤和赛后庆功时设为 体育周
        - 2020年11月围绕老鹰山远足、路线分组和返程时设为 远足
        - 2020年12月围绕十佳歌手、排练和文艺汇演时设为 艺术周
        - 活动结束并完成余波后改回 无

