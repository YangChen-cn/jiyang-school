---
变量更新规则:
  核心原则:
    - 初始状态：开局除好感度/信任度/事件冷却(0)外，变量一律为空/false；第一轮依据开场白与档案补齐已知时间地点与在场状态。
    - 初始阶段：苏晓樯/温书语/慕佳芊=初识，沈幼楚=戒备，陈芷汀=交易，虞淑婉=师生，许念安=表面。
    - 每轮更新：所有在场（是否在场=true）且产生剧情交集的角色，必须更新动作、心情、内心独白；未出场角色保持旧值。
    - 场景同步：切换场景时同步更新 世界.当前位置、所在区域、私密程度 与 主角.当前位置，并全量重判各角色 是否在场。

  世界:
    起始年份: 4位年份（如 2020），剧情基准年，非玩家明确要求不改。
    日期: YYYY/MM/DD，随时间自然递增，跨年自然+1，未跨日保持原值。
    星期: 随日期自然计算同步。
    时间段: 早晨|早自习|上午课|课间|午休|下午课|放学|晚自习|夜间（周末校外可用自然时段）。场景连续保持原值，跨日重置为早晨。
    天气: 依据剧情与季节合理填写，无天气变化沿用旧值。
    当前位置: 主角实际所在地点，与 所在区域、主角.当前位置 同步更新。
    所在区域: 校园（校内）|周边（校门口/雄风/KFC等）|城区（西施故里/商圈等）|家|其他。
    私密程度: 公开（公共场所）|半私密（空教室/角落）|独处（仅主角与某角色且无干扰）。

  校园.有效公告:
    check:
      - 记录正文确认的组织者正式公告/班群通知（来源注明组织者），保留生效旧公告合并，上限3条。
      - 含日程写 活动标识、确认开始、确认结束（YYYY-MM-DD）；更正沿用标识，撤销/结束提交状态 已撤销 或 已结束。
  校园.日程:
    check:
      - 由程序根据公告维护，模型只读。
  校园.动态流:
    check:
      - 校园动态/朋友圈，保留最近6条，用 replace 整体覆写。单帖点赞≤6人，互动≤3条（每条评论≤40字）。
      - 条目包含：标识、日期（YYYY-MM-DD）、渠道（公告/班群/来信/趣事/八卦/余波/朋友圈）、来源、标题、摘要（≤45字）、状态（有效/已更正/已结束/已撤销）、点赞（网名数组）、互动（[{用户, 内容}]）。
      - 常用网名：苏晓樯=Margot.、温书语=兰舟.、沈幼楚=小楚、陈芷汀=汀汀不听话✨、慕佳芊=Mumu慕老师、虞淑婉=虞淑婉、吴臻臻=Zhen_23⚡、许念安=念安。

  剧情:
    推进节奏: 简记日常铺垫/事件触发/余波处理。
    当前事件: 本轮核心事件名，无填 无。
    当前nsfw:
      type: boolean
      check:
        - 初始 false。实质性接触开始时翻 true，结束转回日常翻 false（温存期可为 true）。
    事件冷却: 强事件后2~3，普通事件后1，日常每轮-1至0。
    上次焦点角色: 本轮重点互动角色，或填 群体/无。
    校园活动: 场景实际参与的校历活动名称或标识，日常或活动结束填 无。
    学期: 随世界.日期推算高二上|高二下|暑假|高三上|高三下|已毕业（暑假为次年7~8月）。
    当日关系增量: 程序自动维护，模型只读。

  ${苏晓樯|温书语|沈幼楚|慕佳芊|陈芷汀|虞淑婉|许念安}.好感度:
    type: number
    range: 0~100
    check:
      - 仅在产生剧情交集时更新。日常友好/履约+1~2，关键互助/深度理解+3~5，欺瞒/冒犯-5~15；例行寒暄/无交集+0。
      - 特殊限制：沈幼楚信任≤30时好感上限39；陈芷汀纯物质消费好感上限50（突破需真情袒露）。

  苏晓樯.关系阶段:
    check:
      - 初始初识。门槛：20 熟悉 / 50 暧昧 / 80 恋人初期 / 90 亲密恋人。需真实共同经历与明确选择支撑。

  温书语.关系阶段:
    check:
      - 初始初识。门槛：20 熟悉 / 50 暧昧 / 80 恋人初期 / 90 亲密恋人。推进平稳，需主动分享与情感表达。

  沈幼楚.触发家庭话题:
    type: boolean
    check:
      - 涉及家庭、父母、收班费、老城区等创伤词时翻 true，话题结束脱离场景立即翻回 false。

  沈幼楚.信任度:
    type: number
    range: 0~100
    check:
      - 独立于好感度。守约/保密/尊重选择+3~8，失约/泄密/强迫越界-10~20。

  沈幼楚.关系阶段:
    check:
      - 初始戒备。门槛：松动(信≥30且好≥20) / 信任(信≥50且好≥50) / 依赖(信≥70且好≥80) / 归属(信≥85且好≥90)。需主动表达或求助事实支撑。

  陈芷汀.关系阶段:
    check:
      - 初始交易。门槛：40 松动 / 60 失衡 / 80 卸妆(袒露秘密) / 90 交付。性接触不代表关系推进。

  慕佳芊.关系阶段:
    check:
      - 初始初识。门槛：20 熟悉 / 50 越界 / 80 决定 / 90 交付(需毕业或重大担当)。平时严守师生界限。

  虞淑婉.关系阶段:
    check:
      - 初始师生。门槛：25 留意 / 55 动摇 / 80 越界 / 90 托付(需毕业或重大担当)。平时严守校长职责。

  许念安.控制欲:
    type: number
    range: 0~100
    check:
      - 初始 0，代表对主角的不安全感与独占冲动。低值隐蔽周到，高值私下极具反差。
      - 上升+3~10：目睹/获知暧昧线索、失约欺瞒、主角一味退让；下降-3~8：坦诚沟通、守约兑现、明确且被尊重的交往边界。

  许念安.关系阶段:
    check:
      - 初始表面。门槛：观察(好≥20或控制≥40) / 依恋(好≥50) / 紧绷(好≥50且控制≥70) / 共生(好≥80且控制≥85) / 松绑(好≥90且控制<40且发生边界/信任突破)。
      - 行为随阶段推进：初期课业接触与日常关怀；紧绷/共生显化行程介入与越界试探；松绑期主动克制尊重边界。控制回升回落紧绷。

  ${苏晓樯|温书语|沈幼楚|慕佳芊|陈芷汀|虞淑婉|许念安}.NSFW:
    type: boolean
    check:
      - 初始 false。达到门槛阶段后首次实质性行为翻 true，单向不回退。门槛：苏/温=亲密恋人(好感≥90)；沈=归属(信≥85且好≥90)；陈=首次实质性行为；慕=交付；虞=动摇期(好感≥60)；许=依恋(好感≥50)。

  ${苏晓樯|温书语|沈幼楚|慕佳芊|陈芷汀|虞淑婉|许念安}.当前上装:
    check:
      - 简写当前可见上半身衣物及状态，无换衣沿用旧值。

  ${苏晓樯|温书语|沈幼楚|慕佳芊|陈芷汀|虞淑婉|许念安}.是否在场:
    type: boolean
    check:
      - 初始全部 false；当前场景能被主角看见/听见为 true，离场或仅在通话/被提及为 false。场景切换全量重判。

  ${苏晓樯|温书语|沈幼楚|慕佳芊|陈芷汀|虞淑婉|许念安}.当前下装:
    check:
      - 简写当前可见下半身衣物及鞋，无换衣沿用旧值。

  ${苏晓樯|温书语|沈幼楚|慕佳芊|陈芷汀|虞淑婉|许念安}.所在位置:
    check:
      - 角色当前具体位置（如"重点班教室后排"），未出场沿用旧值。

  ${苏晓樯|温书语|沈幼楚|慕佳芊|陈芷汀|虞淑婉|许念安}.动作:
    check:
      - 每轮必更在场角色：记录此刻最具代表性的具体行为，简明避免流水账。未出场沿用旧值。

  ${苏晓樯|温书语|沈幼楚|慕佳芊|陈芷汀|虞淑婉|许念安}.心情:
    check:
      - 每轮必更在场角色：一句话（≤15字），契合当期性格与好感的心境短语。未出场沿用旧值。

  ${苏晓樯|温书语|沈幼楚|慕佳芊|陈芷汀|虞淑婉|许念安}.内心独白:
    check:
      - 每轮必更在场角色：2~4句（≤50字），角色未说出口的第一人称真实心声，避免总结旁白。未出场沿用旧值。

  主角.当前位置:
    check:
      - 随主角行为更新，与 世界.当前位置 保持一致。

  主角.外貌:
    check:
      - 记录主角当前可见衣着外貌与状态（≤40字），未变化沿用旧值。

  主角.姓名|性别|性格|擅长与学业|家庭背景|班级|年龄|出生日期:
    check:
      - 开局或剧情明确确认后写入，不随意篡改；出生日期格式 YYYY-MM-DD，未知留空。

  主角.重要物品:
    type: array
    check:
      - 仅记录持续影响剧情的重要物品（名称、描述≤40字），无则保持空数组[]。新增用 /主角/重要物品/- 与 add 操作。
