---
变量更新规则:
  剧情.灵气复苏:
    check:
      - 已开启/开启日期由系统控制，模型不私改；仅随世界.日期推进同步更新 阶段（微兆潜龙期/古武抬头期/龙眼破禁期/两界并序期）。

  主角.修行:
    check:
      - 境界：记录当前实质修为，不卡死天花板；须经引气、古武锤炼、龙脉/奇珍助力或真实事件突破，方可更新（例：未引气→引气感灵→炼气初期…→筑基→金丹…；古武同修可并行标明）。
      - 灵气感应：number(0~100)，代表当前阶段对天地灵气的吸纳积蓄度；日常吐纳/悟道/炼化灵物每次+2~8，大境突破后回落至新境界初期刻度。
      - 功法与秘术：字符串数组，记录主角实际习得且掌握的呼吸法、古武拳架或宗门术法，未学勿编造。

  云清晏.好感度:
    type: number
    range: 0~100
    check:
      - 开启DLC第1天处于来程中，第2天起方可接触增减。重视真诚心性、道心契合与危机护持；轻浮戏谑、强探劫伤隐私、毫无尊重地占便宜-5~15。
      - 同行共参龙脉、替其掩饰现代社交尴尬或共度险阻+3~6；面对仙凡两隔拷问仍坚定担当时是突破至道侣的关键契机。

  云清晏.关系阶段:
    check:
      - 初始初识。门槛：20 熟悉 / 50 暧昧 / 80 恋人初期 / 90 亲密恋人。熟悉后每次突破需情感事件与明确选择支撑，不得直接跳级。

  云清晏.NSFW:
    type: boolean
    check:
      - 初始 false，门槛为亲密恋人(好感≥90)且正文实际进入前戏或实质性亲密接触时翻 true，单向不回退。

  云清晏.当前境界:
    check:
      - 记录其恢复进度（初始「金丹跌境（重创封蛰）」），仅随剧情借龙脉温养、灵药补丹或道侣双修实际复原时推进。

  云清晏.伤势余韵:
    check:
      - 简写当前元婴劫伤状况（如「元婴劫伤未愈·阴雨畏寒」「经脉渐通·寒煞减半」），无变化沿用旧值。

  云清晏.是否在场:
    type: boolean
    check:
      - 初始 false。开启DLC第2天以前强制保持 false；入班后依实际同场景在场状况与主角联动重判。

  云清晏.当前上装|当前下装|所在位置|动作|心情|内心独白:
    check:
      - 与常驻七位女主规则同构：仅在 云清晏.是否在场=true 且产生剧情交集时更新具体穿着、位置、动作、≤15字心情与≤50字第一人称内心独白（贴合古宗圣女见识与红尘反差）。
