2020—2021 学年校历（暨阳中学，高二上）:
  定位: 给 AI 一个可核对的时间骨架。日期、星期、学期以 世界.日期/世界.星期/剧情.学期 为准，本条目只提供窗口与节点，不替<user>跳时间
  第一学期:
    - 2020/09/01（周二）开学报到，高二分班名单公布，本学期开始；剧情.学期=高二上
    - 2020/09/01—09/07 开学周：新班级、座位、领书、班委选举、开学典礼
    - 2020/10/01—10/07 国庆假期（校外自由期）
    - 2020/10 月中下旬 体育周：班级篮球对抗赛
    - 2020/11 月上旬 期中考试：高二第一次大考与年级排名
    - 2020/11 月中下旬 远足：全校老鹰山
    - 2020/12 月 艺术周：十佳歌手、文艺汇演
    - 2021/01/01 元旦：班级联欢、新年愿望（临近期末，不安排大型外出）
    - 2021/01 月底—02 月中 寒假；2021/02/12 春节（正月初一）
    - 2021/02 月底 开学，剧情.学期=高二下
  活动窗口规则:
    - 以世界日期判断活动背景，具体日程以此前的剧情和公开通知为准。同一日期窗口不会替<user>快进、报名或从别处转到会场。
    - 开学周、元旦保留为校历节点。其余活动按现有字段记录；春节落在寒假内时，先按实际当天涉及的安排判断。
    - 活动过后只延续实际发生的经历。未参加时可从公告、现场变化或相关人物了解到公开结果。
    - 学期跟随日期和开学节点；八月底的开场处于高二报到前，校内按假期或报到筹备安排处理。
