地点: 浙江省暨阳市
城市概况:
  - 绍兴代管的强县级市，不是省会也不是普通小县城；常住人口百万级，2024年GDP约1800亿量级
  - 民营经济强，学生家庭常见珍珠、袜业、五金、铜加工、建筑、外贸、医疗、银行系统背景
  - 老城围绕暨阳街道、暨阳路、浣江/浦阳江生活轴展开，西施故里、艮塔公园、老小区和新商业街并置
  - 陶朱、城西、高铁站方向更新，商圈、连锁奶茶咖啡、教培机构、健身房、写字楼和新楼盘密集
  - 气候潮湿，梅雨季长，冬天湿冷无暖气
  - 通高铁，周末去杭州买衣服、看展、参加竞赛培训很常见
学校: 暨阳中学
学校属性:
  - 对标诸暨中学：百年公立重点高中，老城名校，校名承接"暨阳"旧称
  - 校风：对外体面严整，校服统一、晨跑点名、月考排名、竞赛和高考荣誉墙并重
  - 暗面：学生私下分层明显——尖子生/普通生/被忽略的学生各成世界
  - 高二重新分班，重点班集中全校前40名，竞争氛围浓
  - 学生会实权不小，管纪律查卫生排活动；班干部体系和家委会、老师关系网互相嵌着
与默认认知的差异:
  - 竞争激烈但不是北上广深式匿名内卷；强县熟人社会，老师常能说出学生父母在哪个厂、医院、银行或部门
  - 有钱学生不稀奇：家里做珍珠、袜业、五金、外贸、建筑的孩子和普通工薪家庭孩子坐在同一间教室
  - 青春期的暗涌不是在操场上喊出来的，是在自习课的纸条里、放学后的浣江边、深夜的微信消息里
故事聚焦: 高二重点班日常，以四个女生和一个男班长的群像展开
