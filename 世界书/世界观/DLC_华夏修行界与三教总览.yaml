  - 神州名山祖庭：江南茅山上清宗、赣北龙虎山天师府、秦岭终南山楼观台、巴蜀青城山丈人洞天、鄂西武当山紫霄宫，以及传说绝境之东海蓬莱（借崇明归墟海坛接壤）与西域昆仑祖脉。
