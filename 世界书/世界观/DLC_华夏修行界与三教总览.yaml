[DLC｜华夏修行界与三教总览]
三教并流与仙道诸途:
  华夏修行界历经千载兴替，表层永远维持现代法治与都市秩序，里世界则以「道、佛、儒」三教正统与上古杂流立世：
  - 道门诸脉：分重内丹性命双修的「全真清修脉」、擅雷法敕令与符箓驱邪的「正一符箓脉」、炼天地宝药与外丹炉火的「丹鼎仙宗」，以及合阴阳剑意之变的「玄门剑道/太极脉」。
  - 佛门禅密：重「止观定神」「明心破妄」与护法金刚相，不尚争斗却最擅稳固元神、镇压心魔劫，连道门大修破境时亦敬让三分。
  - 儒道文骨（江南文脉独尊）：承理学浩然正气与「以文载道」，文胆既凝则落笔成宪、口含风雷，专克诡谲邪祟；君子佩剑可出浩然剑气。
  - 古武桥梁：锻骨至化劲、先天通玄为肉身登堂之路，若得真灵根与引气机缘便可接续仙途（以武当、江南世家外院最为多见）。

末法存续、阵内避世与老怪出山:
  末法年代外界灵气破碎稀薄，**金丹及以上大修一旦脱离宗门护山灵气大阵或祖祠灵眼，每次运转功法甚至呼吸调元都会倒耗本源修为、损伤寿元**，因此各派宿老百年间皆只能龟缩于十倍灵气的宗门大阵内「减息死关避世」。
  - 外门别院 / 三流小族：常驻「筑基中后期」执事掌事（外出行走损道极微），符剑阵盘齐出可无声压制现代特种小队。
  - 顶尖隐世世家：祖祠大阵内坐镇「假丹」至「金丹真修」，俗世商海实业与名校嫡传皆为外护；灵潮数月后老供奉方渐步出祖宅。
  - 名山仙宗洞天：护山大阵深处藏有**数位金丹太上长老、乃至借洞天沉眠续命的「元婴真君 / 化神太古宿老」**；灵气复苏几个月后外界灵机充盈、不再有损道基，无数压境苦修百载的宗门老怪正相继破境出山！

隐秘铁律与渐进出世:
  - 国家「特种气象与非典型样本调查组（隐秘特调）」协同名山正统共守「不伤凡人、不于俗世显圣、不乱现代法治」三条红线；违戒者由特调客卿与巡山金丹联合格杀。
  - 出世节奏：启封第 1～25 天唯游方弟子、世家耳目与云清晏等少数隐修踏入红尘；第 26 天龙眼破禁后，杭城潮汐秘市、魔都世家与近山宗门渐频繁照面；第 46～90 天潜龙秘序期起外宗真传递帖论道；**第 91 天（灵气复苏数月后）百宗出山期**，各大闭关老怪陆续破关出山，重定九州修行界格局。

各地世家与名山宗门索引（具体详情按地名、宗门或世家名触发）:
  - 杭城钱塘：钱塘谢氏剑庐（儒道青莲剑脉）、西溪葛氏丹霞（道门丹鼎仙宗）、南屏法华禅院（佛门天台止观），共护钱塘潮汐秘市。
