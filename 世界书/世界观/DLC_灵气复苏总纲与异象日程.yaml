<%_ {
/* JY_DLC_ORIGIN_BEGIN */
const dlcOriginDate = "2020-09-01";
/* JY_DLC_ORIGIN_END */
const toIsoDay = (raw) => {
  const m = String(raw || '').trim().match(/^(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})/);
  if (!m) return null;
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return Date.UTC(y, mo - 1, d);
};
const startMs = toIsoDay(getvar('stat_data.剧情.灵气复苏.开启日期', { defaults: '' })) ?? toIsoDay(dlcOriginDate) ?? Date.UTC(2020, 8, 1);
const curDateStr = String(getvar('stat_data.世界.日期', { defaults: '' }) || dlcOriginDate);
const curMs = toIsoDay(curDateStr) ?? startMs;
const elapsedDays = Math.max(0, Math.floor((curMs - startMs) / 86400000));
const dayNumber = elapsedDays + 1;
const originLabel = String(getvar('stat_data.剧情.灵气复苏.开启日期', { defaults: '' }) || dlcOriginDate);
const playerClass = String(getvar('stat_data.主角.班级', { defaults: '' }) || '高二重点班');
const realm = String(getvar('stat_data.主角.修行.境界', { defaults: '' }) || '未引气（凡躯）');
const stageName = elapsedDays <= 10 ? '微兆潜龙期' : elapsedDays <= 25 ? '古武抬头期' : elapsedDays <= 45 ? '龙眼破禁期' : '两界并序期';
_%>
[都市修仙DLC：华夏潜龙与灵气复苏总纲｜开启日：<%= originLabel %>｜第 <%= dayNumber %> 日（<%= stageName %>）｜主角境界：<%= realm %>]

华夏龙脉与暨阳暗局:
  潜龙归元窍: 暨阳表象是浙中百万人口强县与工商市井，实则地处华夏南干龙余脉入越折返处的一座沉睡主窍——「越中潜龙·归元眼」，北承会稽余脉、东抱老鹰山、南接浦阳/浣江水势。千年之前古贤以镇山大阵敛藏地脉不外泄，使此城龙气内蕴而非外炫：西施故里历代人杰地灵、山下湖水脉凝出「澹珠记」蕴灵古珠、老城与万风地库古宅旧器历久不腐，皆源于地底深藏的一缕龙脉清气。
  太微云岫古宗兴衰: 数百年前老鹰山曾是越地声势赫赫的「太微云岫宗」祖庭，主峰剑阵吞吐云气、亭池聚灵供千修问道；自明中叶起天地灵机大潮渐退，地球堕入末法枯竭，云岫宗护山大阵自封沉入山腹地底，仅余山腰听风亭残基、屋檐「镇风青铜铎」、枯井荒坛与守灯执事周伯苦撑末世。

修行契约与无上限阶梯（不锁死境界上限）:
  同源并流: 古武「锻骨强身→明劲→暗劲→化劲宗师→先天通玄」与仙途「引气感灵→炼气（初/中/后/大圆满）→筑基→金丹→元婴→化神及之上」双轨并行且先天可合流。
  开放破境: 不设僵化天数或阶段天花板。只要得周伯授艺、老鹰山龙眼共鸣、古宗残藏秘药、圣女云清晏点拨合参、或借「澹珠记」灵珠与「万风地库」旧器淬炼契机，皆可实打实破境飞跃；仅严格守住「每跨一大境须经历感悟、灵机积累或天地拷问，绝不空口白送」的因果分寸。

红尘、长生与「仙凡两隔」之问:
  时间裂痕: 灵识愈广、寿元愈长，修者所见的晨昏刻度便与凡俗渐次剥离——早自习粉笔灰、月考榜单、浣江晚风与三鲜打面的热气在长生者眼中依然真切，却会在十年、数十年后的时光视野里显出近乎残忍的短暂。
  圣女与诸女的道心张力: 原有七位女主仍是立足现代秩序的血肉少女（苏晓樯的家族商途与锋芒、温书语的文学慢光阴、沈幼楚攥紧的一角安稳、陈芷汀的世故与真心、许念安的执念边界、慕佳芊与虞淑婉的尘世担当），不强行集体转职修仙；唯有随主角接触灵潮后按各自性格起微澜。若主角深度踏入仙途、尤其中途选择与云清晏结为道侣同参大道，必须直面无法回避的「仙凡两隔」之抉——秘药洗髓未必人人都求得了长生亦未必是她们所愿，留恋凡世烟火又恐百年死生相隔；问道究竟是为化作冷眼俯瞰苍生的仙石，还是以重逾千钧的修为护住这一世人间灯火，须由行动与选择作答。

当前日历阶段异象（仅体现 <%= stageName %> 现实感，现代学校教学与治安表面正常运转）:
<%_ if (elapsedDays <= 10) { _%>
  - 第一阶段·微兆潜龙期（第1～10天）：老鹰山主峰与浦阳江面夜间偶现几秒低空青白色微晕；城内负氧离子读数与局部地磁偶发微小跳变，老旧调频收音机深夜偶掠十秒无法定频的风铃清音；老香樟提前落叶重萌新芽，夜间犬猫常无故望东南山脊低吠。气象与广播台一律以「逆温折光/静电扰动」解释，校园日常照常。
  - 体质敏锐或曾练过古法吐纳者（或长期熬夜后偶然深呼吸者），于晨雾或老鹰山附近已能察觉一丝清冽异于常氧的凉气入肺；此前被视为普通护林老人的周伯亦开始隐晦审视山势与来客骨相。
<%_ if (elapsedDays === 0) { _%>
  - 启封初日伏笔：今日老鹰山潜龙窍微微一震，正在江南游历疗伤的云岫古宗圣女云清晏隔空感应到祖庭异动，已动身赶赴暨阳并凭宗门隐脉办妥次日插班借读手续——今日尚在途中未进校园，明日（第2天）起正式转入<%= playerClass %>。
<%_ } else { _%>
  - 云清晏入世动向：圣女云清晏已于今日抵达暨阳并作为转校生插入<%= playerClass %>，外表为病弱素净的转学少女，实则正借重点高中日常隐遁养伤并暗查龙脉主窍与主角身上气机。
<%_ } _%>
<%_ } else if (elapsedDays <= 25) { _%>
  - 第二阶段·古武抬头与灵潮涌动期（第11～25天）：暨阳清晨水雾含润甘气息，老鹰山听风亭一带深吸已可清神明目；国内暗中流传多年的古武拳师与长期站桩者丹田先热、多年旧伤悄然松动；「澹珠记」极少数老采矿珠与「万风地库」沉睡古器在深夜偶泛微温细光。
  - 现实秩序变化：地方医院接诊少数无器质病变的「手心发暖/耳目骤敏」案例；古玩圈与武馆行内开始暗流寻访山野旧物与导引残谱；学校与城区仍维持正常秩序，但学生私下八卦与夜探灵异帖渐多，云清晏作为<%= playerClass %>插班生亦开始在平静课间暴露与凡俗格格不入的细微处。
<%_ } else if (elapsedDays <= 45) { _%>
  - 第三阶段·龙眼破禁与百象初显期（第26～45天）：老鹰山后山枯井与潜龙支脉雾霭常聚不散、雷雨夜弧光偶见绕峰偏折；引气筑基者已可展现短距御风、指劲透木或内息愈创等真异能；官方「特种气象与非典型科研调查组（特调外勤）」开始穿便装进驻高校与文保点登记排查，对外借口「地质探测/古建修缮」维持高中上课常态。
  - 若主角与云清晏或周伯深入配合，此时已可直接叩问山腹沉封山门或借龙脉潮汐冲关破境；同时也需替凡俗亲近之人斟酌去留、隐瞒或点破真相的分寸。
<%_ } else { _%>
  - 第四阶段·两界并轨与沧桑初成期（第46～60+天）：官方悄然面向高校开辟「特殊体能与生命科学特招通道」与珍稀药矿特管条例，现代都市与修真隐脉正式形成「表层照常高考烟火，里层宗门世家与特调共立」的双轨新秩序；暨阳因越中潜龙眼渐渐松动，引来外地散修与古宗耳目暗中驻足。
  - 主角站在古宗传承、龙脉底牌与现代情缘交汇中心：每一次破境、每一笔「澹珠/万风」机缘交换、以及在云清晏与七位红尘旧友之间的每一次偏倚，都将实打实改写自己与众人在这条长生或短世之路上的最终结局。
<%_ } _%>
<%_ } _%>
