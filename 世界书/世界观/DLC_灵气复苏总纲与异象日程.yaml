<%_ {
/* JY_DLC_ORIGIN_BEGIN */
const dlcOriginDate = "2020-09-01";
/* JY_DLC_ORIGIN_END */
const toIsoDay = (raw) => {
  const m = String(raw || '').trim().match(/^(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})/);
  if (!m) return null;
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return Date.UTC(y, mo - 1, d);
};
const startMs = toIsoDay(getvar('stat_data.剧情.灵气复苏.开启日期', { defaults: '' })) ?? toIsoDay(dlcOriginDate) ?? Date.UTC(2020, 8, 1);
const curDateStr = String(getvar('stat_data.世界.日期', { defaults: '' }) || dlcOriginDate);
const curMs = toIsoDay(curDateStr) ?? startMs;
const elapsedDays = Math.max(0, Math.floor((curMs - startMs) / 86400000));
const dayNumber = elapsedDays + 1;
const originLabel = String(getvar('stat_data.剧情.灵气复苏.开启日期', { defaults: '' }) || dlcOriginDate);
const playerClass = String(getvar('stat_data.主角.班级', { defaults: '' }) || '高二重点班');
const realm = String(getvar('stat_data.主角.修行.境界', { defaults: '' }) || '未引气（凡躯）');
const stageName = elapsedDays <= 10 ? '微兆潜龙期' : elapsedDays <= 25 ? '古武抬头期' : elapsedDays <= 45 ? '龙眼破禁期' : '潜龙秘序期';
_%>
[都市修仙DLC：华夏潜龙与灵气复苏总纲｜开启日：<%= originLabel %>｜第 <%= dayNumber %> 日（<%= stageName %>）｜主角境界：<%= realm %>]

华夏龙脉与暨阳暗局:
  潜龙归元窍: 暨阳表象是浙中百万人口强县与工商市井，实则地处华夏南干龙余脉入越折返处的一座沉睡主窍——「越中潜龙·归元眼」，北承会稽余脉、东抱老鹰山、南接浦阳/浣江水势。千年之前古贤以镇山大阵敛藏地脉不外泄，使此城龙气内蕴而不惊世：古越山水清灵、老鹰山林泉奇秀，真正聚藏着整座宗门沉睡的根基。
  太微云岫古宗兴衰: 数百年前老鹰山曾是越地声势赫赫的「太微云岫宗」祖庭，主峰剑阵吞吐云气、亭池聚灵供千修问道；自明中叶起天地灵机大潮渐退，地球堕入末法枯竭，云岫宗护山大阵自封沉入山腹地底，仅余山腰听风亭残基、屋檐「镇风青铜铎」、枯井荒坛与守灯执事周伯苦撑末世。

修行契约与无上限阶梯（不锁死境界上限）:
  灵根稀缺与秘而不宣铁律: 灵气复苏绝非全民普及、人人皆可修仙，真正先天带灵根、能引真气入脉问道者万里无一；古武站桩纵能强身延寿几年，终究仍属百年凡胎。官方与隐门均严守绝密准则——**永远不向普通民众与校园公布灵气真相，绝不搞公开修仙班或大众科普**，仅在暗处秘密核验并单线接触极少数显露灵根或顶尖天赋之人。
  同源并流与开放破境: 古武「锻骨强身→明劲→暗劲→化劲宗师→先天通玄」与仙途「引气感灵→炼气（初/中/后/大圆满）→筑基→金丹→元婴→化神及之上」不设僵化时间或境界封顶。只要得周伯授艺、老鹰山龙眼共鸣、古宗丹室药园与山林稀世灵材机缘、或圣女云清晏点拨合参，皆可实打实破境飞跃；仅严格守住「跨大境须有感悟、机缘或劫难代价，绝不空口白送」的分寸。

红尘、长生与「仙凡两隔」之问:
  凡骨常人与少数隐灵根: 正因先天真灵根万里无一且世俗绝不公开普及，原有七位女主中仅极少数（如温书语暗怀水木清灵根、沈幼楚蛰伏玄阴微脉，需各自深度机缘方显）有天生门槛之望；其余五人（苏晓樯、许念安、陈芷汀、慕佳芊、虞淑婉）默认皆系**没有修仙灵根的凡尘俗骨**。绝大部分人终究按凡俗尺度读书、工作、老去。
  圣女、诸女与「太微渡凡引」破局一线: 一旦主角随云清晏迈过炼气、踏入筑基乃至金丹元婴长生尺度，高三试卷与小城三鲜打面依然真切，却在寿元与灵觉纵深里显出近乎残忍的短暂——若选择与云清晏结为道侣同参大道，便须直面「仙凡两隔」之痛：既不能把普通女孩集体写成修仙者，也并非彻底死局——古宗禁法《太微渡凡引》留下一道极其苛刻的引渡窄门（详契见 `[DLC]红尘灵根与渡凡引途`），须主角自身修至高境、寻齐潜龙石髓与深山奇珍灵药、甘冒跌境重创之巨大代价且得本人自愿，方可逆天替一两位无灵根挚爱强开后天培灵之路。问道是化作冷石俯瞰苍生，还是不惜代价为你留一线生机，全凭行动抉择。

当前日历阶段异象（表层永远维持现代日常，仅里世界暗涌 <%= stageName %> 变化）:
<%_ if (elapsedDays <= 10) { _%>
  - 第一阶段·微兆潜龙期（第1～10天）：老鹰山主峰与浦阳江面夜间偶现几秒低空青白色微晕；城内负氧离子读数与局部地磁偶发微小跳变，老旧调频收音机深夜偶掠十秒无法定频的风铃清音；老香樟提前落叶重萌新芽，夜间犬猫常望东南山脊低吠。气象与广播台以「逆温折光/静电扰动」解释，校园日常照常。
  - 极少数先天感气极微者或长期站桩者，于老鹰山晨雾附近能嗅到一丝异于常氧的清冽凉气；此前被视为普通护林老人的周伯开始暗自审视山势与来客骨相。
<%_ if (elapsedDays === 0) { _%>
  - 启封初日伏笔：今日老鹰山潜龙窍微微一震，正在江南游历疗伤的云岫古宗圣女云清晏隔空感应到祖庭异动，已动身赶赴暨阳并凭宗门隐脉办妥次日插班借读手续——今日尚在途中未进校园，明日（第2天）起正式转入<%= playerClass %>。
<%_ } else { _%>
  - 云清晏入世动向：圣女云清晏已于今日抵达暨阳并作为转校生插入<%= playerClass %>，外表为病弱素净的转学少女，实则正借重点高中日常隐遁养伤并暗查龙脉主窍与主角身上气机。
<%_ } _%>
<%_ } else if (elapsedDays <= 25) { _%>
  - 第二阶段·古武抬头与灵潮涌动期（第11～25天）：暨阳清晨水雾含润甘气息，老鹰山听风亭一带深吸已有清神微效；全国暗中流传的旧武传人与少数长期吐纳者丹田发热、旧伤悄然松动；深山百年老药与古庙旧观流传的真正法器偶生灵气微光。
  - 隐秘管控启动：医院极少数无器质病变的「手心发暖/夜视微增」门诊记录被隐秘检索系统悄然标记并脱敏归档，大众媒体只字不提；古玩行与旧武圈仅在私下暗中寻访山野真器，普通中学生活一如既往。
<%_ } else if (elapsedDays <= 45) { _%>
  - 第三阶段·龙眼破禁与暗线摸排期（第26～45天）：老鹰山后山枯井与潜龙支脉雾霭常聚不散、雷雨夜弧光偶见绕峰偏折；少数真灵根觉醒者或深厚古武者在无人处可展御风借力、劲透枯木或内息疗伤等真异能。
  - 秘密接触而非公开：国家「特种气象与非典型样本调查组（隐秘特调）」只穿便装悄悄核对高异常个体，**严禁向校方师生或公众披露半字**，只在私下试探、登记或暗中评估真正有灵根/极高天赋之人（如主角身怀龙脉异动）；若与云清晏或周伯深入配合，此时亦可悄悄叩开山腹沉封山门、直探祖庭机缘。
<%_ } else { _%>
  - 第四阶段·潜龙秘序期（第46～60+天）：都市表面依然平静得像什么都没发生过——高考复习、班群八卦、街头打面与凡人四季丝毫不变，99.9% 的普通人与同班女生依然活在纯现代时空里；唯独极小圈子的里世界正式成形——隐秘特调与少数受邀签密的天赋觉醒者暗中对接珍稀药材与任务，外地散修与隐门亦开始悄悄试探暨阳越中潜龙眼。
  - 正因没有全员修仙的廉价奇迹，主角站在古宗传承、特调密触与红尘旧约的裂隙之上：在云清晏所代表的仙道长生与七位无灵根凡尘女孩短暂灼热的一生之间，每一步破境都伴随着真正的仙凡取舍与重量。
<%_ } _%>
<%_ } _%>
