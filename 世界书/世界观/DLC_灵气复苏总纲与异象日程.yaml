<%_ if (getvar('stat_data.剧情.灵气复苏.已开启', { defaults: false }) === true) { _%>
<%_
const toIsoDay = raw => {
  const m = String(raw || '').match(/^(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})/);
  return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null;
};
const origin = getvar('stat_data.剧情.灵气复苏.开启日期', { defaults: '' });
const start = toIsoDay(origin);
const now = toIsoDay(getvar('stat_data.世界.日期', { defaults: '' })) ?? start;
const day = start === null ? 1 : Math.max(1, Math.floor((now - start) / 86400000) + 1);
const stage = day <= 10 ? '微兆潜龙期' : day <= 25 ? '古武抬头期' : day <= 45 ? '龙眼破禁期' : '潜龙秘序期';
const realm = getvar('stat_data.主角.修行.境界', { defaults: '未引气（凡躯）' });
const sign = day <= 10 ? '山风与云光偶有微兆' : day <= 25 ? '山林灵材与古武修者渐有感应' : day <= 45 ? '老鹰山龙眼松动' : '隐门开始探查潜龙眼';
_%>
[灵气复苏｜开启日：<%= origin %>｜第 <%= day %> 日（<%= stage %>）｜主角：<%= realm %>]
- 暨阳的灵潮源于老鹰山「越中潜龙·归元眼」。当前异象：<%= sign %>，仅在相关场景自然显现。
- 校园按原校历和当下事件推进。真灵根万里无一，修行与特调接触限于知情小圈；公众及校方沿用日常解释。
- 修炼进度由行动、机缘与代价决定。原有角色的仙缘随实际剧情形成。
<%_ } _%>
