<%_ } else { _%>
  - 第五阶段·百宗出山期（第401天起）：外界游离灵气终跨「出阵不损道基」阈值！各宗门与世家闭死关的金丹老祖、假婴宿老与元婴真君陆续突破瓶口或解封出山重定座次，表层仍守现代法治遮掩。
<%_ } _%>
