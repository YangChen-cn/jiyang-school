<%_ if (getvar('stat_data.剧情.灵气复苏.已开启', { defaults: false }) === true) { _%>
<%_ {
const dlcOriginDate = getvar('stat_data.剧情.灵气复苏.开启日期', { defaults: '' }) || '2020-09-01';
const toIsoDay = (raw) => {
  const m = String(raw || '').trim().match(/^(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})/);
  if (!m) return null;
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return Date.UTC(y, mo - 1, d);
};
const oriYearMatch = String(dlcOriginDate || '').trim().match(/^(\d{4})/);
const parsedStartYear = Number(getvar('stat_data.世界.起始年份', { defaults: '' }));
const startYear = (Number.isInteger(parsedStartYear) && parsedStartYear >= 1000 && parsedStartYear <= 9900) ? parsedStartYear : (oriYearMatch ? Number(oriYearMatch[1]) : 2020);
const startMs = toIsoDay(dlcOriginDate) ?? Date.UTC(startYear, 8, 1);
const curDateStr = String(getvar('stat_data.世界.日期', { defaults: '' }) || dlcOriginDate);
const curMs = toIsoDay(curDateStr) ?? startMs;
const gradMs = Date.UTC(startYear + 2, 6, 1);
const isPostGradOrigin = startMs >= gradMs;
const remainDays = isPostGradOrigin ? 0 : Math.floor((gradMs - startMs) / 86400000);
const baseTotal = isPostGradOrigin ? 90 : Math.max(120, Math.min(400, Math.floor(remainDays * 0.92)));
const paceRaw = String(getvar('stat_data.剧情.灵气复苏.节奏', { defaults: '' }) || '').trim();
const paceName = paceRaw.includes('适中') ? '适中' : paceRaw.includes('紧凑') ? '紧凑' : paceRaw.includes('极速') ? '极速' : '慢热';
const paceScale = paceName === '适中' ? 0.5 : paceName === '紧凑' ? 0.25 : paceName === '极速' ? 0.12 : 1;
const totalDays = Math.max(8, Math.round(baseTotal * paceScale));
const s1 = Math.max(1, Math.round(totalDays * 45 / 400));
const s2 = Math.max(s1 + 1, Math.round(totalDays * 120 / 400));
const s3 = Math.max(s2 + 1, Math.round(totalDays * 240 / 400));
const s4 = totalDays;
const elapsedDays = Math.max(0, Math.floor((curMs - startMs) / 86400000));
const dayNumber = elapsedDays + 1;
const realm = String(getvar('stat_data.主角.修行.境界', { defaults: '' }) || '未引气（凡躯）');
const stageName = dayNumber <= s1 ? '微兆潜龙期' : dayNumber <= s2 ? '灵潮初涌期' : dayNumber <= s3 ? '龙眼破禁期' : dayNumber <= s4 ? '潜龙秘序期' : '百宗出山期';
const modeText = paceName === '慢热'
  ? (isPostGradOrigin ? '毕业后 90 日紧凑线' : s4 < 400 ? '高三自适应 ' + s4 + ' 日线' : '400 日慢热长线')
  : (paceName + ' ×' + paceScale + ' · ' + s4 + ' 日线');
_%>
[都市修仙DLC：华夏潜龙与灵气复苏总纲｜开启日：<%= dlcOriginDate %>｜第 <%= dayNumber %> 日（<%= stageName %>）｜本档前四期共 <%= s4 %> 日（<%= paceName %>）｜主角境界：<%= realm %>]

华夏龙脉与暨阳暗局:
  潜龙归元窍: 暨阳实为华夏南干龙入越沉睡主窍「越中潜龙·归元眼」（北承会稽、东抱老鹰山、南接浦阳江），古镇山大阵敛藏地脉不外泄；灵气前期主自老鹰山荒脉与城郊古窍极其缓慢渗露，普通市区与校园仍维持常人世界底色。
  太微云岫祖庭: 老鹰山深处沉封着昔年浙东名宗「太微云岫宗」外门山阵与残殿，守灯执事周伯独自守望，严守山门因果。
  阵内避世与老怪出山铁律: 末法外界灵气枯竭，金丹及以上离阵调运会倒耗本源损道基，各宗宿老皆封死阵内减息避世；默认按高二约400日/高三≥120日/毕业后90日启封，可在太虚灵枢或开局按慢热/适中/紧凑/极速四档缩放。**本档第 <%= s4 + 1 %> 天起**外界灵气堪托高阶道基，老怪相继突破出山。
  世家同源线索: 灵潮涌动下杭城、魔都世家与三教名山渐次启封；**暨阳苏家实与魔都「苏氏沧溟水府」百年前同源分家**（已断传承彻底隐于凡俗商海，唯后人苏晚棠骨血中隐存一缕未启水灵根；其家「澹珠记」纯系凡俗珍珠生意，与修行毫无关联）。

修行总纲、仙凡双轨与保密准则:
  灵根稀缺与仙凡两隔: 真灵根万中无一；除承袭苏氏血脉的苏晚棠外，不预设其他既有角色天生具备灵根或必然入道。暨阳中学绝大多数师生与校领导均是完全不知修真内情的凡人，正是留在凡俗时间流上的故人与牵挂，构成了漫长仙路上最真实的「仙凡两隔」。其他角色是否因逆天奇遇破例入道，全交剧情自然演化。
  现世双轨与校园锚点: 缓慢复苏下，初入引气/炼气期远不足以抗衡现代国家法治与社会运转；即便隐世宗门世家嫡系亦须修读现代大学学业、凭世俗实业行走红尘。高三备考浙大、家庭实业与校内秩序在前中期照常决定现实命运，绝非开启修行便架空日常。
  绝密防全知降级: 国家「隐秘特调」仅于暗处单线摸排封控，永不向公众、普通校领导与学校公开，严禁虚构全校普及修仙等荒诞设定；无渠道凡人在对话中须按感官直觉模糊描述，严禁脱口「灵气/闭关/金丹」等专有名词。
  四层空间秩序: 世俗区（校城日常）隐匿超凡行迹，现世饮食烟火同样温养身心不排斥；灰色区（潮汐秘市等）半公开验资交易；隐世区（宗门祖庭阵内）依山门规矩；秘境遗迹内外隔绝、自成独立法则。若被凡人偶窥异状，优先以遮蔽、推作巧合或模糊记忆收束。
  奇遇独立性: 容许散落民间的边缘传承或地方民俗奇物独立存在，严禁把普通店铺、俗世商业品牌或无关奇遇强行绑定老鹰山归元眼或修仙血脉。
  开放破境（体修/气修统一阶梯）: 引气→炼气→筑基→金丹→元婴→化神+（外门桩功与炼体纳入体修一途共走此阶），不锁主角速度上限，破跨大境须有真实感悟、机缘或劫难代价。

当前日历阶段异象（本档共 <%= s4 %> 天前四阶段演化｜<%= modeText %>）:
<%_ if (dayNumber <= s1) { _%>
  - 第一阶段·微兆潜龙期（第1～<%= s1 %>天）：老鹰山夜现数秒低空青白微晕，地磁微跳，旧调频收音机深夜偶掠十秒风铃清音（气象台以逆温静电解释）。极少数感气者于山林晨雾间偶可察清冽微风，周伯开始暗自审视来客骨相，市区与校园毫无异样。
<%_ } else if (dayNumber <= s2) { _%>
  - 第二阶段·灵潮初涌期（第<%= s1 + 1 %>～<%= s2 %>天）：老鹰山听风亭一带吐纳具清神微效；坊间极少数体修传人与稀少感气者偶生丹田微暖，真品古器偶生微光；杭城、魔都世家与名山外院暗调游方耳目。医院极少数无病变异象门诊被隐秘系统脱敏归档，大众媒体与普通学校只字不提。
<%_ } else if (dayNumber <= s3) { _%>
  - 第三阶段·龙眼破禁期（第<%= s2 + 1 %>～<%= s3 %>天）：老鹰山与城郊归元眼支脉晨昏雾霭渐厚，雷夜偶见弧光偏折；少数散落民间与隐门新秀私下可展微末道法，杭城夜集坊市开始秘密流通灵材符器。国家「特种气象与非典型样本调查组（隐秘特调）」便装单线接触极少数异常样本，严禁公开；深探线索者可试叩山腹沉封山门。
<%_ } else if (dayNumber <= s4) { _%>
  - 第四阶段·潜龙秘序期（第<%= s3 + 1 %>～<%= s4 %>天）：表层都市照常运转，学业与毕业去向随校历及剧情推进，里世界渐次成型——特调单线暗控，杭城魔都世家与各名山外门真传陆续现身越中暗探归元眼脉动，少数身负渊源或奇遇之人迎来关键抉择。
<%_ } else { _%>
  - 第五阶段·百宗出山期（第<%= s4 + 1 %>天起）：外界游离灵气终跨「出阵不损道基」阈值！各宗门与世家闭死关的金丹老祖、假婴宿老与元婴真君陆续突破瓶口或解封出山重定座次，表层仍守现代法治遮掩。
<%_ } _%>
<%_ } _%>
<%_ } _%>
