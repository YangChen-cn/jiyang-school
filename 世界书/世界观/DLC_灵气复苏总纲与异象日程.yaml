<%_ if (getvar('stat_data.剧情.灵气复苏.已开启', { defaults: false }) === true) { _%>
<%_ {
const dlcOriginDate = getvar('stat_data.剧情.灵气复苏.开启日期', { defaults: '' }) || '2020-09-01';
const toIsoDay = (raw) => {
  const m = String(raw || '').trim().match(/^(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})/);
  if (!m) return null;
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return Date.UTC(y, mo - 1, d);
};
const startMs = toIsoDay(dlcOriginDate) ?? Date.UTC(2020, 8, 1);
const curDateStr = String(getvar('stat_data.世界.日期', { defaults: '' }) || dlcOriginDate);
const curMs = toIsoDay(curDateStr) ?? startMs;
const elapsedDays = Math.max(0, Math.floor((curMs - startMs) / 86400000));
const dayNumber = elapsedDays + 1;
const realm = String(getvar('stat_data.主角.修行.境界', { defaults: '' }) || '未引气（凡躯）');
const stageName = dayNumber <= 45 ? '微兆潜龙期' : dayNumber <= 120 ? '灵潮初涌期' : dayNumber <= 240 ? '龙眼破禁期' : dayNumber <= 400 ? '潜龙秘序期' : '百宗出山期';
_%>
[都市修仙DLC：华夏潜龙与灵气复苏总纲｜开启日：<%= dlcOriginDate %>｜第 <%= dayNumber %> 日（<%= stageName %>）｜主角境界：<%= realm %>]

华夏龙脉与暨阳暗局:
  潜龙归元窍与学宫聚灵核心: 暨阳为华夏南干龙入越主窍「越中潜龙·归元眼」，而**百年学府「暨阳中学」正压归元眼涌泉正穴**，外连老鹰山古阵、南接浦阳水势。在此汇聚求学或任教者受龙气滋养，唤醒灵根乃至高品/特殊灵根的概率远超外界百倍（各人物具体潜在仙缘归属各自档案，不预设必选定局）。
  秘密仙班（对外称实验尖子班）: 灵气复苏一段时期、校内数人显露灵根后，国家「隐秘特调」将协同校方高层秘密组建专班——**对外统称「清北强基实验尖子班」**（照常保留学籍、课业掩护与校园日常），**对内实为收拢觉醒灵根学子的秘密修仙班**，统一配发基础吐纳指引、集中依托学宫正穴修行并签署保密红线（严禁对普通民众显圣或欺压凡俗）。高二/高三开启可依剧情受邀编入，已毕业开启则视作母校秘密增设之后备班底。
  太微云岫祖庭: 老鹰山深处沉封着昔年浙东名宗「太微云岫宗」外门山阵与残殿，守灯执事周伯与校园暗局遥相呼应。
  阵内避世与老怪出山铁律: 末法外界灵气枯竭，金丹及以上离阵调运会倒耗本源损道基，各宗宿老皆封死阵内减息避世；**第 401 天（灵气缓慢复苏越过一年后）起**外界灵气方堪托高阶道基，老怪相继突破出山。
  世家同源线索: 杭城、魔都世家与三教名山渐次启封；**暨阳苏家实与魔都「苏氏沧溟水府」百年前同源分家**，详脉随对应世家与角色档案展开。

修行总纲与保密准则:
  公开所见与防全知降级: 表层永远维持现代日常与保密秩序；路人、舆论与未入局者在对话中须按感官直觉模糊描述，严禁凡人脱口说「灵气/闭关/金丹」等专有名词；知情者方辨龙脉、修为与宗门，证据不足时只作观察与推测。
  四层空间秩序: 世俗区（校城日常）隐匿超凡行迹，现世饮食烟火同样温养身心不排斥；灰色区（潮汐秘市等）半公开验资交易；隐世区（宗门祖庭阵内）依山门规矩；秘境遗迹内外隔绝、自成独立法则。若被凡人偶窥异状，优先以遮蔽、推作巧合或模糊记忆收束。
  奇遇独立性: 容许散落民间的边缘传承或地方民俗奇物独立存在，严禁把普通店铺、俗世商业品牌或无关奇遇强行绑定老鹰山归元眼主线。
  开放破境（体修/气修统一阶梯）: 引气→炼气→筑基→金丹→元婴→化神+（外门桩功与炼体纳入体修一途共走此阶），不锁主角速度上限，破跨大境须有真实感悟、机缘或劫难代价。

当前日历阶段异象（约400天渐进演化，适配任意时期开启）:
<%_ if (dayNumber <= 45) { _%>
  - 第一阶段·微兆潜龙期（第1～45天）：老鹰山夜现数秒低空青白微晕，地磁微跳，旧调频收音机深夜偶掠十秒风铃清音（气象台以逆温静电解释）。极少数感气者于暨阳中学教室/山晨雾间可察清冽灵气，周伯开始暗自审视来客骨相。
<%_ } else if (dayNumber <= 120) { _%>
  - 第二阶段·灵潮初涌期（第46～120天）：暨阳中学与老鹰山听风亭一带吐纳具清神微效；坊间炼体传人与校内近龙眼者偶生丹田发热或觉醒初兆，真品古器偶生微光；杭城、魔都世家与名山外院暗调游方耳目。医院少数无病变异象门诊被隐秘系统脱敏归档，大众媒体只字不提。
<%_ } else if (dayNumber <= 240) { _%>
  - 第三阶段·龙眼破禁期（第121～240天）：龙眼支脉雾霭常聚，雷夜偶见弧光偏折；少数觉醒者私下可展异能，杭城夜集坊市开始流通灵材符器。国家「特种气象与非典型样本调查组（隐秘特调）」便装秘密摸排接触高天赋者并筹建「秘密实验尖子班（仙班）」收拢校内觉醒学子，严禁对外公开；深探线索者可试叩山腹沉封山门。
<%_ } else if (dayNumber <= 400) { _%>
