<%_ if (getvar('stat_data.剧情.灵气复苏.已开启', { defaults: false }) === true) { _%>
<%_ {
const dlcOriginDate = getvar('stat_data.剧情.灵气复苏.开启日期', { defaults: '' }) || '2020-09-01';
const toIsoDay = (raw) => {
  const m = String(raw || '').trim().match(/^(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})/);
  if (!m) return null;
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return Date.UTC(y, mo - 1, d);
};
const startMs = toIsoDay(dlcOriginDate) ?? Date.UTC(2020, 8, 1);
const curDateStr = String(getvar('stat_data.世界.日期', { defaults: '' }) || dlcOriginDate);
const curMs = toIsoDay(curDateStr) ?? startMs;
const elapsedDays = Math.max(0, Math.floor((curMs - startMs) / 86400000));
const dayNumber = elapsedDays + 1;
const realm = String(getvar('stat_data.主角.修行.境界', { defaults: '' }) || '未引气（凡躯）');
const stageName = dayNumber <= 10 ? '微兆潜龙期' : dayNumber <= 25 ? '古武抬头期' : dayNumber <= 45 ? '龙眼破禁期' : dayNumber <= 90 ? '潜龙秘序期' : '百宗出山期';
_%>
[都市修仙DLC：华夏潜龙与灵气复苏总纲｜开启日：<%= dlcOriginDate %>｜第 <%= dayNumber %> 日（<%= stageName %>）｜主角境界：<%= realm %>]

华夏龙脉与暨阳暗局:
  潜龙归元窍: 暨阳实为华夏南干龙入越沉睡主窍「越中潜龙·归元眼」（北承会稽、东抱老鹰山、南接浦阳江），古镇山大阵敛藏地脉不外泄。
  太微云岫祖庭: 老鹰山深处沉封着昔年浙东名宗「太微云岫宗」祖庭，仅余听风亭、镇风青铜铎、荒径枯井与守灯执事周伯守望。
  阵内避世与老怪出山铁律: 末法外界灵气枯竭，金丹及以上离阵调运会倒耗本源损道基，各宗宿老皆封死阵内减息避世；**第 91 天（灵气复苏数月后）起**外界灵气堪托高阶道基，老怪相继突破出山。
  世家同源线索: 灵潮涌动下杭城、魔都世家与三教名山渐次启封；**暨阳苏家（苏晓樯父祖一脉）实与魔都「苏氏沧溟水府」百年前同源分家，灵气复苏后仍保有那一缕先天仙缘**。

修行总纲与保密准则:
  灵根与保密铁律: 真灵根万中无一，古武止于凡胎强身；官方与隐门严守绝密，永不向公众与校方披露。不预设既有角色谁有或无灵根，全交剧情自然演化。
  公开所见与私下所知: 路人与舆论只见光雾声响并作常态解释；知情者方辨龙脉、修为与宗门，证据不足时只作观察与推测。
  同源并流与开放破境: 古武（锻骨→明劲→暗劲→化劲→先天通玄）与仙途（引气→炼气→筑基→金丹→元婴→化神+）不锁上限，破跨大境须有真实感悟、机缘或劫难代价。

当前日历阶段异象（表层维持现代日常，里世界按 <%= stageName %> 演进）:
<%_ if (dayNumber <= 10) { _%>
  - 第一阶段·微兆潜龙期（第1～10天）：老鹰山夜现数秒低空青白微晕，地磁微跳，旧调频收音机深夜偶掠十秒风铃清音（气象台以逆温静电解释）。极少数感气者于山晨雾间可察清冽灵气，周伯开始暗自审视来客骨相。
<%_ } else if (dayNumber <= 25) { _%>
  - 第二阶段·古武抬头期（第11～25天）：老鹰山听风亭一带具清神微效；旧武传人与吐纳者丹田发热松动，真品古器偶生微光；杭城、魔都世家与名山外院暗调游方耳目与老药。医院少数无病变异象门诊被隐秘系统脱敏归档，大众媒体只字不提。
<%_ } else if (dayNumber <= 45) { _%>
  - 第三阶段·龙眼破禁期（第26～45天）：老鹰山枯井支脉雾霭常聚，雷夜偶见弧光偏折；少数觉醒者私下可展真实异能，杭城夜集坊市开始私下流通灵材符器。国家「特种气象与非典型样本调查组（隐秘特调）」便装秘密摸排接触高天赋者，严禁公开；深探线索者可试叩山腹沉封山门。
<%_ } else if (dayNumber <= 90) { _%>
  - 第四阶段·潜龙秘序期（第46～90天）：99.9% 普通人与校园仍活在纯现代时空；里世界小圈子成形——隐秘特调签密对接，杭城魔都世家与各名山外地散修与隐门真传正式入世行走或递帖拜会暨阳龙眼。
<%_ } else { _%>
  - 第五阶段·百宗出山期（第91天起）：外界游离灵气跨过「出阵不损道基」阈值！各宗门与世家闭死关的金丹老祖、假婴宿老与元婴真君陆续突破瓶口或解封出山重定座次，表层仍守现代法治遮掩。
<%_ } _%>
