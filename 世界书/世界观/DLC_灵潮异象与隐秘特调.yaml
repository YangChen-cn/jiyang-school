<%_ if (getvar('stat_data.剧情.灵气复苏.已开启', { defaults: false }) === true) { _%>
<%_
const dayOf = raw => {
  const m = String(raw || '').match(/^(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})/);
  return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null;
};
const start = dayOf(getvar('stat_data.剧情.灵气复苏.开启日期', { defaults: '' }));
const now = dayOf(getvar('stat_data.世界.日期', { defaults: '' })) ?? start;
const day = start === null ? 1 : Math.max(1, Math.floor((now - start) / 86400000) + 1);
_%>
[灵潮异象与隐秘特调]
<%_ if (day <= 10) { _%>
- 微兆：老鹰山与浦阳江夜间偶见青白微晕，地磁与负氧离子小幅跳变。偶有旧收音机收到短促铎声，或香樟重萌、犬猫朝山低吠。气象与广播以逆温折光、静电解释。老鹰山晨雾中，仅少数有资质或长期站桩者能感到清冽凉意。
<%_ } else if (day <= 25) { _%>
- 古武抬头：听风亭山雾有清神微效，少数旧武传人与吐纳者觉丹田发热、旧伤松动，深山老药和古观真器偶见灵光。特调系统私下标记少数无器质病变的手热、夜视异常记录，脱敏归档。
<%_ } else if (day <= 45) { _%>
- 龙眼破禁：后山枯井雾霭久聚，雷弧偶绕峰。少数真灵根觉醒者或深厚古武者可在隐蔽处御风借力、劲透枯木或内息疗伤；借龙潮或门中印诀可叩开祖庭。
<%_ } else { _%>
- 潜龙秘序：外地散修和隐门试探暨阳潜龙眼；受邀签密的少数觉醒者开始与特调私下对接珍药及任务。
<%_ } _%>
- 特种气象与非典型样本调查组仅便装、单线核验显露真灵根或极高天赋的个体。接触须有已见异常，学校、媒体与普通市民沿用表层解释。
<%_ } _%>
