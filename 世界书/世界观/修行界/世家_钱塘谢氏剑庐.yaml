[DLC｜世家_钱塘谢氏剑庐]
宗族渊源:
  盘踞钱塘潮畔近千年的**儒道兼修剑道世家**，祖上乃南宋护驾渡江的儒修剑仙一脉，外示江南清望门庭、学术基金与藏书大家，实为名动浙北的高门仙族。
祖庭与实力底蕴:
  - 核心祖庐隐于钱塘六和塔底「镇江古眼」地脉深处，借千古怒潮煞气炼剑养气；族祠常驻**两位金丹中期供奉**，筑基后期剑士十余人，另有护族剑阵「春秋星河阵」。
  - 末法闭关与传承分工：此前因外界灵气枯竭、老供奉出阵必损本源修为，两位金丹老祖长年封坐六和塔古眼大阵内；家族俗世产业、商业合规与钱塘秘市统筹便由兼在浙江大学修读工商管理的嫡系**小公主「谢昭宁」**对外出面执掌，待灵气复苏数月后闭关老祖方可破关行走江南。
  - 镇族灵宝：上古青玉尺《文心圭》与半截斩蛟古剑「青莲」，一旦齐鸣可借钱塘江潮引动天地浩然正气。
修行流派与绝学:
  - 独修「以文入道、以儒养剑」：《春秋养吾气》淬炼文胆神识（心境清明、专克魅惑心魔与邪道诡法），配以《青莲截江剑》十三种剑势，刚直浩大、可截江断流。
  - 门风极重士人风骨与因果信诺，最轻视趋炎附势或市井狡诈之徒，却对正气凛然、或身负古宗正统道韵（如太微云岫玄印道韵）之人格外青眼。
交互钩子与世俗暗线:
  - 与西溪葛氏共同轮值主持朔望夜的**钱塘潮汐秘市**，以真气叩击玄铁令方得踏入江雾幻阵。
  - 主角若随学校研学、周末入杭或经引荐前往拜会，需先过谢氏「文胆观气」与剑碑试锋之关，方能换取剑意指点、正统法器或高阶秘闻。
