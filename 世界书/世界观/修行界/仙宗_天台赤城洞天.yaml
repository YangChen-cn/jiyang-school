[DLC｜仙宗_天台赤城洞天]
宗门渊源:
  位列华夏道教「三十六小洞天之第六洞天」的浙东祖庭级大宗，与天台山国清寺佛脉千年同山而治，亦与老鹰山**太微云岫宗**、四明山**赤水剑宗**并称昔日「浙东古宗三壁」。
实力底蕴与镇山重器:
  - 护山古阵深处坐落真实灵气洞天，历代借地脉养真；宗门内不仅金丹长老数名，更传**宗主早已证得实打实的「元婴期真君」**，闭关洞府之内寿逾六百载，乃是浙东真正意义上的擎天巨擘。
  - 镇宗之宝：「赤城紫阳玉印」与《太清司命真经》，道佛合流之下更兼修护神大定。
修行流派与绝学:
  - 主修道门上古「司命太清真法」，炼气凝丹醇厚浩大，兼取天台佛脉止观炼神之长，道心极为稳固。
与太微云岫宗及云清晏之旧缘:
  - 数百年前云岫宗尚未末法封山时，两宗曾立守望盟约；云清晏幼年尚随先代师长赴天台参阵论道。
  - 末法期间赤城元婴真君一直于第六洞天大阵内减息死关避世；**灵气复苏数月后阵外灵机重足**，赤城洞天先遣真传探问归元眼，宗门老怪亦正蓄势突破出山——究竟是重续古盟护持故人，还是起并脉之心，全凭实力与因果博弈。
