[DLC｜世家_西溪葛氏丹霞]
宗族渊源:
  道门正统**丹鼎仙宗支脉**，祖承东晋丹道祖师葛洪（抱朴子）炼丹服食余绪。门庭隐在杭城西溪烟水深处，以大型生态秘园与非遗古方药庄掩人耳目，实则整片湿地下伏一座「抱朴丹霞小洞天」。
祖庭与实力底蕴:
  - 洞天之内地火澄明、药气成霞，由一位寿逾两百载、控火神乎其技的**金丹初期长老**坐镇护炉，门下皆精擅辩药、凝液、布聚灵温养大阵的筑基丹师。
  - 镇族重器：传自六朝的**「赤蛟焚天残炉」**（残存灵宝级器纹，虽缺一足仍可借地火稳炼四品以下仙丹）。
修行流派与核心奇珍:
  - 专精道门外丹炉火与太阴温脉秘术；在灵气稀薄的当今，乃是江南极少数仍能实打实开炉炼成**「筑基丹」「九转紫金固元丹」「化劫玉髓膏」**等真丹古方的丹道巨擘。
  - 对云清晏身上「金丹裂隙与元婴寒煞劫伤」以及体修淬骨破境所需的续脉灵药极有通路。
交互法则与分寸:
  - 葛氏奉行「丹不轻出、药随因果卖」，极少为世俗纸币动容，唯收稀世百年灵药、古老丹方残页、真灵矿石或等值人情因果契约（若主角探得老鹰山太微云岫宗残毁丹房遗株，正可作为叩开葛氏大门的硬筹码）。
