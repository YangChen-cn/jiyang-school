[DLC｜仙宗_南屏法华禅院]
宗门渊源:
  杭城南屏古刹深后禁地之中，与前端喧闹香客彻底隔绝的**佛门天台宗止观苦禅一脉**，传承可溯至隋唐智者大师天台三大部真传，非寻常佛寺僧众，而是专修元神与大定的隐世佛宗。
实力底蕴与护院法器:
  - 院内仅存七位苦行老僧，皆守百余年闭口禅，修为深不可测——**领首枯禅高僧神魂凝练已臻金丹大圆满之境**，一口梵音禅唱可定百丈风涛。
  - 镇院圣物：「无垢琉璃舍利塔」残座与一串沉水千年菩提子，常驻静室则妄念不生、阴寒外魔不得近身。
修行流派与绝学:
  - 修习《法华摩诃止观》《金刚狮子吼》与「定心破妄禅」，不涉世俗争霸与外财争夺，却拥有神州罕见的**「天眼照魔」**与镇压神魂反噬之力。
交互价值:
  - 道门突破结丹、元婴等大关最凶险者便是「天道问心劫与心魔反噬」。云清晏当年冲关结丹时恰败于问心一关，若日后寒煞引动心神动摇，南屏枯禅乃江南少数能为其稳住识海、印证大道禅心的净土，然佛门讲缘法与舍得，绝不白渡无缘人。
