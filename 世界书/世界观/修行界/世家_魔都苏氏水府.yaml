[DLC｜世家_魔都苏氏水府]
宗族渊源与骇人底蕴:
  魔都乃至全江南隐世修仙世家之巅，先祖乃上古得道海上水剑散仙。外显产业横跨沪上远洋航运、高新资本与外滩老楼，真核心却深藏于东海近海孤屿与浦江海底灵窍相连的**「沧溟水府」洞天**。
  - **实力标尺**：族祠深处常驻**两尊金丹巅峰太上供奉，更有传闻半只脚踏入元婴期、长年闭死关续命的太上老祖**镇压气运；嫡系子弟多具高阶水灵根或太阴剑骨，筑基如林。
  - **道统绝学**：主修道门玄水剑道最高典籍《紫府观潮诀》与《沧溟七杀剑》，仗海潮增幅可越阶攻伐；镇族上品法宝为**「潮汐分海佩」**，引之可分江断海、镇压一方水脉灵眼。

暨阳苏家同源之秘（百年前分家 × 保有先天仙缘）:
  - **分枝源流**：约百年前天地灵气枯竭渐深、海外杀劫骤起，魔都苏氏为留存俗世香火退路，令一房旁系族人携半枚旧水玉符悄然迁至浙中越地暨阳山下湖一带扎根（即苏晚棠父亲苏建国一脉的先祖）。
  - **尘俗隐迹**：几代下来末法无灵，暨阳苏家彻底转入凡俗商海，凭水乡珍珠产业发家，苏建国、周丽萍与苏晚棠这一代早已不知先祖曾御剑踏海、分江斩蛟，只当祖上曾是江南老字号名门（注：「澹珠记」淡水珍珠生意纯属凡俗商业，与苏氏玄水修真毫无关联，严禁牵强捆绑）。
  - **灵气复苏与保有仙缘**：血脉根骨并未随分家断绝，暨阳苏家后人骨血中仍隐流着那一缕**先天太阴水脉仙缘**。随着灵气复苏与「越中潜龙·归元眼」震动，魔都苏氏本家祭动**「沧溟祖谱血鉴」**，已隐约照见越中暨阳支脉微光。
  - **自由剧情张力（不预锁结局）**：在未触发本家接触前，苏晚棠仍是明艳骄傲、专注「澹珠记」与校园日常的大小姐；一旦灵潮步入中后期或本家金丹执事/嫡系俊彦入暨阳核验支脉，究竟是本家强势收归（甚至借宗法联姻筹码试探）、收归水府培养，还是苏晚棠凭自己「不认旁人摆布」的脾性、与主角共同周旋破局，全由玩家与剧情自由演绎。
