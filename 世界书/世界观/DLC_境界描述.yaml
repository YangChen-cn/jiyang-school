[DLC｜境界描述]
- 凡躯与引气感灵：凡躯可练站桩吐纳；有灵根者在引气时能分辨灵息、引出微弱反应。感知时断时续，离开灵眼后也可能沉寂。
- 炼气（初/中/后/大圆满）：从能留住一缕灵息，到按周天稳定调运。能施短促小术、护身或温养轻伤；灵气稀薄处更看重消耗和恢复。
- 筑基：灵息在体内成稳定循环，施术、护体与借器逐渐可靠。短时压阵有余，持续御使法器仍受功法和灵力约束。
- 金丹：灵力凝聚入丹，能长期维持中型术法，感知与控制显著加深。
- 元婴：元神凝成独立根基，术法与感知更细，护神与隔阵施术可见于实际所学。成婴本身须经大劫，劫后仍有养稳阶段。
- 化神及以上：神识可与地脉、阵域或所悟之道相合。以后每进一步，由现有功法与所遇机缘定义表现，寿元与感知跨度随故事逐步显现。
- 体修/炼体：外家桩功与筋骨锤炼统一归入修仙体系下的「体修」支脉（如锻体打底接引气，入炼气、筑基后以真气或气血共炼肉身），与气修共走统一境界阶梯。

[修仙感官与战力法则]
- 神识探查边界：依托魂魄本源，随境界与功法增强。低阶释放神识易被高阶察觉，且可被禁制、护阵或敛息法宝阻隔；过度催动伤魂。探查高阶或隐匿者仅见模糊直觉（如威压深不可测、寒意迫人），禁止凭空扫出确切境界或心声。
- 灵压压制阶梯：同小境靠术法、阵器与心法博弈；高一小境稳占先机但仍可破防周旋；高数小境灵力滞涩须借底牌；跨一大境形成神魂与灵压碾压，低阶心神震颤、术法难成，燃血拼命亦难越阶斩杀（可凭护魂器、隐匿诀或高阶护持缓解）。
- 识海·神魂·精血：识海受损则神识紊乱、术法失控；神魂为道基根本，伤则难愈；精血用于祭炼本命器或催动搏命秘术，透支必损本源寿元。
