[DLC｜华夏修行界、三教道统与隐世宗门世家]
道统流派与实力格局（立意高古，绝非江湖把戏）:
  三教并流与仙道诸途: 华夏修行界历经千载兴替，核心分「道、佛、儒」三教正统与上古杂流——
    - 道门诸脉：分重内丹性命双修的「全真清修脉」、擅请神敕令与天心五雷的「正一符箓脉」、炼天地宝药与外丹炉火的「丹鼎仙宗」，以及合水火阴阳之变的「玄门剑道/太极脉」。
    - 佛门禅密：重「明心见性」「止观定神」与密宗护法金刚相，不以争雄显名，却最擅稳固元神、消弭心魔，连道门金丹破境遇心魔劫时亦须敬重几分。
    - 儒道文脉（江南书院剑骨）：承理学浩然正气与「以文载道」，文胆既凝则落笔成宪、口含风雷，专克诡谲邪祟；配君子佩剑可出百步无形剑气。
  隐世实力标尺: 末法百年仅消耗了外层灵气，真正底蕴千载的名山古宗与高门世家凭「祖庭聚灵洞天、残存龙脉灵眼、先祖真君遗蜕所蕴灵粹」苦撑香火，实力远超世俗想象：
    - 三流小族/外门别院：至少有「筑基中后期」执事坐镇，符剑齐出可敌现代重火力小队而不留痕。
    - 顶尖隐世世家（如魔都苏氏、钱塘谢氏等）：祖祠常驻「假丹」至「金丹真修」坐镇，手握传世灵宝与护族大阵；核心嫡系骨子里流着百年道统骄傲，外显凡俗身份不过遮眼法。
    - 名山隐世仙宗洞天：护山大阵之内另成洞天灵境，灵机十倍于外；宗内往往藏有**数位金丹大成太上长老、乃至借洞天沉眠续命的「元婴真君 / 半步化神宿老」**！一宗出世，足以震动一省暗界。

杭城·钱塘真修大族（江南三教正宗所聚，气象森严）:
  钱塘谢氏（儒道兼修 · 青莲剑脉）: 盘踞钱塘潮畔千年、曾护南渡文脉的儒修剑道世家。族人修《春秋养吾气》配「青莲截江剑」，文胆一震则邪妄辟易，出剑自有千军辟易之浩然剑势。祖庭深藏六和塔底古江眼，供奉**两位金丹中期供奉**；绝不屑沾染市井俗利，唯敬重气节端方、身负真道骨之人。
  西溪葛氏（道门丹鼎 · 抱朴丹霞别院）: 东晋葛洪（葛仙翁）一脉嫡系余绪，隐于西溪雾障深处的「丹霞小洞天」。掌控真正失传已久的**「筑基丹」「九转紫金固元丹」「化劫玉髓膏」**古方与上古「赤蛟焚天残炉」，执事长老已臻**金丹初期**，是少数能实打实炼成高阶仙丹以解金丹裂伤的丹道巨擘——求丹极难，非大因果或稀世灵萃不开炉。
  南屏法华院暗阁（佛门天台止观古脉）: 隐于南屏古刹禁地的苦禅一脉，与红尘香火彻底隔绝，主修「琉璃止观」「天眼破妄」与镇压心魔劫的禅宗大定，院内枯禅老僧神魂堪比**金丹圆满**。
  钱塘潮汐秘市: 每逢大潮之夜以「颠倒八卦阵」在江上雾障开辟幻界渡口，由谢、葛二族金丹使者轮值压阵；流通的皆是灵石精粹、真修功法残卷、二三阶法剑与高阶灵材。

魔都·沪上巨室与【苏氏同源秘史】:
  魔都苏氏（东海沧溟水府 · 剑水大族）: 名列江南隐世世家之巅，祖上乃得道海上水剑散仙。外显门庭遍布魔都金融海运，真核心却藏于东海近海孤屿与浦江海底灵窍连通的「沧溟水府」洞天。族内镇守**两尊金丹巅峰太上供奉与传闻已触及元婴门槛的闭关老祖**，掌镇族法宝「潮汐分海佩」，一手《紫府观潮诀》与《沧溟七杀剑》威震东海。
  暨阳苏家同源之秘（百年分家 · 保有仙缘）:
    - 约百年前末法大寒、天地灵机枯竭，魔都苏氏为分担海上杀劫并留存世俗退路，令一支旁系族人携半枚旧玉符悄然迁至越地暨阳山下湖一带扎根（即今日苏晓樯父祖一脉）。
    - 百年下来，暨阳苏家彻底归于凡俗，靠淡水珍珠与实业立身，苏建国、周丽萍与苏晓樯这一代早已不知先祖竟是御剑踏海的修仙大族，只当作普通富商门第过活。
    - 然而**暨阳支脉血统未断，灵气复苏后仍保有那一缕先天水脉仙缘**。随着灵潮抬升与暨阳潜龙归元眼震动，魔都苏氏本家「沧溟祖谱血鉴」已隐约照见越中支脉微光——日后无论是本家遣强人入暨阳查验接引、以联姻/宗法施压收归仙缘，还是苏晓樯凭骄傲本性自己闯出一片天地，皆为暗线伏笔（未触及前她仍是纯粹的现代大小姐）。
  申城天星钟氏 & 崇明归墟海坛: 钟氏承道门太乙星算与奇门空间阵脉（筑基成群、金丹压阵），主导沪上最高规格的秘境物换；崇明东滩「归墟海坛」则是东海海外散仙、蓬莱外使与内陆修行界接壤的潮汐门户，常有金丹后期乃至假婴老修踏浪现身。

华夏名山·隐世仙宗次第出世:
  浙东三壁（最先与老鹰山归元眼产生气机呼应）:
    - 天台山·赤城洞天 & 国清禅脉: 道门第六洞天，主太清道法兼佛门大定，洞天深处坐镇**元婴真君**。数百年前曾与老鹰山「太微云岫宗」同列浙东三壁，云清晏幼年曾随先代长辈赴天台论剑。
    - 四明山·赤水剑宗: 极致孤高的纯粹剑修仙门，山门隐在绝壁云瀑之后；门下筑基便能剑气御空，金丹剑尊傲视江南，曾视云岫宗剑意为一世劲敌。
    - 天目山·灵虚宫: 道门净明宗重镇，较早与国家特调订立密约，协理江南里世界秩序。
  神州诸岳洞天大宗（随灵潮中后期次第启封入世）:
    - 茅山（上清符箓坛）& 龙虎山（正一天师祖庭）: 道门神霄雷法、太清秘箓与捉鬼镇煞至高祖庭，山中天师法坛留有跨越数百年不朽的**元婴老天师与上古法印**，灵潮起后最先遣真传携紫金八卦巡查九州龙脉。
    - 终南山（全真楼观祖庭）& 青城山（丈人炼神洞天）: 一为全真内丹鼻祖，深山古洞中多有枯坐两三百载的隐修宿老；一主青城炼神法相与外丹仙酿，神识攻防冠绝西南。
    - 武当山（紫霄太极仙脉）: 「武道通神、终返先天太极」，外门筑就天下化劲/先天武道宗师，紫霄绝顶真传则修阴阳金丹、可掌御水火两仪。
    - 昆仑祖脉 & 东海蓬莱三仙岛: 神州万山之祖与海外三神山，传闻尚有触摸**「化神境」**的太古仙尊沉眠闭关；非天地大潮极盛或震世之劫绝不现世。

里世界铁律与渐进出世:
  隐秘特调协防: 国家「特种气象与非典型样本调查组（隐秘特调）」手持现代重器与宗门密约，协同名山正统守住「不伤凡人、不于俗世显圣、不毁现代法治」三条铁律；违戒者由特调客卿与巡山金丹联合格杀勿论。
  出世节奏: 启封第 1～25 天唯少数游方真传、世家耳目与云清晏这般隐修者踏足红尘；第 26 天龙眼破禁后，杭城潮汐秘市、魔都世家招揽（含苏氏本家视线）及各山外使渐频繁照面；第 46 天潜龙秘序期起，名山使者与隐世嫡传可赴暨阳递帖论道、试探归元眼，但于普通市民师生眼前仍只作商界名流、名校交换生或访山香客。
