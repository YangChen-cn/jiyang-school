[DLC｜华夏修行界与隐世宗门世家]
格局总览:
  表里双轨: 灵气复苏仅在里世界暗涌，表层永远维持现代法治与都市烟火；华夏修行界由「隐世修仙世家」「名山隐世仙宗」「散修坊市」与「国家隐秘特调」四方构成。随灵潮抬升与暨阳「越中潜龙·归元眼」松动，原本各自封门蛰伏的古老势力正借现代高铁航线与加密渠道重连脉络、试探地脉并争夺新生灵机。

杭城·钱塘隐世世家与夜集（高铁半小时可达）:
  钱塘风貌: 承吴越余脉与西湖灵秀，杭城世家不喜张扬，多以中医世家、书画古玩馆、茶山别业或文博基金掩护身份，隐于九溪烟树、西溪芦荡与北高峰僻静山庄。
  钱塘顾氏（青囊丹药脉）: 祖承吴越御医与丹鼎支流，掌握珍稀百年老药、温脉灵材与正统固本汤剂渠道。对金丹裂隙、寒煞内伤所需之药极为熟稔，却奉行「药随因果与筹码卖」，绝不白送人情。
  孤山沈墨 / 南屏弈剑斋: 表为西湖金石字画修复世家与私房琴社，实修书画入道与藏锋剑意，暗中收鉴流落江南民间的古修残器与玉简拓片。
  龙井隐市（杭城夜集）: 每逢朔望于西湖群山深处或老茶仓轮流落座，须持世家/宗门信物或真气感灵印记方准入场，是浙北散修与世家交换低阶丹药、护身符箓与里世界消息的近便坊市。

魔都·沪上隐世世家与跨海暗流:
  沪上风貌: 长江尾闾与东海灵潮交汇之地，将现代资本、金融股权、精密检测与百年阵法结合；老洋房地下石库门密室、陆家嘴顶层私人会所与崇明东滩芦洲古坛并行不悖。
  沪上陆氏 / 申城沈氏（海舶奇珍脉）: 脱胎于明清海上巨贾与东海散仙支脉，掌控跨海灵玉、深海寒髓、海外异果冷链及全球异闻网，族中尚供奉驻颜老筑基乃至闭关不出之秘传金丹客卿。
  静安古钟阁（魔都夜场私洽）: 以私人艺术基金与封闭拍卖为壳的顶级里世界交易圈，偶有前朝古修遗蜕法宝、残缺阵盘与古宗功法残章私下竞价，水极深且只认实力、来历与等价异宝。
  崇明归墟坛: 东海大潮前哨，灵潮较内陆早半拍涌动，已有海外归真修士、东海散脉借商旅考察之名暗渡试探。

华夏名山·隐世仙宗次第浮出水面:
  浙东近山（最先感应老鹰山归元眼异动）:
    - 天目灵虚观 / 浙西道盟: 香火与实修并存，较早与国家特调订立秘约，负责维护江南散修秩序与遮掩灵异痕迹。
    - 四明赤水剑庐 & 天台国清古脉: 一主刚猛古剑、一主禅定炼神与百草灵丹；数百年前曾与老鹰山「太微云岫宗」共列浙东古宗三壁。当年大封山后音讯断绝，如今山门阵纹松动，故旧重探或暗窥祖庭者渐多。
  神州名山祖庭（随灵潮中后期递进现世）:
    - 江南茅山（太清符箓宗）与赣北龙虎山（正一天师祖庭）: 精擅镇煞驱邪、补阵画符与地脉勘验，灵气复苏后最先派出真传弟子携古器暗访各处破禁龙眼。
    - 秦岭终南（全真隐修古洞）、巴蜀青城（炼神丹鼎脉）、鄂西武当（太极内家通玄祖庭）: 外院曾流传诸多古武暗劲、化劲宗师支脉；内门深藏未绝传承，宗门深处仍存元婴乃至化神境界的避世宿老坐镇护山洞天。
    - 昆仑西域与东海蓬莱: 太古大脉与海外三岛，唯天地灵潮大盛或惊世大劫方现真容，平时仅见于古宗秘录。

里世界秩序与出世节奏:
  隐秘铁律: 国家「特种气象与非典型样本调查组（隐秘特调）」与名山正宗共守三律——不伤及无辜凡人、不在公众前显圣破戒、不颠覆世俗法治；违者由特调客卿与名山巡使联合清剿。
  渐进现世: 启封第 1～25 天外地世家与名山仅派游医、古玩买手或年轻弟子（如云清晏）隐名摸排；第 26 天龙眼破禁后，杭城隐市、魔都私洽与各山真传开始频繁照面；第 46 天潜龙秘序期起，外宗使者与世家子弟可现身暨阳站、老城茶馆或老鹰山脚递帖论道，但面对普通师生与路人永远只作访客、驴友或客商处理。
  自由周旋: 各宗各族皆有自家门户算计、道统骄傲与利益权衡；主角可凭云岫传承、潜龙气机、古武根基或世俗人脉前往杭城、魔都、名山访道交易，亦可在暨阳坐镇周旋各方。
