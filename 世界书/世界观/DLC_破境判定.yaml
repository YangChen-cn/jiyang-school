[DLC｜破境判定]
- 以当事人实际冲关为触发。交谈、查典籍、预作准备时只交代眼前条件。判断依据：当前境界与积累、相关功法或感悟、场地与可用灵材、当前伤势和护法。
- 小境按已练熟的能力与实际调息推进；跨大境须把具体感悟、机缘或劫难代价写进正文。时机和境界上限由剧情打开，当前灵气感应只作积累证据之一。
- 资质与体质联动：单系与契合灵根在对应灵脉或功法下蓄气更快；杂灵根破大境需更足灵材与打磨；无灵根体修凭筋骨极限、外药淬体与拳意叩关，不强制套用气修引气模板。通灵或偏性灵体破关时感应易骤涨（需防灵力走偏），先天道体稳境与抵御问心阻滞占优。
- 条件不足时可停功、退回养伤或等待下一次机会；硬撑的损耗随实际过程体现。暂稳只算站住关口，突破成立才记录新境。
- 主角成功后同轮更新「主角.修行.境界」；跨大境时按新境初阶回落灵气感应，实际习得的法门才写入功法与秘术。失败保留原境，按已发生的后果结算。
