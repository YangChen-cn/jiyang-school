区域: 暨阳中学校内
场景列表:
  - 名称: 校园定位
    特征:
      - 老城名校，校门、围墙和部分老楼有百年学校的厚重感，新教学楼和智慧校园设备又很新
      - 校内能感到浣江/浦阳江水汽，梅雨季走廊地面发潮，冬天教室冷到学生抱热水杯
      - 校园不大到迷路，但动线很紧：教学楼、实验楼、图书馆、操场、食堂之间每天重复往返
  - 名称: 高二重点班教室
    位置: 教学楼四层最东边
    特征:
      - 前两排是尖子生的领地，举手回答问题的永远那几个人
      - 后排靠窗是苏晓樯的座位，桌斗里零食比书多
      - 最后一排角落的课桌总空着一半，沈幼楚低头缩在那里
      - 黑板一角每天更新高考倒计时，没人看但也没人擦
      - 智慧黑板旁还留着粉笔黑板，自习课安静到能听见空调出风和翻卷子的声音
  - 名称: 操场
    特征:
      - 四百米塑胶跑道，晨跑六圈后点名
      - 篮球场午休时段靠抢，吴臻臻总能提前占到
      - 升旗仪式周一早上七点半，迟到罚站在队伍最后
  - 名称: 图书馆
    位置: 校园东南角老楼改造馆
    特征:
      - 一楼电子阅览和自习区，二楼开架借阅，三楼旧书库平时不对外开放
      - 文学社占用二楼靠窗长桌作为固定活动点
      - 午休时温书语常在三楼旧书库偷看闲书
      - 空气里有旧纸、空调和消毒水混在一起的味道
  - 名称: 天台
    特征:
      - 铁门常年锁着，但门锁被历届学生换过无数次
      - 视野开阔，能看到浣江/浦阳江水面和老城屋顶
      - 逃课、抽烟、告白、大哭——学生们默认的"解决不了就去天台"
  - 名称: 食堂
    特征:
      - 两层，一层普通窗口二层小炒，价格差三倍
      - 中午十二点十五下课铃一响，跑得慢排长队
      - 校园卡和刷脸支付并行，没带卡的人会临时借同桌手机小程序
      - 苏晓樯从不吃食堂，让家里司机送或把外卖约到校门口街角
  - 名称: 小花园
    位置: 教学楼和实验楼之间
    特征:
      - 一条鹅卵石路，两侧是香樟和桂花树
      - 长椅三张，晚自习前情侣出没
      - 十月桂花开了整条走廊都闻得到
  - 名称: 实验楼
    特征:
      - 四楼物理实验室隔壁的自习室，竞赛组专用
      - 白板上永远有没擦干净的公式
      - 凌知夏靠窗第二个座位，桌上竞赛题集比人高
  - 名称: 行政楼校长室
    位置: 行政楼一层走廊尽头
    特征:
      - 深棕色实木门，磨砂玻璃上印着"校长办公室"，门关上后走廊里几乎听不到里面的声音
      - 室内陈设简洁克制：红木办公桌、落地钟、一面墙的文件柜、待客用的皮质沙发
      - 窗户对着操场方向，窗帘常年半拉着，下午西晒时整间屋子泡在暖黄色的光里
      - 办公桌最底层抽屉带锁——里面没有重要文件
