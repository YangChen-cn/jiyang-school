校园活动节点:
  定位: 阶段性校园主线，提前铺垫，触发时作为中等强度事件池
  时间安排:
    国庆假期: 2020/10/01-07，第一次校外长时间相处的机会
    体育周: 2020年10月中下旬，核心是班级篮球对抗赛
    期中考试: 2020年11月上旬，高二第一次大考，分班后首次正式排名
    远足: 2020年11月中下旬，地点优先老鹰山
    艺术周: 2020年12月，核心是十佳歌手和文艺汇演
    寒假: 2021年1月底开始，约三周，空间从学校转移到家庭和生活圈
    春节: 2021年2月12日（正月初一），在寒假内，人际关系最密集的节点

  国庆假期:
    定位: 开学一个月后，第一次"校外长时间相处"的机会。不像体育周被班级框架限定——国庆是自由的。谁约<user>、<user>约谁、谁都没约——每一个选择都产生社交信号
    铺垫:
      - 放假前最后一节课，吴臻臻在班群里发"国庆谁留在暨阳"，看似统计实为刺探
      - 苏晓樯随口提"国庆去杭州买衣服"，说者可能无心但听者会记住
      - 沈幼楚假期要加排班——意味着她需要钱而不是休息，但不会主动说原因
      - 慕佳芊要回杭州看大学同学，在办公室聊天时被路过的学生听见
      - 凌知夏报了一个线上竞赛集训，国庆全部排满——但她没告诉任何人
    事件池:
      - 短途出游: 杭州西湖、上海外滩、绍兴古城——目的地不如"跟谁去"重要。同游意味着长时间独处、旅途中的互相照顾、回校后被看见的同行痕迹
      - 留在暨阳: 老城探店、万风看电影、浣江夜走。假期的小城节奏慢，容易产生"别人都走了只剩我们"的亲密感
      - 朋友圈暗战: 陈芷汀若未被约，发一组精心构图的"假期快乐"——每张照片都在说"我很贵"；苏晓樯若被约了会晒合照，若没被约会晒购物战利品；温书语不发自拍但会发一本正在读的书和一杯茶的位置
      - 假期后余波: 谁和谁出现在同一张照片里、谁的定位在同一座城市——班群里起哄、吴臻臻记住并在之后的场合"不经意"提起
    注意:
      - 国庆出游需要合理的由头（竞赛培训、看展、家里在杭州有房等），不能是"就我们两个去旅游"——太直白不符合高中生关系初期的试探感
      - 若<user>没约任何人也没被约，不强制——但假期后班里聊"我国庆去了哪"时，<user>的回答或沉默仍是一步棋
      - 假期结束后距体育周只剩两周，出游时建立的关系将直接影响体育周"谁给你加油"

  体育周:
    铺垫:
      - 班会通知篮球对抗赛，吴臻臻登记队员、后勤、计分和宣传
      - 苏晓樯嫌班里没人有斗志，嘴上嫌弃但会盯着报名表
      - 凌知夏把赛程、体能、对手班级数据整理成表
    事件池:
      - 班级篮球对抗赛: <user>可上场、替补、计分、送水或被临时拉去救场
      - 啦啦队后勤: 递水、毛巾、创可贴、拍照，容易产生被看见的偏爱
      - 受伤处理: 擦伤、扭脚、手指戳伤，只写校园运动伤，不夸张
      - 班级荣誉: 输赢都会带来班级情绪，吴臻臻和苏晓樯反应最明显
      - 赛后庆功: KFC、正新鸡排或青悦城，座位选择和谁坐旁边会产生余波
      
  期中考试:
    定位: 高二第一次大考，分班后首次正式排名。学术压力是天然的剧情催化剂——需要补习的人、提供补习的人、排名变化带来的关系位移
    铺垫:
      - 10月底各科老师开始提"这次期中计入平时成绩"，课代表在黑板上写倒计时
      - 凌知夏的笔记被全班传借，她在扉页贴了张借阅登记表
      - 沈幼楚若成绩下滑可能面临助学金审核——但她不求助，只会在晚自习后多留半小时
      - 温书语在图书馆的时间变长，桌上同时摊着课本和她自己的书——两者之间的选择她自己也没做
      - 慕佳芊宣布英语考试范围，课后单独叫<user>"关心一下"
    事件池:
      - 补习配对: 谁主动教<user>、<user>主动教谁。凌知夏开"小型讲题会"但只让特定几个人来——座位安排本身就是社交信号
      - 考前压力: 沈幼楚考场前手抖、反复检查笔和准考证。<user>若给出不起眼的安抚——一句话、一个眼神——信任度大幅提升。苏晓樯考前嘴上说"随便考考"但考前夜在朋友圈发了一条又删
      - 排名公布: 年级大榜贴在一楼大厅，所有人围着看。谁进步谁退步、谁在意谁的名次——榜单前的人潮是最自然的多人同场场景
      - 父母反应: 成绩单一出，不同家庭的反应天差地别。苏晓樯父亲打来电话"钱够不够花"——没问成绩；沈幼楚祖母看不懂排名单只问"有没有饿着"；凌知夏父母发来一张更难的竞赛报名表
    注意:
      - 期中考试在体育周之后——体育周的"被选择/被冷落"情绪会渗透进补习配对和考前状态
      - 排名的社交影响不亚于成绩本身：谁进步了谁退步了、谁和谁的名次挨在一起——这些数字在高中生眼里是人情账本

  远足:
    铺垫:
      - 慕佳芊宣布远足纪律和分组，地点指向老鹰山
      - 老鹰山仙人异象只作为传闻和学生谈资，不确认超自然事实
      - 沈幼楚会提前担心费用、装备和是否拖累别人
    事件池:
      - 路线分组: 谁和<user>同组，谁被分到别组，是天然选择压力
      - 补给分配: 水、创可贴、雨衣、午饭，适合写细小照顾
      - 掉队照顾: 有人走慢、鞋磨脚、体力不支，给<user>选择陪谁的机会
      - 山路天气: 起雾、小雨、风变冷，不写危险灾难，只制造靠近和照应
      - 返程座位: 大巴上谁坐旁边、谁装睡、谁发消息，处理远足余波

  艺术周:
    铺垫:
      - 十佳歌手报名表贴到公告栏，文艺汇演节目开始征集
      - 温书语可参与主持词、朗诵或幕后文案；陈芷汀会注意舞台和服装
      - 慕佳芊负责班级节目协调，必须维持教师身份
    事件池:
      - 十佳歌手报名: 谁被起哄报名，谁推<user>上去，谁在旁边观察
      - 排练: 教室、音乐教室、礼堂后台，容易出现单独相处和误会
      - 服装伴奏选择: 青悦城、万风新天地可作为采购地点
      - 文艺汇演: 舞台灯光、座位、候场、掌声和失误后的救场
      - 后台偶遇: 陈芷汀、温书语、苏晓樯可用不同方式制造短暂独处

  寒假:
    定位: 约三周假期，空间从学校彻底转移到各自的家庭和生活圈。"同班"关系暂时解除——想见面必须主动邀约。这是检验关系深度的天然标尺：谁会主动联系、谁会消失、谁在假期里变了
    铺垫:
      - 各角色收拾东西离开教室的方式：苏晓樯司机在校门外等、沈幼楚一个人拎着包走浣江方向
      - 教室清空那天最安静。黑板上还有人留着元旦倒计时的粉笔字——新的年份已经到了，旧的东西还没擦掉
    事件池:
      - 主动邀约: 假期里谁先发消息、谁约<user>出来、约去哪里。不再是"课间偶遇"——寒假里的每一次见面都是故意的，没有借口可用
      - 线上互动: 深夜微信、朋友圈点赞评论、班群玩笑——线上互动比在学校更赤裸，因为没有"刚好碰到"可以当说辞。陈芷汀凌晨发的自拍、温书语深夜分享的书摘链接——每一条都有观众
      - 寒假聚会: 吴臻臻组织的聚会，来不来、坐谁旁边、谁提前走——全是信号。聚会是寒假里唯一一次多人同场的机会，之前的线上互动和之后的线下反应都聚在这一场
      - 家庭景观: 若<user>被邀请去某个角色家里，她的家庭环境就是她性格的说明书。苏晓樯空荡荡的别墅客厅、沈幼楚老城小屋里的中药味和祖母的收音机、温书语满墙的书架和窗边一把旧藤椅——每一个家都是一本没写完的自传
      - 年前采购: 春节前置办新衣服和年货，青悦城/万风/杭州商场成为假期偶遇地点。苏晓樯逛奢侈品专柜、陈芷汀试衣服时对着镜子自拍、沈幼楚在超市散装糖果区反复比价
    注意:
      - 寒假时间跨越大——1月底到2月中，不要每一轮都写"假期第N天"。用关键节点推进：放假当天→第一周→年前采购→除夕→正月→开学前夕
      - <user>若在假期始终保持被动，假期会自然过去——但开学后会发现某些关系的温度变了：没联系的人淡了，主动联系的人近了

  活动边界:
    - 不在2020/09/01开局直接触发所有活动，只能通过班会、公告、传闻做轻铺垫
    - 活动不是固定剧情，<user>可以参加、旁观、拒绝或临时被卷入
    - 每个活动至少保留一个班级公共目标和一个私人情绪余波
    - 国庆假期和寒假是"校外自由期"，触发以角色邀约和<user>选择为主，不替<user>决定出游对象或聚会参与
    - 期中考试是"学术压力期"，考试本身是公共事件，但补习配对和成绩单反应是个人的
    - 春节是"家庭暴露期"，角色的家庭背景差异自动浮出水面，不需要额外制造剧情
