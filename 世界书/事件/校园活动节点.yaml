校园活动节点:
  定位: 高二上既有活动索引。以下秋季活动不在高三按月份自动重演；高二下、暑假、高三活动由当前学期生活条目提供。提前铺垫，参与自愿
  时间安排:
    国庆假期: 开学后第 2 个月（10/01—07），第一次校外长时间相处的机会
    体育周: 开学后第 2 个月中下旬，核心是班级篮球对抗赛
    期中考试: 开学后第 3 个月上旬，高二第一次大考，分班后首次正式排名
    远足: 开学后第 3 个月中下旬，地点优先老鹰山
    艺术周: 开学后第 4 个月，核心是十佳歌手和文艺汇演
    元旦: 开学后第 5 个月（次年 1 月 1 日），班级联欢与新年交界，低强度、短假期
    寒假: 开学后第 5 个月末开始，约三周，空间从学校转移到家庭和生活圈
    春节: 当年农历正月初一；公历日期随年份变化，以已确认日期为准

  活动边界:
    - 不在开学第一天直接触发所有活动，只能通过班会、公告、传闻做轻铺垫
    - 活动不是固定剧情，<user>可以参加、旁观或拒绝，临时变化只通过当场可观察的动静呈现
    - 活动可有班级公共目标；人物余波来自实际参与或接触。
    - 国庆假期和寒假是"校外自由期"，触发以角色邀约和<user>选择为主，不替<user>决定出游对象或聚会参与
    - 期中考试是"学术压力期"，考试本身是公共事件，但补习配对和成绩单反应是个人的
    - 春节是"家庭暴露期"，角色的家庭背景差异自动浮出水面，不需要额外制造剧情
