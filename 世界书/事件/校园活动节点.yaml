校园消息:
  - 在正文写完后的同一次变量更新，向校园.动态流最多补2至3条短动态。可写班群闲聊、同学朋友圈、趣事、八卦或前文余波。允许补写镜头外的小事，至少一条取材于近期公开剧情、时段或地点；别让每条都围着<user>转。
  - 各账号只知道公开或自己能知道的事。八卦标作传闻；动态不改时间、地点、关系、任务或玩家行为，不自动获得任何事实。不要把手账内容塞进正文；玩家可主动谈起。
  - 按变量更新规则写入校园消息。每条写标识、日期（YYYY-MM-DD）、渠道（公告/班群/来信/趣事/八卦/余波/朋友圈）、来源、标题、摘要（至多45字）、状态，并依当前剧情生成点赞列表与角色互动评论（无则为空数组）。
  - 校园.有效公告只收剧情已经确认的组织者通知，可经班群转达。朋友圈、闲聊和传闻只能写入动态流。
