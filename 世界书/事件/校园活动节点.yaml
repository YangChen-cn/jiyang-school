校园消息:
  - 仅在有公开新事件或合理生活闲聊时向校园.动态流更新（至多1至2条），无合适内容直接保持原值不变，禁止每轮硬编；别让每条都围着<user>转。
  - 真实性与私密保护：半私密/独处或无旁人在场的互动，严禁虚构路人撞见发帖；角色发帖严守性格与隐私边界，敏感心事与隐秘经历不主动发圈。各账号只知道公开或自己能知道的事。八卦标作传闻；角色可通过朋友圈或传闻自然了解公开事件，但严禁将未经公开的私密独处当全员已知。动态不改时间、地点、关系、任务或玩家行为。不要把手账内容塞进正文；玩家可主动谈起。
  - 按变量更新规则写入校园消息。每条写标识、日期（YYYY-MM-DD）、渠道（公告/班群/来信/趣事/八卦/余波/朋友圈）、来源、标题、摘要（至多45字）、状态，并依当前剧情生成点赞列表与角色互动评论（无则为空数组）。
  - 校园.有效公告只收剧情已经确认的组织者通知，可经班群转达。朋友圈、闲聊和传闻只能写入动态流。
