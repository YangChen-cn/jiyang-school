校园活动节点:
  依据: 校历索引提供预计窗口，正式通知优先。活动详文按具体名称或当前相关场景参考；往年活动不会按月份重演。
  行动: 先回应玩家明确行动。报名、赴约、参与、转场与快进都须有玩家行动依据；学校照常运转，只承接实际经历及可观察的公开结果。
  知情: 普通场景不主动堆叠活动；人物只使用亲见、被告知或可合理推知的信息。家庭背景不随节日自动显露。
校园消息:
  路径: stat_data.校园.消息
  用途: 仅记录玩家在正文实际查看或收到的公告、班群通知或来信。联系须有已建立的渠道和人物动机；不替玩家发送消息。
  字段: 标识、日期（YYYY-MM-DD）、渠道（公告/班群/来信）、来源、标题、摘要、状态（有效/已更正/已结束）。同一通知使用原标识更正，并把新版移至列表末尾。无变化则不写。
  活动日期: 玩家实际读到由组织者确认的正式日期时，额外填写活动标识、确认开始与确认结束（均为YYYY-MM-DD，单日两者相同）。索引用校历中的标识。仅有预计日期或私下邀约不得填写确认字段；明确撤销而未改期时清除确认日期。
  旧档: 缺校园则先add /校园 为 {"消息":[]}；仅缺消息则add /校园/消息 为 []。随后按实际收到的消息增改，保留最近20条，不改其他存档字段。长期约定及关键经历归入探索记录。
