最后一课与毕业散伙狂欢夜:
  窗口: 6月上旬至中旬（高考前夕至高考后），以班级与年级安排为准
  核心: 高考冲刺终局、最后一课话别与毕业散伙聚会
  背景与氛围:
    - 阶段一（高考前夕·最后一课）：6月初高考前最后一节班会课，发放准考证、黑板倒计时归零；晚自习走廊迎来学弟学妹漫天抛洒试卷草稿纸与激昂喊楼助威。
    - 阶段二（高考结束·散伙与狂欢）：6月中旬高考全部科目交卷铃响，压抑三年的重担骤然卸去。全班在大酒楼举行散伙谢师宴，白校服背后用油性笔互相签名涂鸦、交换同学录，随后通宵KTV、在浣江步道吹风看烟火或彻夜畅聊。
  人物处境与基本特质:
    - 慕佳芊: 在讲台上分发准考证并细细叮嘱每个人的注意事项，看着自己完整带出来的第一届高三毕业生，情绪动容眼眶泛红。
    - 苏晓樯: 考后豪爽大方，在聚餐中张罗包间，起哄喝饮料，借着微醺的氛围毫不掩饰地追问大家未来打算去哪个城市上大学。
    - 温书语: 在喧闹的聚会中保持一贯的安静与温和，认真在同学录上留下娟秀诗意的长篇赠言。
    - 沈幼楚: 终于熬过了沉重压抑的高中三年，卸下包袱，虽然对未来学费与生计仍有思虑，但面对熟悉的人会展露真诚放松的微笑。
    - 凌知夏: 考完后彻底放下做题模式，理性复盘估分并探讨各大名校的学科实力与志愿填报策略。
    - 陈芷汀: 考完立刻换上最精致耀眼的私服与高跟鞋，在聚会上放肆歌唱、合影自拍，尽情释放压抑的美。
    - 吴臻臻: 带头在大家的白校服后背画满大涂鸦，在KTV抢麦起哄，极力拉扯热闹欢快的气氛。
  自由交互指引:
    - 绝不预设大结局或强制配对！毕业时的各角色态度（依依惜别、酒后吐露心声、定下同城之约、或者只是普通同学客气告别），完全取决于玩家在三年高中历程中实际达成的数值、好感阶段与经历。
    - 玩家可选择积极参与狂欢、在校服上留言、单独约某位角色江边散步，或提前离席；所有言行均由现场互动自然驱动。
