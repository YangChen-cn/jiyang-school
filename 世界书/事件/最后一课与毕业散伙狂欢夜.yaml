@@if !!(typeof jyCampusEvents !== 'undefined' && jyCampusEvents['graduation-night'])
<%_ { const phase = typeof jyCampusEvents !== 'undefined' && jyCampusEvents['graduation-night']; if (phase) { _%>
最后一课与毕业散伙狂欢夜:
  日程: <%= phase.label %>
  核心: 考务、毕业手续及自愿散伙聚会
<%_ if (['before', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  筹备:
    - 班会与准考证发放按考务，吴臻臻统计同学录和散伙聚餐意愿。
<%_ } _%>
<%_ if (['window', 'live', 'undated'].includes(phase.kind)) { _%>
  现场素材:
    - 考前班会领证；高考结束后依实际订位聚餐、签同学录或提前离席，温书语自定是否递出留言，苏晚棠可邀人单约。
<%_ } _%>
<%_ if (['after', 'cancelled', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  收尾与重访:
    - 承接已递出的同学录、确认去向、约期与公开动态。
<%_ } _%>
<%_ } } _%>
