寒假:
  定位: 约三周假期，空间从学校彻底转移到各自的家庭和生活圈。"同班"关系暂时解除——想见面必须主动邀约。这是检验关系深度的天然标尺：谁会主动联系、谁会消失、谁在假期里变了
  时间: 2021年1月底至2月中，春节2月12日（正月初一）在寒假内
  铺垫:
    - 各角色收拾东西离开教室的方式本身就是性格说明书: 苏晓樯司机在校门外等、沈幼楚一个人拎着包走浣江方向
    - 教室清空那天最安静。黑板上还有人留着元旦倒计时的粉笔字——新的年份已经到了，旧的东西还没擦掉
  事件池:
    主动邀约:
      - 假期里谁先发消息、谁约<user>出来、约去哪里
      - 不再是"课间偶遇"——寒假里的每一次见面都是故意的，没有借口可用
    线上互动:
      - 深夜微信、朋友圈点赞评论、班群玩笑——线上互动比在学校更赤裸，因为没有"刚好碰到"可以当说辞
      - 陈芷汀凌晨发的自拍、温书语深夜分享的书摘链接——每一条都有观众
    寒假聚会:
      - 吴臻臻组织的聚会，来不来、坐谁旁边、谁提前走——全是信号
      - 聚会是寒假里唯一一次多人同场的机会，之前的线上互动和之后的线下反应都聚在这一场
    家庭景观:
      - 若<user>被邀请去某个角色家里，她的家庭环境就是她性格的说明书
      - 苏晓樯: 空荡荡的别墅客厅，物质过剩但没人
      - 沈幼楚: 老城小屋里的中药味和祖母的收音机
      - 温书语: 满墙的书架和窗边一把旧藤椅
    年前采购:
      - 春节前置办新衣服和年货，青悦城/万风/杭州商场成为假期偶遇地点
      - 苏晓樯逛奢侈品专柜、陈芷汀试衣服时对着镜子自拍、沈幼楚在超市散装糖果区反复比价
  触发:
    - 当 剧情.校园活动 为空且 世界.日期 进入 2021年1月底：将 剧情.校园活动 置为"寒假"，剧情.推进节奏 置为"事件触发"
    - 当最后一课结束、<user>离校、或收到假期邀约：将 剧情.当前事件 置为"寒假邀约"，剧情.事件冷却 置为 2
  退出:
    - 开学前一周或<user>明确结束假期：将 剧情.校园活动 置回"无"，剧情.当前事件 置为"家庭拜访"（余波），剧情.事件冷却 置为 1
    - 余波结束后：将 剧情.当前事件 置回"无"，剧情.推进节奏 置回"日常铺垫"
  注意:
    - 寒假时间跨越大，不要每一轮都写"假期第N天"。用关键节点推进: 放假当天→第一周→年前采购→除夕→正月→开学前夕
    - <user>若在假期始终保持被动，假期会自然过去——但开学后会发现某些关系的温度变了：没联系的人淡了，主动联系的人近了
    - 春节是"家庭暴露期"，角色的家庭背景差异自动浮出水面，不需要额外制造剧情
