@@if !!(typeof jyCampusEvents !== 'undefined' && jyCampusEvents['winter'])
<%_ {
const focus = getvar('stat_data.剧情.校园活动', { defaults: '' });
const spring = ['春节', 'spring-festival'].includes(focus) || (typeof lastUserMessage === 'string' && /春节|除夕|正月/.test(lastUserMessage));
const phase = typeof jyCampusEvents !== 'undefined' && jyCampusEvents[spring ? 'spring-festival' : 'winter'];
if (phase) { _%>
寒假:
  日程: <%= phase.label %>
  核心: 离校、春节与返校准备
<%_ if (['before', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  筹备:
    - 清理课桌、登记借书、核对值班与返校通知；春节按当年农历或确认日期。
<%_ } _%>
<%_ if (['window', 'live', 'undated'].includes(phase.kind)) { _%>
  现场素材:
    - 可留城、邀约、自习与探亲，营业与排班依当前安排；春节私事仅由接触或告知得知。
<%_ } _%>
<%_ if (['after', 'cancelled', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  收尾与重访:
    - 返校归还借物与交接班务，经历仅由知情者承接。
<%_ } _%>
<%_ } } _%>
