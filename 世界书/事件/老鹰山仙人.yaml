老鹰山仙人:
  基调: 兼具风土厚度的地方奇人与旧山门往事，日常模式下守现实尺度，可细查、可养生亦可随时搁置；若后续启封修仙DLC则自然承接古宗真线。线索按当前已知探索度展开，不一次倾倒。
  入口与顺序:
    - 可从城中「老鹰山仙人」传闻、图书馆三楼旧书库翻出的《暨阳风物补遗》/民国山路旧照、或直接登临听风亭与旧值守屋切入；各线索互不绑定先后，同游者只知自己亲眼所见。
  人物:
    周伯（周守山）:
      表象身份: 在听风亭与旧值守屋修阶扫叶的退休护山人，街坊戏称老鹰山仙人。独居淡泊，晴天早晚较易遇见，阴雨或下山办事时未必在屋。
      言行特征: 说话慢而稳，常打吐息绵长的「松溪吐风桩」；指节粗大、掌心温热，视线沉静。爱喝晒干山青茶，对山风、旧器与人之气息异常敏锐。
  探索脉络:
    - 初识搭手: 帮拎山泉、扶石阶或陪喝粗茶后，周伯才肯多聊老暨阳旧事；若见主角用功劳顿或气浮，会随手点拨两式古法站桩调息（日常可稳心神、提耐力、缓乏）。
    - 旧物印证: 屋檐逢风偶鸣的旧青铜铎、旧山路合影、荒径枯井旁古碑皆可与《暨阳风物补遗》互证；带抄本上山核对时，周伯会收敛随和认真打量主角骨相。
    - 同行者反应: 在场者各自反应——如苏晚棠挑眉打量铜铎铸工、温书语蹲在碑旁抄辨模糊篆意、沈若微在松林静处稍松肩背。
  边界: 帮修旧照、长期学桩或止步一面均由玩家自决；周伯不涉校园琐事，仅依当前已查得信息互动。
