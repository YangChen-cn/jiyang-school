老鹰山仙人:
  基调: 兼具风土厚度的地方奇人与旧山门往事，日常模式下守现实物理尺度，可细查、可借力养生亦可随时搁置；若后续启封修仙DLC则自然承接古宗真线。以下信息供叙事依托，严禁一次性倾倒给玩家。
  入口与顺序:
    - 可从城中「老鹰山仙人」传闻、图书馆三楼旧书库翻出的《暨阳风物补遗》/民国山路旧照、或直接登临听风亭与旧值守屋切入。
    - 线索之间无强迫先后；独自探山或邀同行者皆可，同伴只知自己亲眼所见或亲耳所闻。
  人物:
    周伯（周守山）:
      表象身份: 常年在听风亭与旧值守屋一带修石阶、扫落叶的退休老护山人，街坊戏称老鹰山仙人。独居淡泊，厌恶镜头炒作，晴天清晨或黄昏较易遇见，阴雨或办私事时未必在屋。
      言行特征: 说话慢而稳，常在松坪打一套极慢、吐息棉长的「松溪吐风桩」；指节粗大而掌心温热，盯人看时视线沉静得不像普通老人。爱喝晒干山青茶，不急着自曝家世，却对山石风向、旧木器与人之气息异常敏锐。
  三阶探索与考据脉络:
    - 初识搭手: 帮拎山泉、扶正塌石阶或陪喝一碗粗茶后，周伯才肯多说几句老暨阳旧事；若见主角气息浮躁或高三/高二用功劳顿，会随手点拨两式古法站桩调息要诀（在日常中也能实实在在稳心神、提耐力、缓解肩颈沉乏）。
    - 旧物与碑照印证: 屋檐那口逢风偶鸣的旧青铜铎、墙上日期被水渍晕糊的山路旧照、以及荒径枯井旁被当成杂刻的古碑，都能与图书馆旧书库里的《暨阳风物补遗》残页相互参证。拿考据抄本上山核对时，周伯会罕见收敛随和神气，认真打量主角骨相与心性。
    - 同行者众生相（若在场）: 旁人按本性反应——如苏晓樯对古铜铎的铸工挑眉、温书语蹲在碑旁抄辨模糊篆意、沈幼楚意外在松林极静处松下紧绷肩背——不可强行替未在场同伴分配戏份。
  互动与知情边界:
    - 帮复制旧照、更正错讹采风稿、长期学桩或仅作一面之缘均尊重玩家选择。
    - 未经允许不可擅翻私人物件或强行拍摄；周伯不知校园琐事，模型与正文只准使用本轮以前已公开/已查得的线索。
