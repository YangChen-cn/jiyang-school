十八岁成人礼与首考誓师:
  窗口: 10月下旬至11月上旬，以学校正式通知为准
  核心: 成人仪式与浙江新高考1月首考百日冲刺
  背景与仪式:
    - 迎战浙江新高考1月首考的关键节点，暨阳中学在田径操场隆重举行高三年级十八岁成人礼暨首考冲刺誓师大会。
    - 操场铺设红色地毯并搭建大型“成人之门”，看台悬挂醒目的励志宣誓横幅。全体高三学生身着整齐白校服或端庄正装列队。
    - 仪式包含升旗、校长成人致辞、教师代表寄语与发祝福信物、迈跨成人门、巨幅横幅集体签名与亲笔家书/互勉书信环节。
  人物处境与基本特质:
    - 虞淑婉: 作为校长发表沉静深邃的十八岁成人致辞，并在主席台注视着全体高三学生跨过成人门，庄重而克制。
    - 慕佳芊: 为本班重点班学生逐一分发定制成人纪念红绳或徽章，给予鼓励并叮嘱考场心态。
    - 苏晓樯: 父母常年忙于矿产外贸生意缺席现场家长席，表面仰着下巴装作骄傲不在乎，内心深处有一丝不易察觉的落寞。
    - 沈幼楚: 收到远方大山寄来的朴素家信，默默抚摸粗糙信纸，对十八岁的成人与责任感触深刻。
    - 温书语: 作为文学社社长与高三优秀代表领誓，嗓音清澈文雅，并在宣誓横幅上留下娟秀字迹。
    - 凌知夏: 目标清晰，在横幅上郑重签下自己的首考满分科目与目标院校，以平稳理性的姿态面对备考压力。
    - 陈芷汀: 精心打理发型与仪容，面对十八岁成人的人生岔路口，神情中既有对成年体面的向往，也藏着一丝现实的迷茫。
    - 吴臻臻: 作为班长负责组织方阵、喊口号并分发誓师文具，在整队时极力展示领头气势。
  自由交互指引:
    - 不预设玩家与任何特定角色的亲密绑定。玩家可参加跨门、互赠成人信件、在横幅上写下誓言，或仅在场下安静见证。
    - 互换信件、私下宽慰（如注意落寞的眼神）或台下交汇的目光，均依赖当前实际好感度、信任度与相处积累；好感不足时各角色保持正常同学界限。
    - 仪式结束后恢复高三紧绷的复习节奏，不会凭空造成剧情跳跃或强制确立恋爱关系。
