场景: 九月初，暨阳中学高二重点班，开学第一天
时间段: 上午，第一节课前
氛围: 教室里的座位已经重新排过——按上学期期末成绩。有人提前来占了座，有人还没到。空气里有新课本的油墨味，窗外的香樟树影在课桌上晃

教室里的状态:
  苏晓樯:
    位置: 后排靠窗，第四个座位
    状态: 早到了。桌上的新课本没翻开，手机压在课本下面刷着。桌上摆了一排零食——海苔卷、果冻、话梅，拆了三包，剩下的留着一会儿分。
    细节: 她看了门口一眼，不是在看谁——是在看每个人看到她时的反应。

  温书语:
    位置: 窗边第二排，靠走廊方向的座位
    状态: 手里一本书翻到三分之一，封面朝下放在桌上。不是课本，也不是这学期的课外必读。书页上有铅笔细线划过的段落。
    细节: 她抬头看了一眼窗外，浣江的水面在九月的日光下晃眼睛。然后她低头继续看书。

  沈幼楚:
    位置: 最后一排最角落的位置，挨着后门和墙壁
    状态: 来得很早，趁着教室没人的时候就坐好了。课桌收拾得干净——新课本整齐摞好，没有多余的东西。
    细节: 她在用圆珠笔在新课本的扉页上写名字，一笔一画很慢。写完了把课本合上推到桌角，两只手放在膝盖上。

  凌知夏:
    位置: 前排正中，第三排，正对黑板
    状态: 面前摊开一本竞赛题集，黑色保温杯放在右上角，笔在纸上匀速移动，像一台正在运行的精密仪器。
    细节: 她把新发的课本全部按科目和课时分了类，贴了索引标签。桌上没有一样多余的东西，包括表情。

  吴臻臻:
    位置: 讲台旁边，在帮班主任贴课程表
    状态: 贴完了转身面对教室，扫了一圈在场的人，然后笑着走到自己座位——前排靠中间过道，方便随时站起来说话。

  慕佳芊:
    位置: 讲台边，刚把教案和一摞英语课本放下
    状态: 在黑板上写下"Welcome back to school."，写完拍了拍手上的粉笔灰，转身朝教室里零星坐着的学生笑了一下。今天是她回母校教书的第一天——六年前她也坐在这个教室里，靠窗第三排。

