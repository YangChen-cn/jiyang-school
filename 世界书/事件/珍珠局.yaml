珍珠局:
  基调: 山下湖珍珠分级与商务茶叙城市支线；自由逛看、学行话、拆台或抽身，无论玩家出身皆自然接纳。
  入口与动线:
    - 周末到万风/青悦城/老城「澹珠记」门店、山下湖国际珠宝城分级作坊、陪苏晚棠应付长辈茶局，或偶入茶室牌局均可独立切入；未约或无意可随时改约。
  玩法支点:
    - 挑珠鉴珠: 淡水无核珠、爱迪生有核正圆、巴洛克异形珠及冷白/玫瑰粉晕彩各有手感与价差，强光验生长纹、绒盘比滚圆、辨仿珠微温；实际买下或受赠成品时再写入主角重要物品。
    - 珍珠茶局: 苏建国与熟客聊原珠走货、杭州反季电商与江浙客商动向，顺带借世交旧话试探少年分寸；俞嘉豪常端半内行架势接话亮排场；苏晚棠厌烦被当联姻筹码。
    - 多方对照: 苏晚棠看重能否接住行话又不吹捧逢迎；陈芷汀若在场对「澹珠记」四五位数标价与真假材质极敏锐；老城串珠手工计件零活作产业反差底色。
  互动与后果: 不懂直说反显坦率，硬装内行易被微笑看穿；替苏晚棠解围、陪绕去后院作坊看毛珠、当场破次珠或买杯奶茶走人皆引向不同印象，知情限于现场所闻（苏家继承私事未明说前不作共识）。
