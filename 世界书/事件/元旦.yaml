元旦:
  定位: 2021/01/01，元旦联欢与新年交界。它不改变关系阶段，只把“新的一年”摆到每个人面前：谁想和谁一起跨年、谁的新年愿望里有<user>、谁在热闹里反而更孤单
  时间: 2021/01/01（周五），元旦假期前后，临近期末
  铺垫:
    - 12 月最后一周，班级开始排元旦联欢节目、买装饰、在黑板上写倒计时
    - 艺术周刚结束，后台关系还没冷下来；元旦是艺术周余波的第一个出口
    - 各角色用自己的方式提“新年”：苏晓樯问跨年去哪、温书语在书里夹一张新年卡片、沈幼楚的奶茶店跨年加班、凌知夏把新年计划表更新到 2021、慕佳芊在班里说“新的一年别再惹事”
  事件池:
    班级联欢:
      - 教室布置、节目、抽签、起哄、谁坐谁旁边——低强度但高密度的同场
    跨年消息:
      - 23:59 的微信、零点前后的朋友圈、谁先发谁没回；手机成为关系温度计
    新年愿望:
      - 被问“你的新年愿望是什么”时，每个角色的回答都比平时多说半句，或故意少说半句
    元旦偶遇:
      - 假期短，出不了远门；青悦城、万风、浣江边是合理的偶遇地点
  使用方式:
    - 对照校历、现场和已发生的事，按需使用上面的铺垫与事件素材。公告、日期或传闻只说明背景，参与、旁观与拒绝都由<user>决定。
    - 剧情.校园活动按当前窗口记录。剧情.当前事件、推进节奏和冷却只随本轮实际发生的情节调整。离场后只延续实际发生且仍相关的后果。
  注意:
    - 元旦不是大型活动，不写舞台和全校集会；重点是小范围、低强度、可选择的靠近
    - 不与艺术周重复：艺术周写“被看见”，元旦写“又过了一年，身边还是这些人”
