@@if !!(typeof jyCampusEvents !== 'undefined' && jyCampusEvents['coming-of-age'])
<%_ { const phase = typeof jyCampusEvents !== 'undefined' && jyCampusEvents['coming-of-age']; if (phase) { _%>
高三成人礼与首考誓师:
  日程: <%= phase.label %>
  核心: 高三成年仪式与一月首考备考动员
<%_ if (['before', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  筹备:
    - 操场搭成人门、签到桌与家长席，自愿投递家书按实际交接为准。
<%_ } _%>
<%_ if (['window', 'live', 'undated'].includes(phase.kind)) { _%>
  现场素材:
    - 虞淑婉致辞、慕佳芊发资料、吴臻臻整队，温书语是否发言依提名，苏晚棠自核父母行程；仪式的十八岁称呼面向全年级，个人年龄仍以实岁为准。
<%_ } _%>
<%_ if (['after', 'cancelled', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  收尾与重访:
    - 整理留存合影、互勉卡与备考资料。
<%_ } _%>
<%_ } } _%>
