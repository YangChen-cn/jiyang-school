<%_ { const phase = typeof jyCampusEvents !== 'undefined' && jyCampusEvents['hike']; if (phase) { _%>
远足:
  日程: <%= phase.label %>
  核心: 学校集体远足，通常考虑老鹰山
<%_ if (['before', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  筹备:
    - 集合、费用与装备由老师班委通知，沈若微会先核对开销补给；备水餐雨衣，遇雨雾按通知改线。
<%_ } _%>
<%_ if (['window', 'live', 'undated'].includes(phase.kind)) { _%>
  现场素材:
    - 点名按体力分组前行，路上可分补给、照应磨脚；沿途有“老鹰山仙人”闲谈传闻，听风亭与旧值守屋线索按探索推进。
<%_ } _%>
<%_ if (['after', 'cancelled', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  收尾与重访:
    - 点名返程，归还公物处理遗失；未同行者仅知公开消息。
<%_ } _%>
<%_ } } _%>
