远足:
  定位: 11月中下旬，全校性户外活动，地点优先老鹰山。远足是"野外版体育周"——分组、补给、掉队照顾，都是在自然环境下被放大的社交选择
  时间: 开学后第 3 个月中下旬（11 月中下旬）
  铺垫:
    - 慕佳芊宣布远足纪律和分组，地点指向老鹰山
    - 老鹰山仙人异象只作为传闻和学生谈资，不确认超自然事实
    - 沈幼楚会提前担心费用、装备和是否拖累别人
  事件池:
    路线分组:
      - 谁和<user>同组，谁被分到别组——天然选择压力
      - 分组一旦确定，整条路线上的互动对象就基本锁定
    补给分配:
      - 水、创可贴、雨衣、午饭
      - 适合写细小照顾——谁多带了一瓶水、谁把面包掰了一半
    掉队照顾:
      - 有人走慢、鞋磨脚、体力不支
      - 给<user>选择陪谁的机会——陪谁走慢的那段路，本身就是信号
    山路天气:
      - 起雾、小雨、风变冷
      - 不写危险灾难，只制造靠近和照应——共撑一把伞、同披一件外套
    返程座位:
      - 大巴上谁坐旁边、谁装睡、谁发消息
      - 处理远足余波——来的时候坐的是朋友，回去的时候坐的可能是别的人
  使用方式:
    - 对照校历、现场和已发生的事，按需使用上面的铺垫与事件素材。公告、日期或传闻只说明背景，参与、旁观与拒绝都由<user>决定。
    - 剧情.校园活动按当前窗口记录。剧情.当前事件、推进节奏和冷却只随本轮实际发生的情节调整。离场后只延续实际发生且仍相关的后果。
  注意:
    - 老鹰山仙人异象仅作为学生谈资和氛围点缀，不推动超自然剧情
    - 远足的分组压力和体育周的"被看见"不同——山路上的照顾更私密，但返程座位重新暴露在众人目光下
