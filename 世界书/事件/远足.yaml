@@if !!(typeof jyCampusEvents !== 'undefined' && jyCampusEvents['hike'])
<%_ { const phase = typeof jyCampusEvents !== 'undefined' && jyCampusEvents['hike']; if (phase) { _%>
远足:
  日程: <%= phase.label %>
  核心: 学校集体远足，通常考虑老鹰山
<%_ if (['before', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  筹备:
    - 集合时间、集合点、费用和装备由带队老师与班委通知。沈若微可能想先核对费用与补给。个人来登山仍按个人路线行动。
    - 准备饮水、午餐、雨衣与联络方式；山路起雾、下雨时按天气确认线路与替代安排。
<%_ } _%>
<%_ if (['window', 'live', 'undated'].includes(phase.kind)) { _%>
  现场素材:
    - 从通知的集合点点名，按体力与路线分组；需要换队、停留或退出时与带队老师确认。路上可分补给、处理鞋磨脚或临时休息。
    - 有人议论“仙人”也只是传闻；听风亭和旧值守屋线索按个人调查推进。
<%_ } _%>
<%_ if (['after', 'cancelled', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  收尾与重访:
    - 按实际通知点名返程，处理遗失物和用过的补给。未参加的人只收到合理可知的公开消息。
<%_ } _%>
<%_ } } _%>
