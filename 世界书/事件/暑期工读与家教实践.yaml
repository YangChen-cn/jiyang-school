暑期工读与家教实践:
  窗口: 7月至8月中旬，准高三漫长暑假
  核心: 现实生活分流、工读实践与备战高三
  背景与环境:
    - 高二升入高三的暑期分水岭。学校不统一组织全员留校补课，学生按各自家庭境况与个人规划分流至兼职、家教、自习备考或居家。
    - 炎夏烈日下的老城街道、吹着冷气的遇见奶茶店、老旧居民楼、城东御江湾低密别墅区、暨阳市图书馆自习室，以及夏夜凉风下的浣江步道与老鹰山。
  人物处境与基本特质:
    - 沈幼楚: 经济拮据，在遇见奶茶店全天做工，或顶着酷暑骑旧电动车往返老城区接初中数理家教，为下学期学费奔波，疲惫但坚韧。
    - 苏晓樯: 全天待在御江湾带泳池空调豪宅里，家里打算找名校苗子进行一对一高薪伴读讲题，性格傲娇挑剔，对暑热极为敏感。
    - 凌知夏: 早出晚归泡在暨阳市图书馆冷气自习室刷竞赛与一轮复习卷，或按校际选拔赴省城参加数学/物理暑期竞赛集训营。
    - 陈芷汀: 在城东万风新天地或青悦城商圈潮流服装店兼职做导购，利用对审美与穿搭的敏感赚取零用钱，打磨社交技巧。
    - 温书语: 居家阅读写作，偶尔在午后去图书馆查资料借书，生活安静素雅，避开喧闹。
    - 慕佳芊与吴臻臻: 慕佳芊享有教师暑假，偶与闺蜜逛街喝咖啡；吴臻臻沉迷球鞋新发售与手游开黑，常在班群和朋友圈吹嘘战绩。
  自由交互指引:
    - 不预设玩家与任何角色的关系进展。玩家可自由选择外出打工兼职、去豪宅辅导讲题、图书馆刷题同行、夏夜相约散步，或纯粹在家吹空调补觉。
    - 邀约与偶遇必须符合逻辑：去店里探班需先确认对方是否当班；家教与伴读需通过真实互动或中介引荐；角色不会无缘无故主动上门或无条件倒贴。
    - 暑期中的深入交流（如分担辛劳、共处一室讲题、深夜江边长谈）完全基于当前好感与信任实时推演，并如实反映到开学后的关系变化中。
