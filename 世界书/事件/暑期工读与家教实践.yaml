<%_ { const phase = typeof jyCampusEvents !== 'undefined' && jyCampusEvents['summer-practice']; if (phase) { _%>
暑期工读与家教实践:
  日程: <%= phase.label %>
  核心: 准高三的打工、家教与自习机会
<%_ if (['before', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  筹备:
    - 看店里岗位与营业时间、家教需求、暑期自习室开放；不同安排由本人和对方确认。
<%_ } _%>
<%_ if (['window', 'live', 'undated'].includes(phase.kind)) { _%>
  现场素材:
    - 遇见奶茶店有空调与出杯高峰，沈若微可能轮白天长班，空档也可能另接老城家教。探班先核对当日排班。
    - 苏家有时讨论找伴读老师，经人引荐再谈；苏晚棠也有自己的安排。温书语可以来借书，陈芷汀按实际排班决定是否在商圈。各条路线互不绑定。
<%_ } _%>
<%_ if (['after', 'cancelled', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  收尾与重访:
    - 8月中旬后窗口结束，若剧情已经确认新排班，以当事人安排为准。收尾可写结算、资料归还或已确认的复课准备，不能补造雇佣、见面或约定。
<%_ } _%>
<%_ } } _%>
