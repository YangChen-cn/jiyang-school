@@if !!(typeof jyCampusEvents !== 'undefined' && jyCampusEvents['midterm'])
<%_ { const phase = typeof jyCampusEvents !== 'undefined' && jyCampusEvents['midterm']; if (phase) { _%>
期中考试:
  日程: <%= phase.label %>
  核心: 复习、考务与反馈
<%_ if (['before', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  筹备:
    - 课代表传达考纲与考场，借笔记和互助讲题由双方自愿约定归还。
<%_ } _%>
<%_ if (['window', 'live', 'undated'].includes(phase.kind)) { _%>
  现场素材:
    - 考场与自习室按考务开放，缺考按校规登记。
<%_ } _%>
<%_ if (['after', 'cancelled', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  收尾与重访:
    - 承接已发放的成绩反馈，他人名次与家庭反应依实际公开。
<%_ } _%>
<%_ } } _%>
