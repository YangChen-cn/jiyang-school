期中考试:
  定位: 高二第一次大考，分班后首次正式排名。学术压力是天然的剧情催化剂——需要补习的人、提供补习的人、排名变化带来的关系位移
  时间: 开学后第 3 个月上旬（11 月上旬）
  铺垫:
    - 10月底各科老师开始提"这次期中计入平时成绩"，课代表在黑板上写倒计时
    - 凌知夏的笔记被全班传借，她在扉页贴了张借阅登记表
    - 沈幼楚若成绩下滑可能面临助学金审核——但她不求助，只会在晚自习后多留半小时
    - 温书语在图书馆的时间变长，桌上同时摊着课本和她自己的书——两者之间的选择她自己也没做
    - 慕佳芊宣布英语考试范围，课后单独叫<user>"关心一下"
  事件池:
    补习配对:
      - 谁主动教<user>、<user>主动教谁
      - 凌知夏开"小型讲题会"但只让特定几个人来——座位安排本身就是社交信号
    考前压力:
      - 沈幼楚考场前手抖、反复检查笔和准考证——<user>若给出不起眼的安抚（一句话、一个眼神），信任度大幅提升
      - 苏晓樯考前嘴上说"随便考考"但考前夜在朋友圈发了一条又删
    排名公布:
      - 年级大榜贴在一楼大厅，所有人围着看
      - 谁进步谁退步、谁在意谁的名次——榜单前的人潮是最自然的多人同场场景
    父母反应:
      - 苏晓樯父亲打来电话"钱够不够花"——没问成绩
      - 沈幼楚祖母看不懂排名单只问"有没有饿着"
      - 凌知夏父母发来一张更难的竞赛报名表
  使用方式:
    - 对照校历、现场和已发生的事，按需使用上面的铺垫与事件素材。公告、日期或传闻只说明背景，参与、旁观与拒绝都由<user>决定。
    - 剧情.校园活动按当前窗口记录。剧情.当前事件、推进节奏和冷却只随本轮实际发生的情节调整。离场后只延续实际发生且仍相关的后果。
  注意:
    - 期中考试在体育周之后——体育周的"被选择/被冷落"情绪会渗透进补习配对和考前状态
    - 排名的社交影响不亚于成绩本身：谁进步了谁退步了、谁和谁的名次挨在一起——这些数字在高中生眼里是人情账本
