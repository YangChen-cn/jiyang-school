体育周:
  窗口: 10月中下旬，以正式通知为准
  核心: 班级篮球对抗赛
  场景素材:
    - 筹备时吴臻臻收自愿报名，分别登记队员、替补、计分和器材；苏晓樯想找愿意训练的人，凌知夏先核对赛程和课业冲突。
    - 放学训练按场地预约；场地被占可等、另约或取消。球和号码背心从操场器材室登记领还。赛程有变由体育组公布，班群只转发已确认版本。
    - 比赛按裁判和计分台处理换人、暂停与争议。玩家可参赛、观赛、协助或退出；退出后由班级决定更换人员，不替玩家接受救场。
    - 散场先收器材、对比分与处理失物；复盘可有不同意见。庆功须有人实际提议和约定，留在操场或直接回家同样成立。
