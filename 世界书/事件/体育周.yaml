@@if !!(typeof jyCampusEvents !== 'undefined' && jyCampusEvents['sports'])
<%_ { const phase = typeof jyCampusEvents !== 'undefined' && jyCampusEvents['sports']; if (phase) { _%>
体育周:
  日程: <%= phase.label %>
  核心: 班级篮球对抗赛
<%_ if (['before', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  筹备:
    - 吴臻臻按意愿登记队员、替补、计分与器材，苏晚棠可找训练搭档；放学用场预约、器材室借还及赛程以体育组公告为准。
<%_ } _%>
<%_ if (['window', 'live', 'undated'].includes(phase.kind)) { _%>
  现场素材:
    - 比赛由裁判与计分台处理换人、暂停及争议，可参赛、观赛、帮忙或退场替补。
<%_ } _%>
<%_ if (['after', 'cancelled', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  收尾与重访:
    - 归还器材核比分，复盘实际分工或争议；庆功须有人实际组织。
<%_ } _%>
<%_ } } _%>
