体育周:
  定位: 2020年10月中下旬，核心是班级篮球对抗赛。体育周是校内公共事件——所有人都在同一个操场上，谁给谁加油、谁给谁送水，全部被看见
  时间: 2020年10月中下旬
  铺垫:
    - 班会通知篮球对抗赛，吴臻臻登记队员、后勤、计分和宣传
    - 苏晓樯嫌班里没人有斗志，嘴上嫌弃但会盯着报名表
    - 凌知夏把赛程、体能、对手班级数据整理成表
  事件池:
    班级篮球对抗赛:
      - <user>可上场、替补、计分、送水或被临时拉去救场
      - 场上的每一次传球和投篮都被全班注视
    啦啦队后勤:
      - 递水、毛巾、创可贴、拍照
      - 后勤位置容易产生被看见的偏爱——谁第一个把水递给<user>、<user>第一个把水递给谁
    受伤处理:
      - 擦伤、扭脚、手指戳伤
      - 只写校园运动伤，不夸张——伤口的处理比伤势本身更有信息量
    班级荣誉:
      - 输赢都会带来班级情绪
      - 吴臻臻和苏晓樯反应最明显——一个是面子一个是真性情
    赛后庆功:
      - KFC、正新鸡排或青悦城
      - 座位选择和谁坐旁边会产生余波，比比赛本身更值得写
  触发:
    - 当 剧情.校园活动 为空且 世界.日期 进入 2020年10月中下旬：将 剧情.校园活动 置为"体育周"，剧情.推进节奏 置为"事件触发"
    - 当<user>报名、被拉去救场、或班级进入赛程：将 剧情.当前事件 置为"班级篮球对抗赛"，剧情.事件冷却 置为 2
  退出:
    - 决赛结束或赛后庆功散场：将 剧情.校园活动 置回"无"，剧情.当前事件 置为"赛后庆功"（余波），剧情.事件冷却 置为 1
    - 余波结束后：将 剧情.当前事件 置回"无"，剧情.推进节奏 置回"日常铺垫"
  注意:
    - 体育周是"被看见"的高密度场景——后勤、加油、赛后庆功，每一次靠近都被同学看在眼里
    - 国庆假期建立的亲近度会在体育周放大：出游过的人有了默契，没出游的人可能被冷落
