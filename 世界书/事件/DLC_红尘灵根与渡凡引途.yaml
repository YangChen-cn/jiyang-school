[DLC事件｜红尘灵根与太微渡凡引]
触发背景: 开启都市修仙DLC后生效。暨阳其余七位女主并非全部沦为凡人陪衬，亦绝非全员修仙；其中仅极少数暗怀微末隐性灵根，其余人仍为真切凡骨——而主角若愿付出惨重代价与机缘，亦可借古宗秘法替无灵根故人逆天争一线登仙之门。

七人灵根分布（少数隐灵根 × 多数凡骨的真实张力）:
  温书语（隐性·水木清灵根）:
    特质: 极晦涩难察的文心水木之姿，不喜争斗厮杀。日常仅表现为心思空灵、直觉极准；唯有在图书馆三楼旧书库研读《暨阳风物补遗》/云岫散佚残卷、或随主角在老鹰山静心感气时，指尖与灵台才会透出微不可察的青木润泽与神识共鸣。
    心性与边界: 不慕无情长生，却是最易在书卷禅意里读懂云清晏古意、替主角破译古宗篆录的温润知音。
  沈幼楚（隐性·玄阴寒魄微苗）:
    特质: 年少孤寒忍苦竟暗暗养出守一静骨，体内蛰伏一丝极隐蔽的玄阴寒脉；平日只显为极度怕冷、夜视与直觉奇准、在老鹰山松风寂静处反倒舒展。
    心性与边界: 因生计拮据与重重「信任度」心防，初时对任何超凡之事只有本能自卑与警惕（总念着先挣够学费与安稳）；唯有信任完全交付、并得主角护持引脉后方愿试探修行，而引气恰好能渐次抚平她常年畏寒体虚之苦。
  其余五人（苏晓樯、许念安、陈芷汀、慕佳芊、虞淑婉）:
    体质界定: 皆属货真价实的无灵根凡躯。即便苏家执掌「澹珠记」蕴灵古珠、许念安强行想把主角留在同一张高三时间表里、虞淑婉守着一校体面与半生孤寂，她们天生并无接纳游离灵气之窍。正因如此，才构成真实刺骨的「仙凡两隔」宿命落差。

专属破局之路·「太微渡凡引」（凡骨逆天引渡登仙之途）:
  秘法源流: 太微云岫宗昔年祖师为凡人挚亲留下的禁术残篇《太微渡凡引》，并非寻常丹药，须探透老鹰山沉封内门或合参云清晏神魂古录方得全法；可令主角耗本源替一名无灵根凡躯强开后天「培灵之窍」（伪灵根入门）。
  四重严苛前置与惨重代价（绝不廉价大甩卖，每渡一人必是一段大高潮剧情）:
    1. 境界硬前提: 主角自身修为至少达「筑基后期」或「金丹境」以上，具备纯正充沛真元护持他人闭塞经脉不裂；低境强渡必致双双反噬危及性命。
    2. 奇珍天材地宝: 每次施法须聚齐并消耗耗尽极难复得的组合灵物——如「老鹰山潜龙主眼石髓/灵泉心液」＋「澹珠记祖传极品蕴灵古母珠或万风地库古器本源精粹」＋「特调秘档级千年大药」，不可批发现造。
    3. 自身代价: 施引者须割舍大段真元本源与精血，事后自身必定**境界跌落至少一重小境界**并陷数周重伤暗耗期；绝无一天之内连渡数人的可能。
    4. 因果自愿与后天局限: 逆开灵窍痛比抽髓，且成道后仅得「后天培灵基」（进境慢于天生灵根，仍需长久护持）；必须向对方坦陈风险与告别凡俗喧嚣的后果、由她本人亲口抉择是否愿意同行。若有人（如苏晓樯、陈芷汀、慕佳芊等）权衡后仍恋现世烟火与亲友，主角唯有尊重其选择、或以凡世极境丹药延年安享一世。
