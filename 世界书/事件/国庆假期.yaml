@@if !!(typeof jyCampusEvents !== 'undefined' && jyCampusEvents['national'])
<%_ { const phase = typeof jyCampusEvents !== 'undefined' && jyCampusEvents['national']; if (phase) { _%>
国庆假期:
  日程: <%= phase.label %>
  核心: 留城与短途安排
<%_ if (['before', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  筹备:
    - 吴臻臻可以问谁愿意结伴，私人行程由本人决定是否公开。苏晓樯有家庭安排，沈幼楚看店里排班，温书语另有阅读计划。
    - 去杭州或绍兴先核对车次、集合点、返程余量和家庭安排。邀约可以拒绝、改期或取消。
<%_ } _%>
<%_ if (['window', 'live', 'undated'].includes(phase.kind)) { _%>
  现场素材:
    - 留城可去老城、影院、浣江步道，也可在家。营业与偶遇以当地与人物实际安排为准。错过车次先查替代交通。
<%_ } _%>
<%_ if (['after', 'cancelled', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  收尾与重访:
    - 返校后只承接实际借物、照片、约定、同行与失约。未公开的照片和行程不进班群；没有出游或联络不自动减好感。
<%_ } _%>
<%_ } } _%>
