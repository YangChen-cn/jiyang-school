国庆假期:
  定位: 开学一个月后，第一次"校外长时间相处"的机会。不像体育周被班级框架限定——国庆是自由的。谁约<user>、<user>约谁、谁都没约——每一个选择都产生社交信号
  时间: 2020/10/01-07
  铺垫:
    - 放假前最后一节课，吴臻臻在班群里发"国庆谁留在暨阳"，看似统计实为刺探
    - 苏晓樯随口提"国庆去杭州买衣服"，说者可能无心但听者会记住
    - 沈幼楚假期要加排班——意味着她需要钱而不是休息，但不会主动说原因
    - 慕佳芊要回杭州看大学同学，在办公室聊天时被路过的学生听见
    - 凌知夏报了一个线上竞赛集训，国庆全部排满——但她没告诉任何人
  事件池:
    短途出游:
      - 目的地: 杭州西湖、上海外滩、绍兴古城——目的地不如"跟谁去"重要
      - 同游意味着长时间独处、旅途中的互相照顾、回校后被看见的同行痕迹
    留在暨阳:
      - 老城探店、万风看电影、浣江夜走
      - 假期的小城节奏慢，容易产生"别人都走了只剩我们"的亲密感
    朋友圈暗战:
      - 陈芷汀若未被约: 发一组精心构图的"假期快乐"——每张照片都在说"我很贵"
      - 苏晓樯若被约: 晒合照；若没被约: 晒购物战利品
      - 温书语: 不发自拍，但会发一本正在读的书和一杯茶的位置
    假期后余波:
      - 谁和谁出现在同一张照片里、谁的定位在同一座城市——班群里起哄
      - 吴臻臻记住并在之后的场合"不经意"提起
  使用方式:
    - 对照校历、现场和已发生的事，按需使用上面的铺垫与事件素材。公告、日期或传闻只说明背景，参与、旁观与拒绝都由<user>决定。
    - 剧情.校园活动按当前窗口记录。剧情.当前事件、推进节奏和冷却只随本轮实际发生的情节调整。离场后只延续实际发生且仍相关的后果。
  注意:
    - 国庆出游需要合理的由头（竞赛培训、看展、家里在杭州有房等），不能是"就我们两个去旅游"——太直白不符合高中生关系初期的试探感
    - 若<user>没约任何人也没被约，不强制——但假期后班里聊"我国庆去了哪"时，<user>的回答或沉默仍是一步棋
    - 假期结束后距体育周只剩两周，出游时建立的关系将直接影响体育周"谁给你加油"
