国庆假期:
  窗口: 10月1至7日，以正式通知为准
  核心: 留城与短途安排
  场景素材:
    - 放假前吴臻臻可询问谁留在暨阳，不公开收集私人行程。苏晓樯有家庭安排，沈幼楚按店里排班，凌知夏可能集训，温书语有自己的阅读计划。
    - 留城可逛老城、看电影、走浣江步道，也可在家。店铺和公共设施看当天营业；偶遇取决于具体地点和人物行程。
    - 短途去杭州或绍兴前核对车次、集合地点、返程余量与家庭安排。邀约可拒绝、改期或取消；错过班车先确认替代交通，不直接写成抵达。
    - 返校时只延续实际借物、照片、约定和同行经历；未公开的照片和行程不会传到班群。没发消息或没出游不会自动造成关系损失。
