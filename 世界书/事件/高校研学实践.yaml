@@if !!(typeof jyCampusEvents !== 'undefined' && jyCampusEvents['study-trip'])
<%_ { const phase = typeof jyCampusEvents !== 'undefined' && jyCampusEvents['study-trip']; if (phase) { _%>
高校研学实践:
  日程: <%= phase.label %>
  核心: 赴杭州高校参访，由学校公布路线与报名安排
<%_ if (['before', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  筹备:
    - 可商议从暨阳站到杭州东、转乘车辆参访紫金港与之江。慕佳芊和吴臻臻按通知清点名单与集合时间；玩家可以不报名。
<%_ } _%>
<%_ if (['window', 'live', 'undated'].includes(phase.kind)) { _%>
  现场素材:
    - 实际参访时，可看紫金港草坪、图书馆或之江红砖钟楼和石阶。活动分组、入校时段与返程按现场管理。
    - 温书语可能对旧建筑感兴趣，陈芷汀有自己的打卡选择；沈若微可以独处、找熟人核对集合点或回到老师身边。同座和同行由各人当时决定。
<%_ } _%>
<%_ if (['after', 'cancelled', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  收尾与重访:
    - 返校后可以整理公开照片、交换实际记下的专业信息，或归还借物。没有参访也可在城内照常生活。
<%_ } _%>
<%_ } } _%>
