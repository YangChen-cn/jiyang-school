高校研学实践:
  窗口: 5月中旬，期中考后，以学校正式通知为准
  核心: 省城名校参访与班级研学
  背景与路线:
    - 暨阳中学组织高二骨干班级赴杭州研学实践，由暨阳站乘高铁半小时直达杭州东站，再转大巴参访浙江大学紫金港校区与月轮山旁的之江老校区。
    - 紫金港校区以现代化大草坪、图书馆与前沿理工学科见长；之江校区依山面江，拥有近代红砖钟楼、石阶与浓郁人文底蕴。
  人物处境与基本特质:
    - 慕佳芊与吴臻臻: 慕佳芊作为随行英语老师协调带队与纪律，吴臻臻协助清点人数、拿旗整队并借机在女生前张罗指挥。
    - 苏晓樯: 对高铁二等座略有挑剔但出手大方，随身带遮阳伞与高级零食，自费请大家喝饮品特调，打探别人未来理想院校与城市。
    - 温书语: 偏爱文史与老校区建筑，容易被之江校区的近代文人典故、红砖尖顶与林间石道吸引，倾向于安静散步或做笔记。
    - 沈幼楚: 平时极少出远门，面对大城市动车人流和宏大名校校园容易显得局促内敛，习惯性跟在熟悉的人身旁或走在队伍靠后位置。
    - 凌知夏: 关注学科前沿实验室、自招保送与强基计划咨询点，理性收集高校专业选科要求与历年分数线。
    - 陈芷汀: 注重出行仪态与穿搭，在校区著名地标打卡拍照，发朋友圈与社交平台，展现精致一面。
  自由交互指引:
    - 不预设玩家与任何特定角色的亲密程度。角色的好感反应、是否愿意同座、结伴漫步、共同交流未来志向，完全交由当前已建立的关系与现场对话实时推演。
    - 玩家可选择跟随大部队集体观光、小范围自由组队、脱队自习或单独散步；散步与自由活动需在规定集合时间前返回集合点。
    - 研学结束后统一乘坐大巴返程，日常校园环境恢复，仅承接实际发生的交集、留影与对话。
