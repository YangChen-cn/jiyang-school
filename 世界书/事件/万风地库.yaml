@@if ((place, zone, input) => /万风/.test(place) || !(/^(?:校园|家)$/.test(zone) || /学校|教室|教学楼|校长室/.test(place)) || /万风[^。！？\n]{0,24}(?:地库|车库|停车场|下楼|[取拿]车|\bB[12]\b|负[一二12]层)/i.test(input) || /(?:下楼|下到|电梯)[^。！？\n]{0,10}(?:\bB[12]\b|负[一二12]层)/i.test(input))(getvar('stat_data.世界.当前位置', { defaults: '' }), getvar('stat_data.世界.所在区域', { defaults: '' }), typeof lastUserMessage === 'string' ? (lastUserMessage.match(/<本轮用户输入>([\s\S]*?)<\/本轮用户输入>/)?.[1] ?? lastUserMessage) : '')
