万风地库:
  基调: 城东商业与住宅地下空间暗线，自由观察、可查可避；不强行安排撞破，不替代玩家定性。以下仅供叙事依托，禁提前剧透给在场角色。
  入口与动线:
    - 经城东万风新天地地上商街（餐饮、影院、健身房）乘直梯下至 B1/B2 商业车库，或由写字楼/住宅访客梯厅经过地库通道均可独立展开。
    - 晚自习散场后（约 21:30 起）与周末午后至夜间为接送车与散场人流高峰；B2 西北侧柱网暗区、无招牌日料及健身房专用直梯口照明偏暗，人流稀疏。
    - 物业保安与夜间清洁了解常用停车区和监控覆盖范围，但不认识外校或高二学生姓名，也不会向无权限者调监控或泄露车牌隐私。
  并行线索（按合理行程与视野自然触发）:
    - 暗角车影与礼袋交接: 周末傍晚或夜场前后，B2 偏僻柱间偶有挂临牌或外地牌照的入门跑车停靠。仅当陈芷汀与俞嘉豪按各自安排实际同时在该时段到场且处于主角视线所及范围，才可能看见背影、熄火前尾灯、拆一半的名牌礼袋或压低声音的短暂嘱咐；双方绝不自爆聊天记录或当场摊牌。
    - 城东日常交叉: 住附近小区的许念安采购返程、慕佳芊停车取物、苏晓樯同朋友散场取车都属寻常动线；未发生交集时只作普通擦肩或顺路礼貌寒暄，不强塞戏剧冲突。
    - 个人随身线索: 若主角恰好携带或回放合规视野内的记录（如本人拍下的模糊背影或车载行车画面），只揭示画面里客观能辨识的信息，不凭空补全未知对话。
  互动与后果:
    - 看见端倪可装作没看见、上前寒暄打招呼、默记车牌待后、或私下挑明/借坡替人解围；一切反应与立场由玩家自行决定。
    - 双方对此事均高度保密。模糊试探时，陈芷汀惯用"表哥顺路/代拿快递/看花眼了"轻描淡写挡回；俞嘉豪则以"帮朋友带盒东西"或体面笑话打圆场。仅当握有现场实证或贴脸撞破并在私下点透，才引起陈芷汀的紧张重估与交易/防备变化，或令俞嘉豪客气面具变冷。
    - 转身离开、仅吃顿饭逛完地上商铺不进地库、或以后再看均完全有效，不阻断主线日常。
  知情边界:
    - 模型知晓暗线配置，不等于主角、苏晓樯或其他在场同学已知道；严禁未曾亲眼目击或得当事人口述时让旁人跑去传话或对质。
