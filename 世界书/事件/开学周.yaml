开学周:
  定位: 2020/09/01 前后第一周。分班名单、新座位、新课本、新班委——所有关系从“还不熟”开始。这是全卡唯一一个允许“谁都不认识谁”的窗口
  时间: 2020/09/01—09/07
  铺垫:
    - 分班名单贴在一楼公告栏，学生挤着看；重点班名单和前 40 名是公开话题
    - 新教室、新座位：苏晓樯靠窗后排、沈幼楚最后一排角落、凌知夏前排/竞赛组、吴臻臻班长
    - 领书、搬书、值日表、班委选举、校服与校园卡——大量低强度公共事务
    - 开学典礼和第一次升旗：校长在台上讲话，学生在台下，虞淑婉第一次以“校长”身份被看见
  事件池:
    座位与同桌:
      - 谁和谁坐、谁想换、谁被老师点名调开——第一周最直接的社交信号
    领书与值日:
      - 搬书、发书、排值日表、收班费；适合让吴臻臻表现，让沈幼楚被边缘化
    班委选举:
      - 吴臻臻理所当然、温书语被推举、凌知夏只肯当学习委员一类的“效率岗位”
    第一印象:
      - 每个角色对<user>的初次判断；不急着好感，只留下一个记忆点
  触发:
    - 当 世界.日期 进入 2020/09/01—09/07 且 剧情.学期 为“高二上”或空：将 剧情.当前事件 置为“无”，剧情.推进节奏 置为“日常铺垫”，剧情.事件冷却 置为 0
    - 当<user>报到、进教室、领书、参加开学典礼：按在场角色给第一印象，不强制任何角色主动示好
  退出:
    - 开学周结束或第一次正式上课：将 剧情.当前事件 置回“无”，剧情.推进节奏 置回“日常铺垫”
    - 把第一周留下的座位、同桌、班委、第一印象作为后续事件的伏笔，不在此处收束
  注意:
    - 初始变量全为空时，用这一周把 世界.所在区域、所在位置、在场角色和关系阶段慢慢补齐；不要一次填满
    - 不写“所有人第一眼就喜欢<user>”；苏晓樯的第一反应是没注意，虞淑婉是几千学生之一
