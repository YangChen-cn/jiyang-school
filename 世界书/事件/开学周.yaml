@@if !!(typeof jyCampusEvents !== 'undefined' && jyCampusEvents['opening'])
<%_ { const phase = typeof jyCampusEvents !== 'undefined' && jyCampusEvents['opening']; if (phase) { _%>
开学周:
  日程: <%= phase.label %>
  核心: 报到、领课本与班务
<%_ if (['before', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  筹备:
    - 查看分班名单与报到通知；迟到或没领到课本可找班委补登。
<%_ } _%>
<%_ if (['window', 'live', 'undated'].includes(phase.kind)) { _%>
  现场素材:
    - 按老师安排领书、核对座位；换座与值日分工须确认，不代玩家选。已有旧识沿用开场与聊天。
<%_ } _%>
<%_ if (['after', 'cancelled', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  收尾与重访:
    - 只延续已经确定的座位、借物和班务。没有发生的竞选和初识不补写。
<%_ } _%>
<%_ } } _%>
