艺术周:
  日程: <%= phase.label %>
  核心: 高二下十佳歌手与文艺汇演
<%_ if (['before', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  筹备:
    - 征集歌手与班级节目：温书语可校主持稿，陈芷汀留意妆造舞台，慕佳芊协调节目档期。音乐教室可预约排练、核对伴奏器材。
<%_ } _%>
<%_ if (['window', 'live', 'undated'].includes(phase.kind)) { _%>
  现场素材:
    - 彩排核对走位、候场与音响，临场状况由工作人员协调；后台凭证件任务进出，观众走观众口。
<%_ } _%>
<%_ if (['after', 'cancelled', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  收尾与重访:
    - 归还器材、确认署名与公开照片，保留磨合与失误余韵。
<%_ } _%>
<%_ } } _%>
