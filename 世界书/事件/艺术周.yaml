@@if !!(typeof jyCampusEvents !== 'undefined' && jyCampusEvents['arts'])
<%_ { const phase = typeof jyCampusEvents !== 'undefined' && jyCampusEvents['arts']; if (phase) { _%>
艺术周:
  日程: <%= phase.label %>
  核心: 高二下十佳歌手与文艺汇演
<%_ if (['before', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  筹备:
    - 分开征集歌手和班级节目。温书语可以校主持稿，陈芷汀可留意服装舞台，慕佳芊按档期协调；报名不等于入选。
    - 音乐教室可预约，核对伴奏版本、器材、归还时间；有冲突可调整节目、另约或退出。
<%_ } _%>
<%_ if (['window', 'live', 'undated'].includes(phase.kind)) { _%>
  现场素材:
    - 彩排逐项核对走位、候场、音响；临场失误由在场工作人员处理。后台按任务通行，观众走观众入口。
<%_ } _%>
<%_ if (['after', 'cancelled', 'window', 'live', 'undated'].includes(phase.kind)) { _%>
  收尾与重访:
    - 按实际分工归还器材、确认署名与公开照片的范围。替补、失误与磨合可留到重访。
<%_ } _%>
<%_ } } _%>
