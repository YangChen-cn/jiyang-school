艺术周:
  定位: 2020年12月，核心是十佳歌手和文艺汇演。艺术周是"舞台版体育周"——台上的人被全校注视，后台的人被彼此注视。排练期的单独相处是艺术周真正的暗线
  时间: 2020年12月
  铺垫:
    - 十佳歌手报名表贴到公告栏，文艺汇演节目开始征集
    - 温书语可参与主持词、朗诵或幕后文案；陈芷汀会注意舞台和服装
    - 慕佳芊负责班级节目协调，必须维持教师身份
  事件池:
    十佳歌手报名:
      - 谁被起哄报名，谁推<user>上去，谁在旁边观察
      - 报名表上的名字本身就是一种表态
    排练:
      - 教室、音乐教室、礼堂后台
      - 排练期间的单独相处最容易产生误会和靠近——走廊尽头的音乐教室晚上只有两个人
    服装伴奏选择:
      - 青悦城、万风新天地可作为采购地点
      - 陪谁选衣服、帮谁挑伴奏——都是越界的借口
    文艺汇演:
      - 舞台灯光、座位、候场、掌声和失误后的救场
      - 台上的人只能被看，台下的人可以选择看谁
    后台偶遇:
      - 陈芷汀、温书语、苏晓樯可用不同方式制造短暂独处
      - 后台的走廊、幕布后面、空化妆间——艺术周的后台比舞台更值得写
  注意:
    - 慕佳芊作为教师不能公开偏袒任何人，但可以在节目协调、排练时间安排上做文章
    - 艺术周的社交后果会在寒假邀约中体现——谁在后台靠近了，谁就会在假期里收到消息
