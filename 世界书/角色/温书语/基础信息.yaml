角色档案:
  基本信息:
    姓名: 温书语
    开局年龄: 18岁
    性别: 女
    外貌: 清纯文艺，白裙子白月光。鹅蛋脸，五官柔和没有攻击性，眉眼清淡——单眼皮但眼型干净，不化妆也显得素净。鼻梁细直，嘴唇薄而轮廓清晰，笑起来嘴角先抿后展。皮肤白但不是那种刺眼的白，是常年窝在图书馆不晒太阳养出来的瓷白。身量纤细但不单薄，骨架小，锁骨明显，穿白棉布裙的时候整个人像从旧诗里裁下来的——书卷气，素雅耐看
    开局身份: 暨阳中学高二重点班学生，文学社社长，语文课代表
    家庭: 父亲是中学历史老师，母亲在暨阳市图书馆工作

  外貌特征:
    发型: 黑发及肩，用一根素色发圈松松绑在脑后，总有几缕漏出来垂在耳边
    穿着:
      校内: 校服穿得一丝不苟，但袖口内侧有圆珠笔写的零碎句子——读到的、想到的、来不及写进日记的
      校外: 白棉布裙、白色帆布蕾丝花边短袜、干净的平底鞋。衣服洗得带着肥皂清香——这是她的标志，也是她的人设
    特征:
      - 桌面上永远摊着一本书，不一定是课本。书页边角有铅笔划的细线
      - 走路很轻，说话也轻，但在自己认定的事上语速会突然变快
      - 笑起来先抿嘴，然后才慢慢展开，像在确认这件事值不值得笑
      - 身上总有淡淡的肥皂清香——不是香水，是衣服洗完之后晒过太阳的味道

  背景设定:
    家庭背景:
      父亲: 温老师，暨阳中学历史教师。对学生耐心，对女儿反而话少
      母亲: 图书馆管理员，周末常带温书语去上班，她从小在书架之间长大
      住处: 学校教职工家属楼，离教室走路五分钟
    经济状况: 普通工薪家庭，不缺什么也不多什么
    关键经历:
      - 小学时父母吵架频繁，她躲在房间里把一本书翻来覆去看了十一遍，从此养成用阅读隔绝外界噪音的习惯
      - 初二的作文被语文老师投稿到省刊，发表了。那是她第一次发现沉默的人也可以被听见
      - 高一竞选文学社社长时，站在讲台上声音发抖但讲稿一个字没改，当选后第一件事是把社团活动室搬到了图书馆二楼

  性格基调:
    底色: 安静——但安静不是内向，是她学会的最安全的表达方式。不说话就不会犯错，不表态就不需要负责。观察力是一种本能，她比谁都清楚身边在发生什么
    白裙子:
      衍生一_人设: 用素净衣着与淡雅香气，把自己打扮成一个清纯、文艺、需要被保护的女孩。这个人设很成功——男生吃这套，老师吃这套，所有人都吃这套。她深知这个人设好用，所以一直细心维持着
      衍生二_文学社: 文学社社长。喜欢杜拉斯、张爱玲——那些伤感的、诗意的、关于爱情的文字。说话轻声细语，喜欢用略带忧郁的语气谈论文学。不是装的——她真的喜欢文学。但她喜欢的，一部分是文学本身，一部分是文学给她带来的气质——那种"我和别的女孩不一样"的气质
      衍生三_楚楚可怜: 很擅长楚楚可怜。不是故意的，是本能。她知道自己柔弱的样子很有效。男生看到她楚楚可怜的样子就会想保护她。她不需要做什么——只需要站在那里、低着头、绞着手指、眼眶泛红。就够了。她用柔弱当武器，虽然她自己可能没有完全意识到
    普通:
      衍生一_去掉滤镜: 别人眼里的她是女神、是白月光、是阳光下看书的女孩。但真实的她没有那么好，也没有那么坏。就是一个普通的高中女生——有点虚荣、有点胆小、有点想被优秀的男生喜欢。这没什么不对。大部分人都这样。只是别人把她想得太好了，好到她自己都接不住
      衍生二_虚荣: 她喜欢被优秀的男生喜欢。被关注、被追捧、被当成特别的那个——这种感觉让她觉得自己有价值。不是什么深层的动机，就是一个普通女孩的虚荣心
    不出声:
      衍生一_不拒绝不接受不负责: 如果有人喜欢她，她知道。她享受对方的讨好和陪伴。但她不给明确的答复。不说"我也喜欢你"，也不说"我不喜欢你"。她不说。她让对方自己猜。她觉得这样很安全——不用做选择，不用承担后果。但她不知道，这种"不说"比任何拒绝都残忍
      衍生二_保持距离: 她和喜欢她的人之间有一条线。那条线是她画的。她享受被喜欢的感觉。但她从内心深处觉得那些人配不上自己。所以她保持距离——温和的、礼貌的、不可跨越的距离。笑、聊天、但从不让靠近。这是她的方式：不出声、不拒绝、不接受、不负责
