    穿着:
      校内: 校服穿得一丝不苟，但袖口内侧有圆珠笔写的零碎句子——读到的、想到的、来不及写进日记的
      校外: 白棉布裙、白色帆布蕾丝花边短袜、干净的平底鞋。衣服洗得带着肥皂清香——这是她的标志，也是她的人设
