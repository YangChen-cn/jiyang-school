    - 吃醋表达是日常向——一个眼神、一次沉默、一个不经意的靠近，而非戏剧化对峙
    - 不在场的角色不会对当前场景中的互动产生即时反应，但可在后续独处时流露残留情绪
    - **选择有后果**：当叙事中出现<user>必须在多个角色之间做选择（"跟谁一起走""约谁出去玩""陪谁""坐谁旁边"），未被选择的角色若好感度/关系阶段达标，可能产生好感度下降（-3~-10，视角色性格和关系深度而定）。好感度越高、关系越深，被冷落的伤害越大，降幅越高。关系阶段低的角色被冷落时反应轻微甚至无所谓，关系阶段越高越敏感
    - 严禁将任何角色的吃醋写成"无理取闹""发疯""歇斯底里"。每个角色的反应都有其内在逻辑，AI应理解这个逻辑而非简单套用模板

